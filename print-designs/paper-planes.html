<!doctype html>
<html><head><meta charset="utf-8"><title>Máy bay giấy: the print</title>
<link rel="stylesheet" href="/node_modules/@fontsource/pacifico/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/dancing-script/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/600.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/800.css">
<link rel="stylesheet" href="/node_modules/@fontsource/playfair-display/400-italic.css">
<link rel="stylesheet" href="/node_modules/@fontsource/patrick-hand/400.css">
<style>
/* The printed card = the tracking image. "Máy bay giấy" (paper planes) as a sketched city postcard: cream paper, ink and
   pencil greys only, shade done with pencil hatching. Airmail bars round the edge; the title on a postcard label top
   left; a windy grey street of office blocks (window grids with blinds, plants, curtains, and one open window on each
   side of the street where a plane sets off), rooftops with water tanks and aerials, a tangle of wires on a pole, a
   lamp post with a note taped to it; the stamp and the postmark top right; the address side of the postcard bottom
   right; the zebra crossing in the lower middle, drawn light, is where the act stands (x 427–853, y 400–800), with the
   instruction ribbon under it. Paper planes everywhere, each with its own dashed flight path, and five of the paths end
   at the one coloured thing on the card: a coral heart. Hatching and window grids are jittered line by line, nothing
   is mirrored or tiled, and all randomness is seeded, so every render is the same picture. */
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#f4eee0}
svg{display:block}
</style></head><body>
<svg id="card" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const rng = s => () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; const r = rng(912);
const C = { paper: '#f4eee0', sheet: '#fbf8f1', wash: '#ebe5d8', wash2: '#dfd9cd', wash3: '#cfcac1', ink: '#232a35', ink2: '#38404d',
  pen: '#59616d', pencil: '#848b94', pencil2: '#a6abb1', pencil3: '#c8cacb', coral: '#f26b5b' };
const F = { title: 'Pacifico', hand: 'Dancing Script', sans: 'Be Vietnam Pro', serif: 'Playfair Display', note: 'Patrick Hand' };
const GY = 548, CURB = 562, NEAR = 686;                               // where the houses stand, the far curb, the near curb
const n1 = v => Math.round(v * 10) / 10;
const J = a => (r() - .5) * 2 * a;
const pick = a => a[(r() * a.length) | 0];
const rad = d => d * Math.PI / 180;
const pt = (cx, cy, rr, deg) => [n1(cx + Math.cos(rad(deg)) * rr), n1(cy + Math.sin(rad(deg)) * rr)];
const tf = (x, y, a = 0, s = 1) => `translate(${n1(x)} ${n1(y)})${a ? ` rotate(${n1(a)})` : ''}${s !== 1 ? ` scale(${s})` : ''}`;
const g = (x, y, a, s, inner) => `<g transform="${tf(x, y, a, s)}">${inner}</g>`;
const ink = (sw = 2, c = C.ink) => `stroke="${c}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"`;
const T = (x, y, str, o = {}) => `<text x="${n1(x)}" y="${n1(y)}" font-family="${o.f || F.sans}" font-weight="${o.w || 800}" font-size="${o.s || 14}"` +
  `${o.style ? ` font-style="${o.style}"` : ''}${o.ls ? ` letter-spacing="${o.ls}"` : ''}${o.anchor ? ` text-anchor="${o.anchor}"` : ''} fill="${o.fill || C.ink}"` +
  `${o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 4}" paint-order="stroke" stroke-linejoin="round"` : ''}>${str}</text>`;
const hand = (x, y, str, o = {}) => T(x, y, str, { f: F.note, w: 400, s: 15, fill: C.ink2, stroke: C.paper, sw: 4, ...o });
const measure = (str, font) => { const c = measure.c || (measure.c = document.createElement('canvas').getContext('2d')); c.font = font; return c.measureText(str).width; };
const R = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
const poly = P => P.map(p => `${n1(p[0])} ${n1(p[1])}`).join(' L');
let CID = 0;
const clip = (d, inner) => { const id = `k${CID++}`; return `<clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };

/* what the scatter keeps clear of */
const BOX = [];
const keep = (x0, y0, x1, y1) => BOX.push([x0, y0, x1, y1]);
const blocked = (x, y, m = 0) => BOX.some(([a, b, c, d]) => x > a - m && x < c + m && y > b - m && y < d + m);

/* ── the pen: lines that wobble, overshoot their ends a little, and now and then skip ── */
function wline(x1, y1, x2, y2, w = .8, o = 2, br = 0) {
  const len = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / len, uy = (y2 - y1) / len, nx = -uy, ny = ux;
  if (br && len > 24 && r() < br) {
    const m = .3 + r() * .4, gp = 1.5 + r() * 2.5, mx = x1 + (x2 - x1) * m, my = y1 + (y2 - y1) * m;
    return wline(x1, y1, mx - ux * gp, my - uy * gp, w, o) + wline(mx + ux * gp, my + uy * gp, x2, y2, w, o);
  }
  const n = Math.max(1, Math.round(len / 80)), s0 = o * r(), s1 = o * r();
  let d = `M${n1(x1 - ux * s0 + nx * J(w * .3))} ${n1(y1 - uy * s0 + ny * J(w * .3))}`;
  for (let i = 1; i <= n; i++) {
    const tm = (i - .5) / n, te = i / n, off = J(w);
    const ex = i === n ? x2 + ux * s1 : x1 + (x2 - x1) * te + nx * J(w * .4), ey = i === n ? y2 + uy * s1 : y1 + (y2 - y1) * te + ny * J(w * .4);
    d += `Q${n1(x1 + (x2 - x1) * tm + nx * off)} ${n1(y1 + (y2 - y1) * tm + ny * off)} ${n1(ex)} ${n1(ey)}`;
  }
  return d;
}
const wpoly = (P, w, o, br) => P.map((p, i) => { const q = P[(i + 1) % P.length]; return wline(p[0], p[1], q[0], q[1], w, o, br); }).join('');
function srect(x, y, w, h, o = {}) {
  const { fill = 'none', sw = 1.4, c = C.ink, wob = .7, os = 2.2, br = .12 } = o;
  return (fill !== 'none' ? `<rect x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}" fill="${fill}"/>` : '') +
    `<path d="${wpoly(R(x, y, w, h), wob, os, br)}" fill="none" ${ink(sw, c)}/>`;
}
function spoly(P, o = {}) {
  const { fill = 'none', sw = 1.4, c = C.ink, wob = .7, os = 2, br = .1 } = o;
  return (fill !== 'none' ? `<path d="M${poly(P)}Z" fill="${fill}"/>` : '') + `<path d="${wpoly(P, wob, os, br)}" fill="none" ${ink(sw, c)}/>`;
}

/* ── the pencil: hatching inside a convex polygon, every stroke its own spacing, tilt, length and skips ── */
function clipLine(P, px, py, dx, dy) {
  let area = 0; for (let i = 0; i < P.length; i++) { const [a, b] = P[i], [c, d] = P[(i + 1) % P.length]; area += a * d - c * b; }
  const sg = area > 0 ? 1 : -1; let t0 = -1e9, t1 = 1e9;
  for (let i = 0; i < P.length; i++) {
    const [x1, y1] = P[i], [x2, y2] = P[(i + 1) % P.length], nx = -(y2 - y1) * sg, ny = (x2 - x1) * sg;
    const num = nx * (px - x1) + ny * (py - y1), den = nx * dx + ny * dy;
    if (Math.abs(den) < 1e-9) { if (num < 0) return null; continue; }
    const t = -num / den;
    if (den > 0) t0 = Math.max(t0, t); else t1 = Math.min(t1, t);
  }
  return t0 < t1 ? [t0, t1] : null;
}
function hatch(P, ang, sp, o = {}) {
  const { c = C.pencil, sw = .8, jit = .3, br = .18, skip = .05, aj = 2.5, inset = 1.4, wob = .5 } = o;
  const nx = -Math.sin(rad(ang)), ny = Math.cos(rad(ang));
  const cx = P.reduce((a, p) => a + p[0], 0) / P.length, cy = P.reduce((a, p) => a + p[1], 0) / P.length, c0 = cx * nx + cy * ny;
  const offs = P.map(([x, y]) => x * nx + y * ny), hi = Math.max(...offs);
  let d = '';
  for (let off = Math.min(...offs) + sp * (.2 + .8 * r()); off < hi; off += sp * (1 - jit + 2 * jit * r())) {
    if (r() < skip) continue;
    const a = rad(ang + J(aj)), dx = Math.cos(a), dy = Math.sin(a), px = cx + nx * (off - c0), py = cy + ny * (off - c0);
    const tt = clipLine(P, px, py, dx, dy); if (!tt) continue;
    const t0 = tt[0] + inset * r() * 1.6, t1 = tt[1] - inset * r() * 1.6;
    if (t1 - t0 < 1.5) continue;
    let parts = [[t0, t1]];
    if (br && t1 - t0 > 18 && r() < br) { const m = t0 + (t1 - t0) * (.25 + .5 * r()), gp = 1.5 + r() * 4; parts = [[t0, m - gp], [m + gp, t1]]; }
    for (const [a0, a1] of parts) {
      const x0 = px + dx * a0, y0 = py + dy * a0, x1 = px + dx * a1, y1 = py + dy * a1;
      d += wob && a1 - a0 > 16 ? `M${n1(x0)} ${n1(y0)}Q${n1((x0 + x1) / 2 + nx * J(wob))} ${n1((y0 + y1) / 2 + ny * J(wob))} ${n1(x1)} ${n1(y1)}` : `M${n1(x0)} ${n1(y0)}L${n1(x1)} ${n1(y1)}`;
    }
  }
  return d ? `<path d="${d}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"/>` : '';
}
const xhatch = (P, ang, sp, o = {}) => hatch(P, ang, sp, o) + hatch(P, ang + 72 + J(14), sp * (1.05 + r() * .3), o);

/* ── curves: a smooth line through points, loops and spirals to put in it ── */
function spline(pts) {
  let d = `M${n1(pts[0][0])} ${n1(pts[0][1])}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C${n1(p1[0] + (p2[0] - p0[0]) / 6)} ${n1(p1[1] + (p2[1] - p0[1]) / 6)} ${n1(p2[0] - (p3[0] - p1[0]) / 6)} ${n1(p2[1] - (p3[1] - p1[1]) / 6)} ${n1(p2[0])} ${n1(p2[1])}`;
  }
  return d;
}
/** a loop-the-loop that starts at p heading `dir`°; side −1 loops up and over when heading right */
function loop(p, dir, rr, side = -1, adv = .7) {
  const ux = Math.cos(rad(dir)), uy = Math.sin(rad(dir)), cx = p[0] - uy * side * rr, cy = p[1] + ux * side * rr, a0 = Math.atan2(p[1] - cy, p[0] - cx), out = [];
  for (let k = 1; k <= 8; k++) { const a = a0 + side * k / 8 * Math.PI * 2, f = k / 8; out.push([cx + Math.cos(a) * rr + ux * f * rr * adv, cy + Math.sin(a) * rr + uy * f * rr * adv]); }
  return out;
}
function spiral(cx, cy, r0, r1, a0, turns, sg = 1) {
  const out = [], N = Math.round(turns * 10);
  for (let k = 0; k <= N; k++) { const f = k / N, a = rad(a0) + sg * f * turns * Math.PI * 2, rr = r0 + (r1 - r0) * f; out.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
  return out;
}

/* ── small things ── */
/** a folded paper dart, its nose at (0,0) pointing along +x, z long; bank (−1…1) tips it */
function plane(z, o = {}) {
  const { bank = 0, light = false } = o, sw = Math.max(1, Math.min(2.2, z * .045)), c = light ? C.pencil : C.ink;
  const A = [-z, -z * (.44 + .16 * bank)], B = [-z * .76, z * .02], D = [-z * .92, z * (.34 - .14 * bank)], M = [-z * .3, z * .01], K = [-z * .64, z * (.2 + .06 * bank)];
  let s = `<path d="M0 0 L${poly([B, D])}Z" fill="${light ? C.wash2 : C.wash3}" ${ink(sw, c)}/>`;
  if (z > 22) s += hatch([[0, 0], B, D], -58 + J(10), Math.max(1.5, z * .045), { c: light ? C.pencil2 : C.ink2, sw: .65, inset: 1, br: 0 });
  s += `<path d="M${poly([M, B, K])}Z" fill="${light ? C.wash : C.ink2}" ${ink(sw * .9, c)}/>`;
  s += `<path d="M0 0 L${poly([A, B])}Z" fill="${C.sheet}" ${ink(sw, c)}/>`;
  if (z > 16) s += `<path d="M${n1(-z * .1)} ${n1(-z * .04)} L${n1(-z * .84)} ${n1(-z * .3)}" ${ink(sw * .45, c)}/>`;
  return s;
}
const DASH = ['7 6', '3 6', '10 5 2 5', '5 4', '2 6', '12 6', '4 4 1 4', '8 4'];
/** a plane at the end of its dashed flight path */
function flight(pts, z, o = {}) {
  const { dash = pick(DASH), sw = 1.5, c = C.ink, halo = true, bank = J(.6), light = false } = o;
  const d = spline(pts), [x2, y2] = pts[pts.length - 1], [x1, y1] = pts[pts.length - 2];
  let s = halo ? `<path d="${d}" fill="none" stroke="${C.paper}" stroke-width="${n1(sw + 4)}" stroke-linecap="round"/>` : '';
  s += `<path d="${d}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-dasharray="${dash}" stroke-linecap="round"/>`;
  return s + g(x2, y2, Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI, 1, plane(z, { bank, light }));
}
const heartD = z => `M0 ${n1(z * .38)} C${n1(-z * .95)} ${n1(-z * .18)} ${n1(-z * .48)} ${n1(-z * .9)} 0 ${n1(-z * .42)} C${n1(z * .48)} ${n1(-z * .9)} ${n1(z * .95)} ${n1(-z * .18)} 0 ${n1(z * .38)}Z`;
/** a gust: a tail that curls up into a spiral */
function swirl(z, o = {}) {
  const { turns = 1.15 + r() * .5, c = C.ink, sw = 1.7, flip = false, tail = 3 } = o;
  const pts = [[-z * tail, z * (1.16 + J(.1))], [-z * tail * .58, z * (1.02 + J(.08))], [-z * .7, z * 1.01]];
  const N = Math.round(turns * 12);
  for (let k = 0; k <= N; k++) { const f = k / N, a = Math.PI / 2 - f * turns * Math.PI * 2, rr = z * (1 - .74 * f); pts.push([Math.cos(a) * rr, Math.sin(a) * rr]); }
  return `<path d="${spline(flip ? pts.map(([x, y]) => [-x, y]) : pts)}" fill="none" ${ink(sw, c)}/>`;
}
const bird = (z, c = C.ink) => `<path d="M${n1(-z)} 0 Q${n1(-z * .5)} ${n1(-z * .6)} 0 ${n1(z * .05)} Q${n1(z * .45)} ${n1(-z * .62)} ${n1(z * 1.05)} ${n1(-z * .12)}" fill="none" ${ink(1.3, c)}/>`;
/** a cloud sketched in pencil, its underside hatched */
function cloud(w, o = {}) {
  const { c = C.pen, sw = 1.5 } = o, n = 4 + (r() * 3 | 0), pts = [];
  for (let i = 0; i <= n; i++) { const t = i / n; pts.push([-w / 2 + w * t + (i && i < n ? J(w * .03) : 0), i && i < n ? -Math.sin(Math.PI * t) * w * (.1 + .07 * r()) - w * .04 : 0]); }
  let d = `M${n1(pts[0][0])} ${n1(pts[0][1])}`;
  for (let i = 1; i <= n; i++) { const [x, y] = pts[i], [px, py] = pts[i - 1], dd = Math.hypot(x - px, y - py) / 2; d += ` A${n1(dd * (1 + r() * .2))} ${n1(dd * (.95 + r() * .25))} 0 0 1 ${n1(x)} ${n1(y)}`; }
  d += ` C${n1(w * .3)} ${n1(w * .07)} ${n1(-w * .3)} ${n1(w * .05)} ${n1(pts[0][0])} ${n1(pts[0][1])}Z`;
  return `<path d="${d}" fill="${C.sheet}"/>` + clip(d, hatch(R(-w / 2, -w * .06, w, w * .15), 24 + J(8), 2.2, { c: C.pencil, sw: .75 }) + hatch(R(-w / 2, w * .01, w, w * .1), -30 + J(8), 2.4, { c: C.pen, sw: .7 })) + `<path d="${d}" fill="none" ${ink(sw, c)}/>`;
}
/** a loose sheet in the wind: bent, ruled, one corner folded over */
function paper(w, h, o = {}) {
  const { word = null, scrib = r() < .6 } = o;
  const P = [[-w / 2 + J(2), -h / 2 + J(2)], [w / 2 + J(2), -h / 2 + J(2)], [w / 2 + J(2), h / 2 + J(2)], [-w / 2 + J(2), h / 2 + J(2)]];
  const f = Math.min(w, h) * (.2 + r() * .12), A = [P[2][0] - f, P[2][1]], B = [P[2][0], P[2][1] - f], Tp = [P[2][0] - f * .95, P[2][1] - f * .95];
  const body = [P[0], P[1], B, A, P[3]], bd = `M${poly(body)}Z`;
  let lines = '';
  for (let y = -h / 2 + 5 + r() * 3; y < h / 2 - 3; y += 4.2 + r() * 2.6) lines += `M${n1(-w / 2 + 2)} ${n1(y)}L${n1(w / 2 - 2)} ${n1(y + J(.5))}`;
  let s = `<path d="${bd}" fill="${C.sheet}"/>` + clip(bd, `<path d="${lines}" stroke="${C.pencil2}" stroke-width=".7"/>`);
  if (scrib) { let q = ''; for (let k = 0; k < 2 + (r() * 3 | 0); k++) { const y = -h / 2 + 7 + k * 6.5, x0 = -w / 2 + 4, l = (w - 12) * (.4 + r() * .5); q += `M${n1(x0)} ${n1(y)}`; for (let x = 0; x < l; x += 4) q += ` q2 ${n1(-2.5 + J(.8))} 4 0`; } s += clip(bd, `<path d="${q}" fill="none" ${ink(.75, C.ink2)}/>`); }
  if (word) s += T(-w / 2 + 4, -h / 2 + 13, word, { f: F.note, w: 400, s: 11.5, fill: C.ink2 });
  return s + `<path d="${wpoly(body, 1.4, 1.2, 0)}" fill="none" ${ink(1.3)}/>` + spoly([A, B, Tp], { fill: C.wash2, sw: 1.1, os: .6, br: 0 });
}

/* ── the card: airmail bars in ink and pencil round the edge, words on plaques, the cream sheet inside ── */
function sheet() {
  let s = `<defs><clipPath id="frame"><path d="M0 0H1280V800H0Z M32 32V768H1248V32Z" clip-rule="evenodd"/></clipPath></defs>`;
  s += `<rect width="1280" height="800" fill="${C.sheet}"/>`;
  let st = '';
  for (let x = -820, i = 0; x < 1300; i++) {
    const w = 11 + r() * 17, col = [C.ink, null, C.pencil, null][i % 4];
    if (col) st += `<path d="M${n1(x)} 0 L${n1(x + w)} 0 L${n1(x + w + 800)} 800 L${n1(x + 800)} 800Z" fill="${col}"/>`;
    x += w;
  }
  s += `<g clip-path="url(#frame)">${st}</g><rect x="32" y="32" width="1216" height="736" fill="${C.paper}" ${ink(2.4)}/>`;
  const plaque = (x, y, a, str, size = 11) => {
    const w = measure(str, `800 ${size}px "${F.sans}"`) + str.length * 2.2 + 26;
    return g(x, y, a, 1, `<rect x="${n1(-w / 2)}" y="-11" width="${n1(w)}" height="22" rx="11" fill="${C.sheet}" ${ink(1.8)}/>` + T(0, 4, str, { s: size, ls: 2.2, anchor: 'middle' }));
  };
  s += plaque(660, 16, 0, 'BƯU THIẾP  ·  MÁY BAY GIẤY  ·  AIR MAIL  ·  PHỐ GIÓ');
  s += plaque(610, 784, 0, 'GẤP MỘT CHIẾC  ·  GỬI MỘT LỜI  ·  BY WIND  ·  No. 0912');
  s += plaque(16, 430, -90, 'GIÓ ĐƯA ĐƯỜNG  ·  THE WIND KNOWS');
  s += plaque(1264, 372, 90, 'TẦNG 9  ·  PHỐ BÊN KIA');
  return s;
}

/* ── the sky: pencil clouds, birds ── */
function sky() {
  let s = g(578, 104, -2, 1, cloud(150)) + g(818, 168, 4, 1, cloud(92)) + g(508, 384, 0, 1, cloud(64, { c: C.pencil }));
  [[690, 64, 7], [712, 80, 5], [664, 84, 4.5], [470, 214, 6], [1004, 222, 5.5], [776, 220, 4]].forEach(([x, y, z]) => { s += g(x, y, J(10), 1, bird(z)); });
  return s;
}

/* ── the far skyline in the middle, low and light, behind the street ── */
function distant() {
  let s = '';
  for (let x = 488; x < 852;) {
    const w = 30 + r() * 44, top = 384 + r() * 70;
    s += srect(x, top, w, GY - top, { fill: pick([C.wash, '#e8e2d5', C.paper]), sw: 1.1, c: C.pencil, wob: .6, br: .2 });
    const cols = Math.max(2, Math.round(w / 13)), rows = Math.floor((GY - top - 14) / 15);
    let d = '';
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      if (r() < .22) continue;
      const cw = (w - 8) / cols, wx = x + 4 + i * cw + J(.7), wy = top + 7 + j * 15 + J(.7), ww = cw * (.45 + r() * .2), wh = 6 + r() * 3;
      d += `M${n1(wx)} ${n1(wy)}h${n1(ww)}v${n1(wh)}h${n1(-ww)}z`;
    }
    s += `<path d="${d}" fill="none" stroke="${C.pencil2}" stroke-width=".8"/>`;
    if (r() < .5) s += hatch(R(x + w * .62, top + 2, w * .36, GY - top - 4), 58 + J(10), 3.4 + r(), { c: C.pencil3, sw: .8 });
    if (r() < .45) s += antenna(x + w * (.25 + r() * .5), top, 16 + r() * 14, C.pencil);
    x += w + (r() < .35 ? 4 + r() * 10 : -1);
  }
  return s;
}

    if (k < .45) { const z = 9 + r() * 7, l = 18 + r() * 16, ang = rad(a); s += `<path d="M${n1(x - Math.cos(ang) * l)} ${n1(y - Math.sin(ang) * l + J(5))} Q${n1(x - Math.cos(ang) * l * .5)} ${n1(y - Math.sin(ang) * l * .5 + J(8))} ${n1(x)} ${n1(y)}" fill="none" stroke="${stage ? C.pencil : C.ink2}" stroke-width="1" stroke-dasharray="2 3"/>` + g(x, y, a, 1, plane(z, { light: stage })); }
    else if (k < .7) s += g(x, y, a, 1, swirl(4 + r() * 3, { c: stage ? C.pencil : C.pen, sw: 1.1, tail: 2.2 }));
    else if (k < .85) s += g(x, y, a * 3, 1, paper(10 + r() * 6, 12 + r() * 6, { scrib: false }));
    else s += `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(1.6 + r() * 1.6)}" fill="${stage ? C.pencil : C.ink2}"/>`;
  }
  return s;
}

const FACES = [`400 76px "${F.title}"`, `700 104px "${F.hand}"`, `italic 400 19px "${F.serif}"`, `400 17px "${F.note}"`, `600 14px "${F.sans}"`, `800 14px "${F.sans}"`];
Promise.all(FACES.map(f => document.fonts.load(f, 'Máy bay giấy Đặt thiệp hướng điện thoại ƯỚC Every'))).then(() => {
  const out = sheet() + sky() + distant() + wires() + leftSide() + rightSide() + street() + crossing() + pole() + lampPost() + bicycle(232, 560) + mailbox(1224, 560) +
    stool(904, 560) + stool(924, 562) + stool(1004, 560) + papers() + swirls() + wanderers() + toHeart() + bigHeart() + titleLabel() + stamp() + postmark(1084, 226, 46) +
    addressLabel() + ribbon() + scatter();
  document.getElementById('card').innerHTML = out;
  return document.fonts.ready;
}).then(() => { window.__ready = true; });
</script>
