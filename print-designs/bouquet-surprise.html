<!doctype html>
<html><head><meta charset="utf-8"><title>Bouquet Surprise card</title>
<link rel="stylesheet" href="/node_modules/@fontsource/dancing-script/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/pacifico/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/patrick-hand/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/600.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/800.css">
<link rel="stylesheet" href="/node_modules/@fontsource/playfair-display/900.css">
<style>
/* The printed card = the tracking image. "Bó hoa bất ngờ" (a surprise bouquet) as a florist's postcard: a striped shop
   awning with a hanging sign, the script title, a chalkboard price list (prices in hugs and smiles), zinc buckets of roses,
   tulips and sunflowers with a price tag, seed packets, rolls of wrapping paper and ribbon on the counter, butterflies, and
   a leafy wreath round the middle of the card, where the two of them meet (the act's centre is the card's centre, 640 x
   400; the stage's x is 640 + 1280x, its z is 400 + 1280z). Every shape is inked in deep green (#1f3326) so the tracker
   sees edges everywhere. Nothing mirrored, nothing repeated; everything random is seeded, so every render is identical. */
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#21402f}
svg{display:block}
</style></head><body>
<svg id="card" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const rng = s => () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; const r = rng(1402);
const C = { ink: '#1f3326', band: '#21402f', paper: '#fff7ec', cream: '#fffdf6', kraft: '#e2c29b', kraft2: '#c99f72', wood: '#b07a4c', wood2: '#8a5a35',
  rose: '#e2456f', rose2: '#f07c9b', pink: '#f8a7be', pink2: '#fcd0dc', blush: '#ffe7ee', red: '#d61f45', wine: '#9e1b3d',
  leaf: '#72bd68', green: '#3f8f4c', moss: '#2d6a3c', sage: '#b4d7a8', mint: '#cdeedb', gold: '#f2b84b', butter: '#ffe08a',
  sun: '#ffc53d', brown: '#7a4a2a', sky: '#9fd3ef', blue: '#5f9fd4', lilac: '#c9b3f2', violet: '#8a64c9', zinc: '#c2d5df', zinc2: '#93b2c3',
  chalk: '#28392f', chalkInk: '#fbf6ea', peach: '#ffc39e' };
const F = { hand: 'Dancing Script', sans: 'Be Vietnam Pro', round: 'Pacifico', chalk: 'Patrick Hand', serif: 'Playfair Display' };
const n1 = v => Math.round(v * 10) / 10;
const pick = a => a[(r() * a.length) | 0];
const rad = d => d * Math.PI / 180;
const pt = (cx, cy, rr, deg) => [n1(cx + Math.cos(rad(deg)) * rr), n1(cy + Math.sin(rad(deg)) * rr)];
const tf = (x, y, a = 0, s = 1) => `translate(${n1(x)} ${n1(y)})${a ? ` rotate(${n1(a)})` : ''}${s !== 1 ? ` scale(${s})` : ''}`;
const g = (x, y, a, s, inner) => `<g transform="${tf(x, y, a, s)}">${inner}</g>`;
const T = (x, y, str, o = {}) => `<text x="${n1(x)}" y="${n1(y)}" font-family="${o.f || F.sans}" font-weight="${o.w || 800}" font-size="${o.s || 14}"` +
  `${o.ls ? ` letter-spacing="${o.ls}"` : ''}${o.anchor ? ` text-anchor="${o.anchor}"` : ''} fill="${o.fill || C.ink}"` +
  `${o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 4}" paint-order="stroke" stroke-linejoin="round"` : ''}>${str}</text>`;
const measure = (str, font) => { const c = measure.c || (measure.c = document.createElement('canvas').getContext('2d')); c.font = font; return c.measureText(str).width; };
const fit = (str, weight, family, size, w) => Math.min(size, n1(w / measure(str, `${weight} 100px "${family}"`) * 100));
const ink = (sw = 2) => `stroke="${C.ink}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"`;

/* ---- what the scatter keeps clear of ---- */
const BOX = [];
const keep = (x0, y0, x1, y1) => BOX.push([x0, y0, x1, y1]);
const OVALS = [[660, 430, 236, 128]];
const blocked = (x, y, m = 0) => BOX.some(([a, b, c, d]) => x > a - m && x < c + m && y > b - m && y < d + m) ||
  OVALS.some(([cx, cy, rx, ry]) => ((x - cx) / (rx + m)) ** 2 + ((y - cy) / (ry + m)) ** 2 < 1);

/* ---- small shapes ---- */
const heart = (z, fill, sw = 1.8) => `<path d="M0 ${n1(z * .38)} C${n1(-z * .95)} ${n1(-z * .18)} ${n1(-z * .48)} ${n1(-z * .9)} 0 ${n1(-z * .42)} C${n1(z * .48)} ${n1(-z * .9)} ${n1(z * .95)} ${n1(-z * .18)} 0 ${n1(z * .38)}Z" fill="${fill}" ${ink(sw)}/>`;
const sparkle = (x, y, z, c) => `<path transform="translate(${n1(x)} ${n1(y)})" d="M0 ${n1(-z)} Q1.6 -1.6 ${n1(z)} 0 Q1.6 1.6 0 ${n1(z)} Q-1.6 1.6 ${n1(-z)} 0 Q-1.6 -1.6 0 ${n1(-z)}Z" fill="${c}" ${ink(1.6)}/>`;
const petal = (z, fill) => { const k = z / 14; return `<path d="M0 0 C${n1(-6 * k)} ${n1(-3 * k)} ${n1(-7 * k)} ${n1(-11 * k)} ${n1(-3 * k)} ${n1(-14 * k)} L${n1(-1 * k)} ${n1(-12 * k)} L${n1(1.4 * k)} ${n1(-14.5 * k)} L${n1(3.4 * k)} ${n1(-12.5 * k)} C${n1(7 * k)} ${n1(-10 * k)} ${n1(5.5 * k)} ${n1(-3 * k)} 0 0Z" fill="${fill}" ${ink(1.4)}/>`; };
const leaf = (len, w, fill = C.leaf) => `<path d="M0 0 C${n1(w)} ${n1(-len * .3)} ${n1(w * .6)} ${n1(-len * .82)} 0 ${n1(-len)} C${n1(-w * .7)} ${n1(-len * .78)} ${n1(-w)} ${n1(-len * .28)} 0 0Z" fill="${fill}" ${ink(1.8)}/>` +
  `<path d="M0 ${n1(-len * .06)} Q${n1(w * .12)} ${n1(-len * .5)} 0 ${n1(-len * .9)}" fill="none" ${ink(1.1)}/>`;
/** a rose from above: two rings of round petals, each ring turned its own way, a curl in the middle */
function rose(R, outer, inner) {
  let o = '';
  [[1, 5, outer], [.72, 4, inner], [.46, 3, outer]].forEach(([k, n, col], ring) => {
    const a0 = r() * 360;
    let d = '';
    for (let i = 0; i < n; i++) {
      const a = a0 + i * 360 / n, b = a + 360 / n, [x0, y0] = pt(0, 0, R * k * .55, a), [x1, y1] = pt(0, 0, R * k * .55, b), [cx, cy] = pt(0, 0, R * k * (1.25 + r() * .15), (a + b) / 2);
      d += `${i ? 'L' : 'M'}${x0} ${y0} Q${cx} ${cy} ${x1} ${y1}`;
    }
    o += `<path d="${d}Z" fill="${col}" ${ink(ring ? 1.5 : 1.8)}/>`;
  });
  o += `<path d="M${n1(-R * .12)} ${n1(R * .05)} q${n1(R * .1)} ${n1(-R * .22)} ${n1(R * .24)} ${n1(-R * .06)} q${n1(R * .08)} ${n1(R * .16)} ${n1(-R * .1)} ${n1(R * .2)}" fill="none" ${ink(1.3)}/>`;
  return o;
}
/** a tulip from the side: a cup of three pointed petals */
function tulip(s, col, dark) {
  return `<path d="M${n1(-10 * s)} ${n1(-4 * s)} C${n1(-11 * s)} ${n1(10 * s)} ${n1(-5 * s)} ${n1(16 * s)} 0 ${n1(16 * s)} C${n1(5 * s)} ${n1(16 * s)} ${n1(11 * s)} ${n1(10 * s)} ${n1(10 * s)} ${n1(-4 * s)} L${n1(6 * s)} ${n1(2 * s)} L${n1(3 * s)} ${n1(-9 * s)} L0 ${n1(1 * s)} L${n1(-3 * s)} ${n1(-9 * s)} L${n1(-6 * s)} ${n1(2 * s)}Z" fill="${col}" ${ink(1.8)}/>` +
    `<path d="M${n1(-3 * s)} ${n1(-9 * s)} Q${n1(-1 * s)} ${n1(4 * s)} ${n1(-4 * s)} ${n1(14 * s)} M${n1(3 * s)} ${n1(-9 * s)} Q${n1(2 * s)} ${n1(5 * s)} ${n1(4 * s)} ${n1(14 * s)}" fill="none" stroke="${dark}" stroke-width="1.2"/>`;
}
/** a daisy or a sunflower: petals all round a dotted middle, no two petals the same */
function daisy(R, col, eye, n = 13) {
  let o = '';
  for (let i = 0; i < n; i++) { const a = i * 360 / n + r() * 8, len = R * (.85 + r() * .25); o += g(0, 0, a + 90, 1, `<ellipse cx="0" cy="${n1(-len * .55)}" rx="${n1(R * .2)}" ry="${n1(len * .48)}" fill="${col}" ${ink(1.3)}/>`); }
  o += `<circle r="${n1(R * .36)}" fill="${eye}" ${ink(1.6)}/>`;
  for (let i = 0; i < 6; i++) { const [x, y] = pt(0, 0, R * .2 * r(), r() * 360); o += `<circle cx="${x}" cy="${y}" r="${n1(1 + r() * 1.2)}" fill="${C.ink}"/>`; }
  return o;
}
function bow(s, col, dark) {                            // a ribbon bow, its loops not quite the same
  let o = `<path d="M${n1(-3 * s)} ${n1(4 * s)} L${n1(-24 * s)} ${n1(48 * s)} L${n1(-15 * s)} ${n1(42 * s)} L${n1(-10 * s)} ${n1(53 * s)} L${n1(4 * s)} ${n1(8 * s)}Z" fill="${dark}" ${ink(2)}/>`;
  o += `<path d="M${n1(3 * s)} ${n1(4 * s)} L${n1(21 * s)} ${n1(52 * s)} L${n1(27 * s)} ${n1(41 * s)} L${n1(35 * s)} ${n1(47 * s)} L${n1(7 * s)} ${n1(5 * s)}Z" fill="${col}" ${ink(2)}/>`;
  o += `<path d="M0 0 C${n1(-20 * s)} ${n1(-24 * s)} ${n1(-50 * s)} ${n1(-18 * s)} ${n1(-45 * s)} ${n1(1 * s)} C${n1(-48 * s)} ${n1(19 * s)} ${n1(-20 * s)} ${n1(19 * s)} 0 0Z" fill="${col}" ${ink(2.2)}/>`;
  o += `<path d="M0 0 C${n1(23 * s)} ${n1(-28 * s)} ${n1(54 * s)} ${n1(-15 * s)} ${n1(47 * s)} ${n1(3 * s)} C${n1(45 * s)} ${n1(21 * s)} ${n1(18 * s)} ${n1(17 * s)} 0 0Z" fill="${col}" ${ink(2.2)}/>`;
  o += `<ellipse rx="${n1(8 * s)}" ry="${n1(10 * s)}" fill="${dark}" ${ink(2.2)}/>`;
  return o;
}
function butterfly(s, c1, c2) {                         // wings drawn one by one, so no butterfly is a mirror image
  const W = [
    `M0 -2 C${n1(9 * s)} ${n1(-30 * s)} ${n1(46 * s)} ${n1(-40 * s)} ${n1(50 * s)} ${n1(-16 * s)} C${n1(52 * s)} ${n1(-2 * s)} ${n1(27 * s)} ${n1(6 * s)} 0 0Z`,
    `M0 -2 C${n1(-11 * s)} ${n1(-31 * s)} ${n1(-43 * s)} ${n1(-37 * s)} ${n1(-47 * s)} ${n1(-14 * s)} C${n1(-48 * s)} ${n1(0)} ${n1(-24 * s)} ${n1(7 * s)} 0 0Z`,
    `M0 2 C${n1(23 * s)} ${n1(4 * s)} ${n1(38 * s)} ${n1(23 * s)} ${n1(23 * s)} ${n1(35 * s)} C${n1(11 * s)} ${n1(41 * s)} ${n1(2 * s)} ${n1(19 * s)} 0 2Z`,
    `M0 2 C${n1(-21 * s)} ${n1(5 * s)} ${n1(-35 * s)} ${n1(21 * s)} ${n1(-21 * s)} ${n1(33 * s)} C${n1(-10 * s)} ${n1(39 * s)} ${n1(-2 * s)} ${n1(18 * s)} 0 2Z`];
  let o = W.map((d, i) => `<path d="${d}" fill="${i < 2 ? c1 : c2}" ${ink(1.8)}/>`).join('');
  [[30, -18, 6], [16, -24, 3.5], [-28, -17, 5.5], [-17, -9, 3], [17, 20, 4.5], [-15, 18, 4]].forEach(([x, y, z]) =>
    { o += `<circle cx="${n1(x * s)}" cy="${n1(y * s)}" r="${n1(z * s * (.8 + r() * .4))}" fill="${pick([C.cream, C.gold, C.rose, C.cream])}" ${ink(1)}/>`; });
  o += `<path d="M0 ${n1(-12 * s)} Q${n1(-6 * s)} ${n1(-26 * s)} ${n1(-12 * s)} ${n1(-30 * s)} M0 ${n1(-12 * s)} Q${n1(5 * s)} ${n1(-27 * s)} ${n1(13 * s)} ${n1(-29 * s)}" fill="none" ${ink(1.4)}/>`;
  o += `<ellipse cy="${n1(6 * s)}" rx="${n1(3.4 * s)}" ry="${n1(17 * s)}" fill="${C.ink}"/><circle cy="${n1(-12 * s)}" r="${n1(4 * s)}" fill="${C.ink}"/>`;
  return o;
}

/* ---- the sheet: a green band with dots and running words, a scalloped cream sheet on it ---- */
function sheet() {
  let s = `<rect width="1280" height="800" fill="${C.band}"/>`;
  const L = 30, Tp = 30, R = 1250, B = 770;
  const words = [
    [640, 21, 0, 'TIỆM HOA NHỎ  ·  A SURPRISE FOR YOU  ·  BÓ HOA BẤT NGỜ  ·  GIAO HOA TẬN TIM', 600],
    [640, 790, 0, 'ĐẶT THIỆP NẰM PHẲNG  ·  LAY THE CARD FLAT  ·  HỒNG ĐỎ & TULIP HỒNG  ·  No. 1402  ·  NIGHT MAIL AR', 700],
    [19, 400, -90, 'HOA TƯƠI MỖI SÁNG  ·  FRESH FLOWERS', 330],
    [1262, 380, 90, 'THƯƠNG EM  ·  WITH LOVE  ·  NỞ HOA', 300]];
  const inWords = (x, y) => words.some(([wx, wy, a, , w]) => a ? Math.abs(x - wx) < 15 && Math.abs(y - wy) < w / 2 + 12 : Math.abs(y - wy + 4) < 15 && Math.abs(x - wx) < w / 2 + 12);
  for (let i = 0; i < 900; i++) {
    const x = r() * 1280, y = r() * 800;
    if (x > 30 && x < 1250 && y > 30 && y < 770) continue;
    if (inWords(x, y)) continue;
    s += `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(1.4 + r() * 3.4)}" fill="${pick([C.cream, C.pink, C.sage, C.gold, C.rose2])}"/>`;
  }
  words.forEach(([x, y, a, str]) => { s += g(x, y, a, 1, T(0, a ? 4 : 0, str, { s: 11.5, ls: 3, anchor: 'middle', fill: C.cream })); });
  let d = `M${L} ${Tp}`;
  const edge = (from, to, along) => {                    // scallops along one edge, each its own width
    for (let p = from; Math.abs(to - p) > 1;) {
      const step = Math.sign(to - p) * Math.min(Math.abs(to - p), 17 + r() * 9), q = p + step, m = (p + q) / 2, b = 7 + r() * 4;
      d += along(m, b, q); p = q;
    }
  };
  edge(L, R, (m, b, q) => `Q${n1(m)} ${n1(Tp - b)} ${n1(q)} ${Tp}`);
  edge(Tp, B, (m, b, q) => `Q${n1(R + b)} ${n1(m)} ${R} ${n1(q)}`);
  edge(R, L, (m, b, q) => `Q${n1(m)} ${n1(B + b)} ${n1(q)} ${B}`);
  edge(B, Tp, (m, b, q) => `Q${n1(L - b)} ${n1(m)} ${L} ${n1(q)}`);
  s += `<path d="${d}Z" fill="${C.paper}" stroke="${C.sage}" stroke-width="3"/>`;
  s += `<rect x="47" y="47" width="1186" height="706" rx="12" fill="none" stroke="${C.green}" stroke-width="1.6" stroke-dasharray="11 4 2 4"/>`;
  return s;
}

/* ---- the shop's awning, top right: stripes of their own widths, each scallop its own depth ---- */
function awning() {
  keep(676, 30, 1246, 132);
  const x0 = 690, x1 = 1236, top = 46, bot = 98;
  let o = '', x = x0, i = 0, d = `M${x0} ${bot}`;
  while (x < x1 - 4) {
    const w = Math.min(x1 - x, 30 + r() * 24), col = i % 2 ? C.cream : pick([C.rose, C.rose, C.rose2]), dep = 11 + r() * 9;
    o += `<path d="M${n1(x)} ${top} H${n1(x + w)} V${bot} Q${n1(x + w / 2)} ${n1(bot + dep * 2)} ${n1(x)} ${bot}Z" fill="${col}" ${ink(2)}/>`;
    if (i % 2) { for (let k = 0; k < 2 + (r() * 3 | 0); k++) o += `<circle cx="${n1(x + 6 + r() * (w - 12))}" cy="${n1(top + 8 + r() * 40)}" r="${n1(1.8 + r() * 2.2)}" fill="${pick([C.rose, C.pink, C.leaf, C.gold])}" ${ink(.9)}/>`; }
    else o += `<path d="M${n1(x + w * (.3 + r() * .4))} ${top + 4} V${bot - 2}" stroke="${C.cream}" stroke-width="1.6" stroke-dasharray="${n1(3 + r() * 5)} ${n1(3 + r() * 4)}"/>`;
    x += w; i++;
  }
  o += `<rect x="${x0 - 12}" y="${top - 12}" width="${x1 - x0 + 24}" height="13" rx="6.5" fill="${C.green}" ${ink(2.2)}/>`;
  o += `<circle cx="${x0 - 12}" cy="${top - 5.5}" r="8" fill="${C.gold}" ${ink(2)}/><circle cx="${x1 + 12}" cy="${top - 5.5}" r="7" fill="${C.gold}" ${ink(2)}/>`;
  for (let k = 0; k < 7; k++) { const px = x0 + 20 + k * 74 + r() * 30; o += `<path d="M${n1(px)} ${top - 8} q4 -3 8 0" fill="none" stroke="${C.mint}" stroke-width="1.4"/>`; }
  return o;
}
/* ---- the shop's sign, hanging from the awning on two cords ---- */
function shopSign() {
  keep(712, 96, 928, 214);
  let o = `<path d="M736 104 L744 142 M902 104 L894 140" stroke="${C.wood2}" stroke-width="2.6"/>`;
  o += `<circle cx="736" cy="104" r="3.6" fill="${C.gold}" ${ink(1.4)}/><circle cx="902" cy="104" r="3.6" fill="${C.gold}" ${ink(1.4)}/>`;
  let s = `<rect x="-92" y="-28" width="184" height="58" rx="10" fill="${C.wood}" ${ink(2.6)}/>`;
  for (let k = 0; k < 5; k++) { const y = -18 + k * 11 + r() * 4; s += `<path d="M-84 ${n1(y)} C-40 ${n1(y - 3 + r() * 6)} 20 ${n1(y + r() * 6 - 3)} 84 ${n1(y + r() * 4 - 2)}" fill="none" stroke="${C.wood2}" stroke-width="1.1" opacity=".75"/>`; }
  s += T(0, 6, 'Tiệm Hoa Nhỏ', { f: F.round, w: 400, s: 27, anchor: 'middle', fill: C.cream, stroke: C.ink, sw: 4.5 });
  s += T(0, 23, 'FRESH FLOWERS · SINCE 2026', { s: 7.2, ls: 1.3, anchor: 'middle', fill: C.cream });
  s += g(-80, -22, -15, 1, rose(8, C.rose, C.pink)) + g(82, 20, 10, 1, rose(7, C.butter, C.gold)) + g(70, -24, 30, 1, leaf(13, 4));
  return o + g(819, 170, -2.5, 1, s);
}

/* ---- the title, top left ---- */
function title() {
  keep(56, 40, 640, 336);
  let s = '';
  s += T(86, 146, 'Bó hoa', { f: F.hand, w: 700, s: 118, fill: C.ink }) + T(81, 141, 'Bó hoa', { f: F.hand, w: 700, s: 118, fill: C.rose, stroke: C.ink, sw: 5 });
  const f2 = fit('bất ngờ', 700, F.hand, 118, 370);
  s += T(222, 250, 'bất ngờ', { f: F.hand, w: 700, s: f2, fill: C.ink }) + T(217, 245, 'bất ngờ', { f: F.hand, w: 700, s: f2, fill: C.pink, stroke: C.ink, sw: 5 });
  s += `<path d="M96 266 C180 280 300 252 420 268 S560 280 606 258" fill="none" ${ink(2.4)}/>`;
  s += g(614, 252, -16, 1, heart(15, C.rose));
  s += T(104, 304, 'A surprise for you', { f: F.round, w: 400, s: 30, fill: C.green });
  s += T(96, 330, 'TIỆM HOA NHỎ  ·  EST. 2026  ·  GIAO HOA TẬN TIM', { s: 12, ls: 3.2, fill: C.rose });
  s += g(452, 94, 0, 1, rose(17, C.red, C.rose)) + g(486, 116, 0, 1, rose(12, C.pink, C.rose2)) + g(436, 124, 40, 1, leaf(22, 7)) + g(503, 92, -60, 1, leaf(19, 6, C.green));
  s += sparkle(400, 64, 9, C.gold) + sparkle(588, 170, 7, C.lilac) + sparkle(70, 210, 6, C.gold) + sparkle(560, 300, 6, C.pink);
  s += g(66, 286, 0, 1, rose(11, C.butter, C.gold)) + g(560, 222, 18, 1, tulip(1.3, C.rose2, C.wine));
  return s;
}

/* ---- the chalkboard price list, right: prices in kisses, hugs and smiles ---- */
function chalkboard() {
  keep(946, 128, 1240, 520);
  let s = `<rect x="-142" y="-190" width="284" height="380" rx="10" fill="${C.wood}" ${ink(2.6)}/>`;
  for (let k = 0; k < 9; k++) { const x = -136 + r() * 272, y = -186 + r() * 372; s += `<path d="M${n1(x)} ${n1(y)} q${n1(4 + r() * 8)} ${n1(-2 + r() * 4)} ${n1(14 + r() * 12)} ${n1(r() * 3)}" fill="none" stroke="${C.wood2}" stroke-width="1.2"/>`; }
  s += `<rect x="-128" y="-176" width="256" height="352" rx="5" fill="${C.chalk}" ${ink(2.2)}/>`;
  for (let k = 0; k < 14; k++) { const x = -118 + r() * 236, y = -166 + r() * 330; s += `<path d="M${n1(x)} ${n1(y)} l${n1(8 + r() * 20)} ${n1(-3 + r() * 6)}" stroke="#56685c" stroke-width="${n1(1 + r() * 2.5)}" stroke-linecap="round"/>`; }
  const W = C.chalkInk;
  s += T(0, -128, 'Bảng giá', { f: F.hand, w: 700, s: 40, anchor: 'middle', fill: W });
  s += T(0, -106, 'PRICE LIST  ·  HÔM NAY', { s: 9.5, ls: 2.4, anchor: 'middle', fill: C.butter });

  [[598, 92, C.lilac], [616, 86, C.pink], [636, 90, C.violet], [652, 96, C.pink2], [608, 98, C.rose2]].forEach(([x, y, c]) => { o += g(x, y, r() * 360, 1, daisy(7 + r() * 2, c, C.butter, 6)); });
  return o;
}
/* ---- a watering can on the counter ---- */
function wateringCan(x, y) {
  let o = `<path d="M-30 -10 L-62 -44 L-58 -48 L-24 -18Z" fill="${C.sage}" ${ink(1.8)}/>`;
  o += g(-62, -47, -40, 1, `<ellipse rx="9" ry="4.5" fill="${C.sage}" ${ink(1.6)}/>` + [-5, -2, 1, 4].map(d => `<circle cx="${d}" cy="0" r="1" fill="${C.ink}"/>`).join(''));
  o += `<path d="M-30 18 L-26 -22 Q0 -30 26 -22 L30 18 Q0 24 -30 18Z" fill="${C.mint}" ${ink(2.2)}/>`;
  o += `<path d="M-18 -26 C-14 -52 14 -52 18 -26" fill="none" ${ink(3.4)}/><path d="M-18 -26 C-14 -52 14 -52 18 -26" fill="none" stroke="${C.sage}" stroke-width="1.6"/>`;
  o += `<path d="M26 -14 C46 -12 48 12 28 12" fill="none" ${ink(3.4)}/>`;
  o += g(0, -2, 0, 1, rose(7, C.rose, C.pink)) + g(-11, 6, 30, 1, leaf(10, 3.5)) + g(12, 7, -30, 1, leaf(9, 3.2, C.green));
  for (let k = 0; k < 4; k++) o += `<path d="M${-72 - k * 5} ${-40 + k * 6} q-3 5 0 8" fill="none" stroke="${C.blue}" stroke-width="1.6" stroke-linecap="round"/>`;
  return g(x, y, -6, 1, o);
}

/* ---- confetti of small things wherever there is paper left ---- */
function scatter(count) {
  let s = '';
  const placed = [];
  for (let i = 0; i < count; i++) {
    const x = 56 + r() * 1168, y = 56 + r() * 690, k = r(), a = (r() * 360) | 0;
    if (blocked(x, y, 7) || placed.some(([px, py]) => Math.hypot(px - x, py - y) < 18)) continue;
    placed.push([x, y]);
    if (k < .28) s += g(x, y, a, 1, petal(9 + r() * 6, pick([C.pink, C.rose2, C.pink2, C.red])));
    else if (k < .46) s += g(x, y, (r() - .5) * 50, 1, heart(9 + r() * 7, pick([C.rose, C.pink, C.rose2, C.gold])));
    else if (k < .62) s += `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(2.4 + r() * 3.4)}" fill="${pick([C.rose, C.green, C.gold, C.lilac, C.sky])}"/>`;
    else if (k < .76) s += sparkle(x, y, 5 + r() * 5, pick([C.gold, C.pink, C.lilac, C.mint]));
    else if (k < .9) s += g(x, y, a, 1, leaf(14 + r() * 8, 4 + r() * 2, pick([C.leaf, C.green, C.sage])));
    else s += g(x, y, a, 1, rose(6 + r() * 3, pick([C.rose, C.pink, C.butter]), pick([C.pink2, C.rose2])));
  }
  return s;
}

const FACES = [`700 96px "${F.hand}"`, `400 30px "${F.round}"`, `400 19px "${F.chalk}"`, `600 14px "${F.sans}"`, `800 14px "${F.sans}"`, `900 40px "${F.serif}"`];
Promise.all(FACES.map(f => document.fonts.load(f, 'Bó hoa bất ngờ ĐẶT Tiệm ữ Ơ ’'))).then(() => {
  let out = sheet();
  const parts = [title(), awning(), shopSign(), basket(), chalkboard(), buckets(), counter(), packets(), flight(), banners()];
  out += scatter(1400) + wreath(660, 430, 236, 128) + parts.join('');
  document.getElementById('card').innerHTML = out;
  return document.fonts.ready;
}).then(() => { window.__ready = true; });
</script>
