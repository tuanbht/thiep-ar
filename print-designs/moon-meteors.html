<!doctype html>
<html><head><meta charset="utf-8"><title>Trăng và sao băng: the print</title>
<link rel="stylesheet" href="/node_modules/@fontsource/pacifico/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/dancing-script/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/600.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/800.css">
<link rel="stylesheet" href="/node_modules/@fontsource/playfair-display/400-italic.css">
<link rel="stylesheet" href="/node_modules/@fontsource/patrick-hand/400.css">
<style>
/* The printed card = the tracking image. A twilight star-gazing chart: a cream chart sheet with degree ticks round its
   rule, on an indigo band of stars and running words; the moon's phases by lunar date down the left edge; the title in
   script with "wish upon a meteor"; a comet whose cyan and pink tail strands twist across the top; a planisphere with our
   own constellations; a ticket for the meteor shower night; three wish notes and a verse; the grassy hilltop where the
   act stands (x 420–860, y 450–690) with a sunset window behind it and the instruction ribbon under it; a telescope on
   its tripod; a stamp and a postmark. Every shape is inked in indigo so the tracker finds edges everywhere. Nothing
   mirrored or tiled; all randomness is seeded, so every render is the same picture. */
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#231d55}
svg{display:block}
</style></head><body>
<svg id="card" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const rng = s => () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; const r = rng(812);
const C = { band: '#231d55', ink: '#2a2450', night: '#2f2a6e', deep: '#17133a', violet: '#6b4fa0', cream: '#fff8ec', paper: '#fdf0de',
  blush: '#f9d3df', pink: '#f59ab8', rose: '#e4517f', wine: '#9c2350', peach: '#ffb48a', gold: '#f4c04e', butter: '#ffe7a6',
  cyan: '#59d4f0', sky: '#a9d8ff', mint: '#9fe3c9', lilac: '#b9a6ff', grass: '#5f9a52', moss: '#3d6e3c', leaf: '#86bf6a',
  brass: '#d9a441', wood: '#9a6a43', stone: '#b8b1a4', white: '#ffffff' };
const F = { title: 'Pacifico', hand: 'Dancing Script', sans: 'Be Vietnam Pro', serif: 'Playfair Display', note: 'Patrick Hand' };
const n1 = v => Math.round(v * 10) / 10;
const pick = a => a[(r() * a.length) | 0];
const rad = d => d * Math.PI / 180;
const pt = (cx, cy, rr, deg) => [n1(cx + Math.cos(rad(deg)) * rr), n1(cy + Math.sin(rad(deg)) * rr)];
const tf = (x, y, a = 0, s = 1) => `translate(${n1(x)} ${n1(y)})${a ? ` rotate(${n1(a)})` : ''}${s !== 1 ? ` scale(${s})` : ''}`;
const g = (x, y, a, s, inner) => `<g transform="${tf(x, y, a, s)}">${inner}</g>`;
const ink = (sw = 2, c = C.ink) => `stroke="${c}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"`;
const T = (x, y, str, o = {}) => `<text x="${n1(x)}" y="${n1(y)}" font-family="${o.f || F.sans}" font-weight="${o.w || 800}" font-size="${o.s || 14}"` +
  `${o.style ? ` font-style="${o.style}"` : ''}${o.ls ? ` letter-spacing="${o.ls}"` : ''}${o.anchor ? ` text-anchor="${o.anchor}"` : ''} fill="${o.fill || C.ink}"` +
  `${o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 4}" paint-order="stroke" stroke-linejoin="round"` : ''}>${str}</text>`;

/* what the scatter keeps clear of */
const BOX = [];
const keep = (x0, y0, x1, y1) => BOX.push([x0, y0, x1, y1]);
const blocked = (x, y, m = 0) => BOX.some(([a, b, c, d]) => x > a - m && x < c + m && y > b - m && y < d + m);

/* small shapes */
const heart = (z, fill, sw = 1.8, c = C.ink) => `<path d="M0 ${n1(z * .38)} C${n1(-z * .95)} ${n1(-z * .18)} ${n1(-z * .48)} ${n1(-z * .9)} 0 ${n1(-z * .42)} C${n1(z * .48)} ${n1(-z * .9)} ${n1(z * .95)} ${n1(-z * .18)} 0 ${n1(z * .38)}Z" fill="${fill}" ${ink(sw, c)}/>`;
const star5 = (z, fill, sw = 1.6, c = C.ink, k = .45) => {          // a five-point star, its points a little uneven
  let d = '';
  for (let i = 0; i < 10; i++) { const rr = i % 2 ? z * k * (.9 + r() * .2) : z * (.92 + r() * .16), [x, y] = pt(0, 0, rr, -90 + i * 36); d += `${i ? 'L' : 'M'}${x} ${y}`; }
  return `<path d="${d}Z" fill="${fill}" ${ink(sw, c)}/>`;
};
const twinkle = (z, fill, sw = 1.4, c = C.ink) => `<path d="M0 ${n1(-z)} Q${n1(z * .14)} ${n1(-z * .14)} ${n1(z)} 0 Q${n1(z * .14)} ${n1(z * .14)} 0 ${n1(z)} Q${n1(-z * .14)} ${n1(z * .14)} ${n1(-z)} 0 Q${n1(-z * .14)} ${n1(-z * .14)} 0 ${n1(-z)}Z" fill="${fill}" ${ink(sw, c)}/>`;
/** a little meteor: a tapered streak ending in a star, pointing down-right */
const meteor = (len, fill, tail = C.sky) => `<path d="M${n1(-len)} ${n1(-len * .62)} L-3 -4 L3 2 Z" fill="${tail}" ${ink(1.2)}/>` + star5(len * .2 + 3, fill, 1.3);
/** the moon at a phase: k from 0 (new) through .5 (full) to 1, r its radius */
function moonPhase(rr, k, lit = C.butter, dark = C.night) {
  const w = Math.cos(k * 2 * Math.PI) * rr, waxing = k < .5;     // the terminator: an ellipse w wide
  let s = `<circle r="${rr}" fill="${dark}" ${ink(1.8)}/>`;
  if (k > .02 && k < .98) {
    const sweepOuter = waxing ? 1 : 0, sweepInner = w > 0 ? (waxing ? 0 : 1) : (waxing ? 1 : 0);
    s += `<path d="M0 ${-rr} A${rr} ${rr} 0 0 ${sweepOuter} 0 ${rr} A${n1(Math.abs(w))} ${rr} 0 0 ${sweepInner} 0 ${-rr}Z" fill="${lit}" ${ink(1.4)}/>`;
  }
  return s;
}

/* ── the sheet: an indigo band with stars and running words, a cream chart sheet with notched corners and degree ticks ── */
function sheet() {
  let s = `<rect width="1280" height="800" fill="${C.band}"/>`;
  const words = [
    [640, 21, 0, 'TRĂNG VÀ SAO BĂNG  ·  WISH UPON A METEOR  ·  ĐÊM NAY CÓ MƯA SAO BĂNG  ·  HAI MÌNH CÙNG ƯỚC', 700],
    [640, 790, 0, 'ĐẶT THIỆP NẰM PHẲNG  ·  LAY THE CARD FLAT  ·  KEEP IT IN VIEW  ·  No. 0812  ·  BƯU CỤC TRĂNG', 690],
    [19, 400, -90, 'NGẮM TRĂNG LÊN  ·  MOONRISE', 300],
    [1262, 400, 90, 'MỘT VÌ SAO BĂNG  ·  MỘT ĐIỀU ƯỚC', 320]];
  const inWords = (x, y) => words.some(([wx, wy, a, , w]) => a ? Math.abs(x - wx) < 15 && Math.abs(y - wy) < w / 2 + 12 : Math.abs(y - wy + 4) < 15 && Math.abs(x - wx) < w / 2 + 12);
  for (let i = 0; i < 1200; i++) {
    const x = r() * 1280, y = r() * 800;
    if (x > 30 && x < 1250 && y > 30 && y < 770) continue;
    if (inWords(x, y)) continue;
    const z = 1.1 + r() * 3.2;
    s += r() < .16 ? g(x, y, r() * 90, 1, twinkle(z * 1.6, pick([C.gold, C.butter, C.white, C.pink]), .8, C.deep)) : `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(z)}" fill="${pick([C.cream, C.butter, C.sky, C.lilac, C.pink, C.cyan])}"/>`;
  }
  words.forEach(([x, y, a, str]) => { s += g(x, y, a, 1, T(0, a ? 4 : 0, str, { s: 11.5, ls: 3, anchor: 'middle', fill: C.cream })); });
  const L = 30, Tp = 30, R = 1250, B = 770, k = 16;                // the sheet, its corners notched like an old chart's
  s += `<path d="M${L + k} ${Tp} L${R - k} ${Tp} L${R} ${Tp + k} L${R} ${B - k} L${R - k} ${B} L${L + k} ${B} L${L} ${B - k} L${L} ${Tp + k}Z" fill="${C.cream}" ${ink(2.6)}/>`;
  s += `<rect x="42" y="42" width="1196" height="716" fill="none" stroke="${C.ink}" stroke-width="1.6"/>`;
  s += `<rect x="47" y="47" width="1186" height="706" fill="none" stroke="${C.violet}" stroke-width=".9" stroke-dasharray="2 4"/>`;
  for (let x = 54, i = 0; x < 1228; x += 9 + (i % 7 === 3 ? 4 : 0), i++) {   // degree ticks along the top and bottom rules
    const long = i % 5 === 0, h = long ? 9 : 5;
    s += `<path d="M${n1(x)} 42 l0 ${h} M${n1(x)} 758 l0 ${-h}" stroke="${C.ink}" stroke-width="${long ? 1.3 : .8}"/>`;
    if (i % 20 === 10 && x > 560 && x < 920) s += T(x, 62, `${i * 3}°`, { s: 8.5, w: 600, anchor: 'middle', fill: C.violet });
  }
  for (let y = 56, i = 0; y < 746; y += 10 + (i % 6 === 2 ? 3 : 0), i++) {
    const long = i % 5 === 0, h = long ? 9 : 5;
    s += `<path d="M42 ${n1(y)} l${h} 0 M1238 ${n1(y)} l${-h} 0" stroke="${C.ink}" stroke-width="${long ? 1.3 : .8}"/>`;
  }
  for (const [x, y, a] of [[42, 42, 0], [1238, 42, 90], [1238, 758, 180], [42, 758, 270]]) s += g(x, y, a, 1, `<path d="M6 24 L6 6 L24 6" fill="none" ${ink(3)}/>` + `<circle cx="13" cy="13" r="3" fill="${C.rose}" ${ink(1.2)}/>`);
  return s;
}

/* ── the moon's phases down the left edge, by the lunar calendar ── */
function phases() {
  const x = 80, list = [[0, 'mùng 1'], [.13, 'mùng 4'], [.25, 'mùng 8'], [.38, 'mùng 11'], [.5, 'rằm'], [.63, '19'], [.75, '23'], [.88, '27']];
  keep(52, 66, 112, 750);
  let s = `<path d="M${x} 78 L${x} 742" stroke="${C.violet}" stroke-width="1.4" stroke-dasharray="3 5"/>`;
  s += g(x, 86, 0, 1, T(0, 0, 'TUẦN', { s: 9.5, ls: 1.5, anchor: 'middle', fill: C.wine }) + T(0, 11, 'TRĂNG', { s: 9.5, ls: 1.5, anchor: 'middle', fill: C.wine }));
  list.forEach(([k, label], i) => {
    const y = 128 + i * 80 + (i % 3 - 1) * 5, rr = k === .5 ? 24 : 15 + (i * 7 % 5);
    if (k === .5) s += `<circle cx="${x}" cy="${y}" r="${rr + 9}" fill="${C.butter}" opacity=".6" ${ink(1, C.gold)}/>`;
    s += g(x, y, (i * 23) % 40 - 20, 1, moonPhase(rr, k, k === .5 ? C.butter : C.butter, C.night));
    s += `<rect x="${x - 26}" y="${y + rr + 6}" width="52" height="16" rx="8" fill="${k === .5 ? C.rose : C.cream}" ${ink(1.2)}/>`;
    s += T(x, y + rr + 18, label, { s: 10, w: 800, anchor: 'middle', fill: k === .5 ? C.cream : C.ink });
  });
  return s;
}

/* ── the title ── */
function title() {
  keep(124, 52, 560, 270);
  let s = T(140, 146, 'Trăng và', { f: F.title, w: 400, s: 80, fill: C.ink, stroke: C.blush, sw: 10 });
  s += T(250, 232, 'sao băng', { f: F.hand, w: 700, s: 104, fill: C.rose, stroke: C.cream, sw: 8 });
  s += g(486, 96, -14, 1, moonPhase(26, .2, C.butter, C.night));
  s += g(540, 168, 12, 1, twinkle(15, C.gold, 1.8));
  s += g(146, 200, -8, 1, star5(14, C.cyan, 1.6));
  s += T(150, 256, 'Wish upon a meteor', { f: F.serif, w: 400, style: 'italic', s: 25, fill: C.violet });
  s += `<path d="M150 264 C230 276 290 254 352 268" fill="none" ${ink(2.2, C.rose)}/>`;
  s += g(392, 250, 0, 1, meteor(30, C.gold));
  return s;
}

/* ── a comet across the top: its tail is a cyan strand and a pink strand that twist round each other ── */
function comet() {
  keep(560, 54, 905, 270);
  const hx = 880, hy = 214, tx = 592, ty = 96;
  const along = (u, side) => {                                         // the strands: a point at u (0 head .. 1 tail end)
    const x = hx + (tx - hx) * u, y = hy + (ty - hy) * u - 22 * Math.sin(u * Math.PI);   // the tail bends up a little
    const nx = -(ty - hy), ny = tx - hx, nl = Math.hypot(nx, ny), off = side * (4 + 26 * u) * Math.sin(u * 9 + side * .6);
    return [x + nx / nl * off, y + ny / nl * off];
  };
  const strand = (side, fill, sw) => {
    const top = [], bottom = [];
    for (let i = 0; i <= 40; i++) {
      const u = i / 40, [x, y] = along(u, side), w = 2 + 9 * u * (1 - u * .6);
      const [x2, y2] = along(Math.min(1, u + .01), side), dx = x2 - x, dy = y2 - y, dl = Math.hypot(dx, dy) || 1;
      top.push([x - dy / dl * w, y + dx / dl * w]); bottom.push([x + dy / dl * w, y - dx / dl * w]);
    }
    return `<path d="M${top.map(p => p.map(n1).join(' ')).join(' L')} L${bottom.reverse().map(p => p.map(n1).join(' ')).join(' L')}Z" fill="${fill}" ${ink(sw)}/>`;
  };
  let s = `<path d="M${hx} ${hy} Q${(hx + tx) / 2} ${(hy + ty) / 2 - 60} ${tx} ${ty}" fill="none" stroke="${C.lilac}" stroke-width="34" stroke-linecap="round" opacity=".35"/>`;
  s += strand(1, C.pink, 1.8) + strand(-1, C.cyan, 1.8);
  for (let i = 0; i < 26; i++) {                                    // sparks shed along the tail
    const u = .08 + r() * .9, [x, y] = along(u, r() < .5 ? 1 : -1);
    s += r() < .35 ? g(x + (r() - .5) * 24, y + (r() - .5) * 24, r() * 90, 1, twinkle(3 + r() * 4, pick([C.white, C.butter, C.cyan, C.pink]), 1))
      : `<circle cx="${n1(x + (r() - .5) * 26)}" cy="${n1(y + (r() - .5) * 26)}" r="${n1(1.2 + r() * 2.2)}" fill="${pick([C.ink, C.rose, C.violet])}"/>`;
  }
  s += `<circle cx="${hx}" cy="${hy}" r="26" fill="${C.butter}" opacity=".55"/>` + g(hx, hy, 18, 1, star5(17, C.white, 2.2)) + `<circle cx="${hx}" cy="${hy}" r="5" fill="${C.cyan}" ${ink(1.2)}/>`;
  s += g(704, 236, -6, 1, T(0, 0, 'sao chổi hai màu', { f: F.hand, w: 700, s: 22, fill: C.wine }) + `<path d="M120 -10 q14 -10 30 -4" fill="none" ${ink(1.6, C.wine)}/>`);
  return s;
}

/* ── a planisphere: a rim of degrees and months, a night disc with our own constellations and the comet's path ── */
function starMap() {
  const cx = 1078, cy = 214, R = 150;
  keep(cx - R - 14, cy - R - 12, cx + R + 14, cy + R + 36);
  let s = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${C.paper}" ${ink(2.6)}/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${R - 26}" fill="${C.night}" ${ink(2)}/>`;
  for (let d = 0; d < 360; d += 3) {                                 // the rim: degree ticks
    const long = d % 15 === 0, [ax, ay] = pt(cx, cy, R - 1, d), [bx, by] = pt(cx, cy, R - (long ? 10 : 5), d);
    s += `<path d="M${ax} ${ay} L${bx} ${by}" stroke="${C.ink}" stroke-width="${long ? 1.3 : .7}"/>`;
  }
  const months = ['TH.1', 'TH.2', 'TH.3', 'TH.4', 'TH.5', 'TH.6', 'TH.7', 'TH.8', 'TH.9', 'TH.10', 'TH.11', 'TH.12'];
  months.forEach((m, i) => { const a = -90 + i * 30 + 15, [x, y] = pt(cx, cy, R - 18, a); s += g(x, y, a + 90, 1, T(0, 3, m, { s: 8.5, w: 800, anchor: 'middle', fill: i === 7 ? C.rose : C.ink })); });
  for (const rr of [32, 62, 92]) s += `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="${C.sky}" stroke-width=".8" stroke-dasharray="3 4" opacity=".75"/>`;
  for (let a = 0; a < 180; a += 30) { const [ax, ay] = pt(cx, cy, R - 26, a), [bx, by] = pt(cx, cy, R - 26, a + 180); s += `<path d="M${ax} ${ay} L${bx} ${by}" stroke="${C.sky}" stroke-width=".6" opacity=".55"/>`; }
  for (let i = 0; i < 90; i++) {                                     // the sky's own stars
    const a = r() * 360, d = Math.sqrt(r()) * (R - 32), [x, y] = pt(cx, cy, d, a);
    s += `<circle cx="${x}" cy="${y}" r="${n1(.6 + r() * 1.6)}" fill="${pick([C.white, C.butter, C.sky, C.lilac])}"/>`;
  }
  const constellation = (pts, name, nx, ny, col) => {               // stars joined by lines, a name beside
    let c = `<path d="M${pts.map(p => p.join(' ')).join(' L')}" fill="none" stroke="${C.sky}" stroke-width="1.3" stroke-dasharray="4 3"/>`;
    pts.forEach(([x, y], i) => { c += g(x, y, i * 17, 1, i % 3 ? star5(4 + (i * 5 % 4), col, 1, C.deep) : twinkle(7, C.white, 1, C.deep)); });
    return c + T(nx, ny, name, { f: F.hand, w: 700, s: 13, anchor: 'middle', fill: C.butter });
  };
  const hpts = Array.from({ length: 9 }, (_, i) => { const t = i / 9 * 2 * Math.PI, x = 16 * Math.sin(t) ** 3, y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    return [n1(cx - 52 + x * 1.7 + (r() - .5) * 4), n1(cy - 38 + y * 1.6 + (r() - .5) * 4)]; });
  s += constellation([...hpts, hpts[0]], 'chòm Trái Tim', cx - 52, cy + 4, C.pink);
  s += constellation([[cx + 22, cy - 82], [cx + 44, cy - 60], [cx + 70, cy - 70], [cx + 84, cy - 44], [cx + 62, cy - 30]], 'chòm Cánh Diều', cx + 62, cy - 12, C.butter);
  s += constellation([[cx - 30, cy + 56], [cx - 4, cy + 40], [cx + 24, cy + 52], [cx + 50, cy + 36], [cx + 78, cy + 50]], 'chòm Hai Ta', cx + 20, cy + 76, C.cyan);
  s += `<path d="M${cx - 110} ${cy + 64} Q${cx - 20} ${cy - 12} ${cx + 92} ${cy - 104}" fill="none" stroke="${C.gold}" stroke-width="1.6" stroke-dasharray="2 5"/>`;
  s += g(cx + 30, cy - 52, -40, .7, meteor(26, C.gold, C.pink));
  s += `<circle cx="${cx}" cy="${cy}" r="5" fill="${C.rose}" ${ink(1.4)}/>`;
  s += `<rect x="${cx - 96}" y="${cy + R + 6}" width="192" height="24" rx="12" fill="${C.ink}"/>` + T(cx, cy + R + 23, 'BẢN ĐỒ SAO · STAR MAP', { s: 10.5, ls: 1.5, anchor: 'middle', fill: C.cream });
  return s;
}

/* ── a ticket for the meteor shower night, with a stub and a barcode ── */
function ticket() {
  const x = 134, y = 300, w = 296, h = 156;
  keep(x - 10, y - 14, x + w + 16, y + h + 16);
  let s = `<g transform="${tf(x, y, -3)}">`;
  s += `<path d="M0 10 Q0 0 10 0 L${w - 70} 0 A9 9 0 0 0 ${w - 52} 0 L${w - 10} 0 Q${w} 0 ${w} 10 L${w} ${h - 10} Q${w} ${h} ${w - 10} ${h} L${w - 52} ${h} A9 9 0 0 0 ${w - 70} ${h} L10 ${h} Q0 ${h} 0 ${h - 10}Z" fill="${C.lilac}" ${ink(2.4)}/>`;
  s += `<rect x="8" y="8" width="${w - 86}" height="${h - 16}" rx="6" fill="${C.cream}" ${ink(1.4)}/>`;
  s += `<line x1="${w - 61}" y1="12" x2="${w - 61}" y2="${h - 12}" stroke="${C.ink}" stroke-width="1.6" stroke-dasharray="4 4"/>`;
  s += T(18, 32, 'ĐÊM MƯA SAO BĂNG', { s: 16.5, ls: .8 }) + T(18, 48, 'METEOR SHOWER · VÉ ĐÔI', { s: 9.5, ls: 1.4, fill: C.wine });
  [['Ngày', '12 · 08'], ['Giờ', 'lúc trăng lên'], ['Chỗ', 'đỉnh đồi cỏ'], ['Hạng', 'ước nguyện ♥']].forEach(([k, v], i) => {
    s += T(18, 72 + i * 21, k, { s: 10.5, w: 600, fill: C.violet }) + T(62, 72 + i * 21, v, { f: F.hand, w: 700, s: 17, fill: C.rose });
    s += `<line x1="62" y1="${76 + i * 21}" x2="${w - 92}" y2="${76 + i * 21}" stroke="${C.ink}" stroke-width=".8" opacity=".4"/>`;
  });
  s += g(w - 100, 40, 14, 1, meteor(18, C.gold));
  for (let bx = w - 52; bx < w - 12;) { const bw = 1 + (r() * 3.4 | 0); s += `<rect x="${n1(bx)}" y="16" width="${bw}" height="84" fill="${C.ink}"/>`; bx += bw + 1 + r() * 2.4; }
  s += g(w - 32, 128, -90, 1, T(0, 4, 'No. 0812', { s: 10, ls: 1.2, anchor: 'middle' }));
  return s + '</g>';
}

/* ── three wish notes, taped up, and a verse on a ruled slip ── */
function wishes() {
  keep(124, 472, 432, 600);
  let s = '';
  [[134, 482, -5, C.butter, 'Ước 1', 'nắm tay em thật lâu'], [236, 494, 4, C.blush, 'Ước 2', 'tháng nào cũng ngắm trăng'], [338, 480, -2, C.mint, 'Ước 3', 'mãi bên nhau']].forEach(([x, y, a, col, k, v], i) => {
    let n = `<rect x="0" y="0" width="88" height="96" rx="4" fill="${col}" ${ink(1.8)}/>`;
    n += `<rect x="26" y="-8" width="38" height="16" fill="${pick([C.sky, C.pink, C.lilac])}" opacity=".85" transform="rotate(${i * 7 - 6} 45 0)" ${ink(1)}/>`;
    n += T(10, 26, k, { f: F.note, w: 400, s: 18, fill: C.wine });
    const words = v.split(' '), lines = []; let line = '';
    words.forEach(wd => { if ((line + ' ' + wd).trim().length > 10) { lines.push(line.trim()); line = wd; } else line += ' ' + wd; }); lines.push(line.trim());
    lines.forEach((l, j) => { n += T(10, 48 + j * 17, l, { f: F.note, w: 400, s: 16, fill: C.ink }); });
    n += g(72, 82, i * 20, 1, i === 1 ? heart(13, C.rose, 1.3) : star5(8, C.gold, 1.2));
    s += g(x, y, a, 1, n);
  });
  const vx = 130, vy = 640;
  keep(vx - 8, vy - 28, vx + 300, vy + 92);
  let v = `<rect x="0" y="-20" width="292" height="104" rx="6" fill="${C.paper}" ${ink(1.8)}/>`;
  [12, 38, 64].forEach(ly => { v += `<line x1="12" y1="${ly}" x2="280" y2="${ly}" stroke="${C.sky}" stroke-width="1.2"/>`; });
  v += `<line x1="32" y1="-14" x2="32" y2="78" stroke="${C.pink}" stroke-width="1.4"/>`;
  v += T(42, 8, 'Mỗi vì sao băng qua,', { f: F.hand, w: 700, s: 21, fill: C.night });
  v += T(42, 34, 'anh chỉ ước một điều:', { f: F.hand, w: 700, s: 21, fill: C.night });
  v += T(42, 60, 'được cùng em ngắm trăng.', { f: F.hand, w: 700, s: 21, fill: C.night });
  s += g(vx, vy, 1.5, 1, v + g(266, 50, -12, 1, moonPhase(11, .3, C.butter, C.night)));
  return s;
}

/* ── the hilltop the act stands on: a sunset window behind it, grass, flowers, a lone tree, a stone lantern ── */
function stage() {
  const x0 = 430, x1 = 850, top = 452, base = 692;
  keep(x0 - 14, 300, x1 + 14, base + 56);
  let s = `<defs><linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3488"/><stop offset=".45" stop-color="#8a539f"/>` +
    `<stop offset=".75" stop-color="#f08fa6"/><stop offset="1" stop-color="#ffc480"/></linearGradient>` +
    `<clipPath id="win"><path d="M${x0 + 10} 560 L${x0 + 10} 360 Q${x0 + 10} 312 ${x0 + 60} 312 L${x1 - 60} 312 Q${x1 - 10} 312 ${x1 - 10} 360 L${x1 - 10} 560Z"/></clipPath></defs>`;
  s += `<path d="M${x0 + 10} 560 L${x0 + 10} 360 Q${x0 + 10} 312 ${x0 + 60} 312 L${x1 - 60} 312 Q${x1 - 10} 312 ${x1 - 10} 360 L${x1 - 10} 560Z" fill="url(#dusk)" ${ink(2.6)}/>`;
  s += `<g clip-path="url(#win)">`;
  for (let i = 0; i < 70; i++) { const x = x0 + 20 + r() * (x1 - x0 - 40), y = 320 + r() * 100; s += `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(.7 + r() * 1.6)}" fill="${pick([C.white, C.butter, C.sky])}"/>`; }
  s += `<circle cx="${x1 - 112}" cy="402" r="40" fill="${C.butter}" opacity=".45"/>` + g(x1 - 112, 402, 0, 1, moonPhase(30, .5, C.butter, C.night));
  for (const [cx, cy, rr] of [[x1 - 124, 392, 6], [x1 - 100, 414, 4], [x1 - 104, 388, 3]]) s += `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" ${ink(1.2, C.gold)}/>`;
  let far = `M${x0} 560 L${x0} 470`;                                // far hills with a town's lights
  for (let x = x0; x <= x1; x += 20) far += ` L${x} ${n1(468 - 18 * Math.sin((x - x0) / 60) - 10 * Math.sin((x - x0) / 23) - r() * 4)}`;
  s += `<path d="${far} L${x1} 560Z" fill="#6b5aa8" ${ink(1.8)}/>`;
  for (let i = 0; i < 18; i++) s += `<rect x="${n1(x0 + 60 + r() * 120)}" y="${n1(472 + r() * 22)}" width="3" height="3" fill="${C.butter}"/>`;
  s += g(x0 + 150, 360, 22, 1, meteor(28, C.white, C.pink)) + g(x0 + 240, 340, 18, 1, meteor(20, C.butter, C.cyan));
  s += '</g>';
  let hill = `M${x0 - 6} ${base}`;                                  // the hill itself, its top a soft wobble
  for (let x = x0 - 6; x <= x1 + 6; x += 14) { const k = (x - x0) / (x1 - x0), y = base - (base - top) * Math.pow(Math.sin(Math.PI * Math.min(1, Math.max(0, k * .96 + .02))), .7) - 6 * Math.sin(k * 17) * k * (1 - k) * 4; hill += ` L${n1(x)} ${n1(y)}`; }
  s += `<path d="${hill} L${x1 + 6} ${base}Z" fill="${C.grass}" ${ink(2.8)}/>`;
  for (let i = 0; i < 120; i++) {                                    // tufts of grass
    const x = x0 + 14 + r() * (x1 - x0 - 28), k = (x - x0) / (x1 - x0), yTop = base - (base - top) * Math.pow(Math.sin(Math.PI * (k * .96 + .02)), .7);
    const y = yTop + 10 + r() * (base - yTop - 16);
    let t = '';
    for (let j = 0; j < 3; j++) t += `<path d="M${n1((j - 1) * 3)} 0 Q${n1((j - 1) * 4 + (r() - .5) * 4)} ${n1(-5 - r() * 4)} ${n1((j - 1) * 6 + (r() - .5) * 6)} ${n1(-9 - r() * 7)}" fill="none" ${ink(1.5, pick([C.moss, '#2f5a34', C.leaf]))}/>`;
    s += g(x, y, 0, 1, t);
  }
  for (let i = 0; i < 22; i++) {                                      // wildflowers
    const x = x0 + 30 + r() * (x1 - x0 - 60), k = (x - x0) / (x1 - x0), yTop = base - (base - top) * Math.pow(Math.sin(Math.PI * (k * .96 + .02)), .7);
    const y = yTop + 18 + r() * (base - yTop - 30), col = pick([C.white, C.butter, C.pink, C.lilac]);
    let f = '';
    for (let p = 0; p < 5; p++) { const [px, py] = pt(0, 0, 3.4, p * 72 + r() * 10); f += `<circle cx="${px}" cy="${py}" r="2.6" fill="${col}" ${ink(.8)}/>`; }
    s += g(x, y, 0, 1, f + `<circle r="1.8" fill="${C.gold}"/>`);
  }
  const tx = x0 + 70, ty = top + 64;                                 // the lone tree
  s += `<path d="M${tx - 5} ${ty + 60} Q${tx - 2} ${ty + 20} ${tx + 8} ${ty - 10} L${tx + 14} ${ty - 8} Q${tx + 6} ${ty + 22} ${tx + 6} ${ty + 60}Z" fill="${C.wood}" ${ink(2)}/>`;
  for (const [dx, dy, rr, col] of [[0, -24, 26, '#3f8250'], [-22, -10, 19, '#2f6a43'], [24, -12, 20, '#58a05c'], [8, -44, 18, '#58a05c'], [-12, -38, 15, '#3f8250']]) s += `<circle cx="${tx + 8 + dx}" cy="${ty + dy - 10}" r="${rr}" fill="${col}" ${ink(2)}/>`;
  const lx = x1 - 96, ly = top + 66;                                  // the stone lantern, lit
  s += `<circle cx="${lx}" cy="${ly - 30}" r="22" fill="${C.butter}" opacity=".6"/>`;
  s += `<path d="M${lx - 14} ${ly + 22} L${lx + 14} ${ly + 22} L${lx + 11} ${ly + 16} L${lx - 11} ${ly + 16}Z M${lx - 4} ${ly + 16} L${lx - 4} ${ly - 12} L${lx + 4} ${ly - 12} L${lx + 4} ${ly + 16}Z" fill="${C.stone}" ${ink(1.6)}/>`;
  s += `<rect x="${lx - 11}" y="${ly - 40}" width="22" height="26" fill="${C.stone}" ${ink(1.6)}/><rect x="${lx - 6}" y="${ly - 35}" width="12" height="16" fill="${C.gold}" ${ink(1.2)}/>`;
  s += `<path d="M${lx - 20} ${ly - 40} L${lx} ${ly - 56} L${lx + 20} ${ly - 40}Z" fill="${C.stone}" ${ink(1.6)}/><circle cx="${lx}" cy="${ly - 59}" r="3.4" fill="${C.stone}" ${ink(1.2)}/>`;
  s += g(640, top + 104, -3, 1, heart(52, C.cream, 2.6) + `<path d="M0 15 C-25 0 -17 -25 0 -11 C17 -25 25 0 0 15Z" fill="${C.rose}" ${ink(1.6)}/>`);
  s += T(640, top + 162, 'nơi hai mình ngắm trăng', { f: F.hand, w: 700, s: 23, anchor: 'middle', fill: C.ink, stroke: C.cream, sw: 6 });
  const ry = base + 30;                                                // the instruction ribbon
  s += `<path d="M436 ${ry - 17} L844 ${ry - 17} L826 ${ry} L844 ${ry + 17} L436 ${ry + 17} L454 ${ry}Z" fill="${C.ink}" ${ink(2)}/>`;
  s += T(640, ry + 5, 'Đặt thiệp nằm phẳng, hướng điện thoại vào đây', { s: 14.5, w: 600, anchor: 'middle', fill: C.cream });
  return s;
}

/* ── a telescope on its tripod, pointing up at the comet ── */
function telescope() {
  const x = 1000, y = 596;
  keep(x - 120, 420, x + 110, 760);
  let s = '';
  s += `<path d="M${x} ${y} L${x - 64} ${y + 140} M${x} ${y} L${x + 60} ${y + 140} M${x} ${y} L${x + 6} ${y + 148}" fill="none" ${ink(7, C.ink)}/>`;
  s += `<path d="M${x} ${y} L${x - 64} ${y + 140} M${x} ${y} L${x + 60} ${y + 140} M${x} ${y} L${x + 6} ${y + 148}" fill="none" stroke="${C.wood}" stroke-width="3.6" stroke-linecap="round"/>`;
  s += `<path d="M${x - 40} ${y + 86} L${x + 37} ${y + 86}" ${ink(2.2)}/>`;
  s += `<circle cx="${x}" cy="${y}" r="10" fill="${C.brass}" ${ink(2)}/>`;
  s += g(x, y - 6, -32, 1,
    `<rect x="-86" y="-15" width="150" height="30" rx="5" fill="${C.night}" ${ink(2.4)}/>` +
    `<rect x="62" y="-20" width="34" height="40" rx="5" fill="${C.brass}" ${ink(2.4)}/>` +
    `<ellipse cx="96" cy="0" rx="5" ry="19" fill="${C.sky}" ${ink(1.8)}/><path d="M94 -9 q4 6 0 12" fill="none" ${ink(1.4, C.white)}/>` +
    `<rect x="-112" y="-9" width="28" height="18" rx="4" fill="${C.brass}" ${ink(2)}/>` +
    `<rect x="-24" y="-24" width="40" height="10" rx="4" fill="${C.brass}" ${ink(1.8)}/>` +
    [-60, -30, 20, 46].map(bx => `<path d="M${bx} -15 L${bx} 15" ${ink(1.6, C.gold)}/>`).join('') +
    T(-10, 6, 'NGẮM SAO', { s: 9, ls: 1.5, anchor: 'middle', fill: C.cream }));
  for (const [dx, dy, z] of [[96, -102, 9], [128, -134, 6], [70, -150, 5]]) s += g(x + dx, y + dy, 20, 1, twinkle(z, C.gold, 1.2));
  s += g(x - 62, y + 66, -4, 1, `<rect x="-44" y="-14" width="88" height="26" rx="13" fill="${C.cream}" ${ink(1.6)}/>` + T(0, 4, 'kính thiên văn', { f: F.hand, w: 700, s: 15, anchor: 'middle', fill: C.wine }));
  return s;
}

/* ── a stamp with the moon and a comet, two postmarks with words on arcs ── */
function stamps() {
  let s = '';
  const sx = 1168, sy = 476;
  keep(sx - 52, sy - 62, sx + 52, sy + 62);
  let edge = '';
  for (let i = 0; i <= 40; i++) { const t = i / 40, [a, b] = i < 10 ? [-42 + t * 4 * 84, -52] : i < 20 ? [42, -52 + (t - .25) * 4 * 104] : i < 30 ? [42 - (t - .5) * 4 * 84, 52] : [-42, 52 - (t - .75) * 4 * 104]; edge += `${i ? 'L' : 'M'}${n1(a)} ${n1(b)}`; }
  s += g(sx, sy, 6, 1, `<path d="${edge}Z" fill="${C.white}" stroke="${C.ink}" stroke-width="2" stroke-dasharray="3 3"/>` +
    `<rect x="-34" y="-44" width="68" height="76" fill="${C.violet}" ${ink(1.6)}/>` + g(8, -14, 0, 1, moonPhase(16, .5, C.butter, C.night)) +
    g(-12, 10, 30, .8, meteor(22, C.white, C.cyan)) + T(0, 46, '0812đ', { s: 11, anchor: 'middle' }));
  const mark = (cx, cy, rr, top, bottom, a, mid) => {
    let m = `<g transform="${tf(cx, cy, a)}" opacity=".88"><circle r="${rr}" fill="none" ${ink(2.2, C.rose)}/><circle r="${rr - 14}" fill="none" ${ink(1.4, C.rose)}/>`;
    m += `<path id="arcT${cx}" d="M${-rr + 7} 0 A${rr - 7} ${rr - 7} 0 0 1 ${rr - 7} 0" fill="none"/><path id="arcB${cx}" d="M${-rr + 7} 0 A${rr - 7} ${rr - 7} 0 0 0 ${rr - 7} 0" fill="none"/>`;
    m += `<text font-family="${F.sans}" font-weight="800" font-size="10" letter-spacing="2" fill="${C.rose}"><textPath href="#arcT${cx}" startOffset="50%" text-anchor="middle">${top}</textPath></text>`;
    m += `<text font-family="${F.sans}" font-weight="800" font-size="10" letter-spacing="2" fill="${C.rose}" dy="9"><textPath href="#arcB${cx}" startOffset="50%" text-anchor="middle">${bottom}</textPath></text>`;
    return m + T(0, 5, mid, { s: 13, anchor: 'middle', fill: C.rose }) + `</g>`;
  };
  keep(1120, 600, 1238, 750);
  s += mark(1178, 672, 44, 'BƯU CỤC TRĂNG', 'GỬI EM', -10, '12·08');
  keep(440, 278, 560, 300);
  s += `<path d="M446 290 q16 -8 32 0 t32 0 t32 0 M446 300 q16 -8 32 0 t32 0 t32 0" fill="none" ${ink(1.6, C.rose)}/>`;
  return s;
}

/* ── the scatter: stars, little meteors, hearts, sparkles, where nothing else is ── */
function scatter() {
  let s = '';
  for (let i = 0, placed = 0; i < 5000 && placed < 140; i++) {
    const x = 52 + r() * 1176, y = 52 + r() * 696;
    if (blocked(x, y, 12)) continue;
    keep(x - 8, y - 8, x + 8, y + 8); placed++;
    const k = r();
    s += g(x, y, r() * 60 - 30, 1, k < .28 ? star5(5 + r() * 7, pick([C.gold, C.butter, C.sky, C.lilac, C.cyan]))
      : k < .5 ? twinkle(5 + r() * 6, pick([C.gold, C.white, C.mint, C.pink]))
      : k < .66 ? heart(9 + r() * 9, pick([C.pink, C.rose, C.blush]))
      : k < .78 ? g(0, 0, 0, .55 + r() * .3, meteor(20 + r() * 14, pick([C.gold, C.white]), pick([C.cyan, C.pink, C.sky])))
      : k < .9 ? moonPhase(4 + r() * 4, .1 + r() * .8, C.butter, C.night)
      : `<circle r="${n1(2 + r() * 3)}" fill="${pick([C.ink, C.rose, C.violet, C.cyan])}"/>`);
  }
  return s;
}

const svg = document.getElementById('card');
svg.innerHTML = sheet() + phases() + title() + comet() + starMap() + ticket() + wishes() + stage() + telescope() + stamps() + scatter();
window.__ready = true;
</script>
