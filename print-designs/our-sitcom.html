<!doctype html>
<html><head><meta charset="utf-8"><title>Hai Đứa Mình — The Series: the print</title>
<link rel="stylesheet" href="/node_modules/@fontsource/pacifico/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/600.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/800.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/900.css">
<link rel="stylesheet" href="/node_modules/@fontsource/dancing-script/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/patrick-hand/400.css">
<style>
/* The printed card = the tracking image. "Hai Đứa Mình — The Series" as the floor of a little pink TV studio, seen from
   above: a plum frame with marquee bulbs and running words; a film strip down the left edge with the six episodes as
   stills; in the middle the revolving stage (living room, kitchen, window corner, its rim marked in degrees) with the
   show's logo on a ring of bulbs, which is where the act's set stands; round it the studio: the red ĐANG QUAY light and a
   VỖ TAY box hung from the truss, studio lamps, a walkie-talkie, the episode list on a clipboard, a clapperboard, the
   director's megaphone, popcorn, coffee and a pair of headphones, the script of scene 1 with the remote on it, spike-tape
   marks (one where the director's chair stands), cables, and sparkles, notes and popcorn wherever there is floor left. Every shape is inked in plum so the tracker finds edges
   everywhere; nothing is mirrored or tiled, and all randomness is seeded, so every render is the same picture. */
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#3b2a4a}
svg{display:block}
</style></head><body>
<svg id="card" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const rng = s => () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; const r = rng(601);
const C = { plum: '#3b2a4a', film: '#2e2140', plum2: '#5e4a72', lilac: '#d8c8ec', pink: '#f6c9d6', blush: '#fbe4eb', rose: '#ee9cb4', velvet: '#d9577a',
  wine: '#a93a5e', cream: '#fff4e6', paper: '#fffbf4', wood: '#e9c9a3', wood2: '#d4a878', wood3: '#a87850', mint: '#bfe6d8', mint2: '#86cdb4',
  gold: '#ffd27a', butter: '#ffe9b8', red: '#e5484d', white: '#ffffff' };
const F = { logo: 'Pacifico', sans: 'Be Vietnam Pro', hand: 'Dancing Script', note: 'Patrick Hand' };
const n1 = v => Math.round(v * 10) / 10;
const pick = a => a[(r() * a.length) | 0];
const rad = d => d * Math.PI / 180;
const pt = (cx, cy, rr, deg) => [n1(cx + Math.cos(rad(deg)) * rr), n1(cy + Math.sin(rad(deg)) * rr)];
const tf = (x, y, a = 0, s = 1) => `translate(${n1(x)} ${n1(y)})${a ? ` rotate(${n1(a)})` : ''}${s !== 1 ? ` scale(${s})` : ''}`;
const g = (x, y, a, s, inner) => `<g transform="${tf(x, y, a, s)}">${inner}</g>`;
const ink = (sw = 2, c = C.plum) => `stroke="${c}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"`;
const T = (x, y, str, o = {}) => `<text x="${n1(x)}" y="${n1(y)}" font-family="${o.f || F.sans}" font-weight="${o.w || 800}" font-size="${o.s || 14}"` +
  `${o.ls ? ` letter-spacing="${o.ls}"` : ''}${o.anchor ? ` text-anchor="${o.anchor}"` : ''} fill="${o.fill || C.plum}"` +
  `${o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 4}" paint-order="stroke" stroke-linejoin="round"` : ''}>${str}</text>`;
const measure = (str, font) => { const c = measure.c || (measure.c = document.createElement('canvas').getContext('2d')); c.font = font; return c.measureText(str).width; };
const fit = (str, weight, family, size, w) => Math.min(size, n1(w / measure(str, `${weight} 100px "${family}"`) * 100));

/* what the scatter keeps clear of: boxes, and the stage's circle */
const BOX = [], ROUND = [];
const keep = (x0, y0, x1, y1) => BOX.push([x0, y0, x1, y1]);
const blocked = (x, y, m = 0) => BOX.some(([a, b, c, d]) => x > a - m && x < c + m && y > b - m && y < d + m) ||
  ROUND.some(([cx, cy, rr]) => Math.hypot(x - cx, y - cy) < rr + m);

/* ---- small shapes ---- */
const heart = (z, fill, sw = 1.8, c = C.plum) => `<path d="M0 ${n1(z * .38)} C${n1(-z * .95)} ${n1(-z * .18)} ${n1(-z * .48)} ${n1(-z * .9)} 0 ${n1(-z * .42)} C${n1(z * .48)} ${n1(-z * .9)} ${n1(z * .95)} ${n1(-z * .18)} 0 ${n1(z * .38)}Z" fill="${fill}" ${ink(sw, c)}/>`;
const sparkle = (z, fill, sw = 1.4) => `<path d="M0 ${n1(-z)} Q${n1(z * .14)} ${n1(-z * .14)} ${n1(z)} 0 Q${n1(z * .14)} ${n1(z * .14)} 0 ${n1(z)} Q${n1(-z * .14)} ${n1(z * .14)} ${n1(-z)} 0 Q${n1(-z * .14)} ${n1(-z * .14)} 0 ${n1(-z)}Z" fill="${fill}" ${ink(sw)}/>`;
const star5 = (z, fill, sw = 1.4) => { let d = ''; for (let i = 0; i < 10; i++) { const rr = i % 2 ? z * .45 : z * (.9 + r() * .2), [x, y] = pt(0, 0, rr, -90 + i * 36); d += `${i ? 'L' : 'M'}${x} ${y}`; } return `<path d="${d}Z" fill="${fill}" ${ink(sw)}/>`; };
const note = (z, fill) => `<ellipse rx="${n1(z * .42)}" ry="${n1(z * .3)}" transform="rotate(-22)" fill="${fill}" ${ink(1.4)}/>` +
  `<path d="M${n1(z * .36)} ${n1(-z * .1)} V${n1(-z * 1.25)} q${n1(z * .34)} ${n1(z * .22)} ${n1(z * .52)} ${n1(z * .56)}" fill="none" ${ink(1.8)}/>`;
/** a cloud of bumps: popcorn, smoke, a puff (z: its radius, n: how many bumps) */
function puff(z, n, fill, sw = 1.5) {
  const p = [];
  for (let i = 0; i < n; i++) p.push(pt(0, 0, z * (.78 + r() * .3), i / n * 360 + (r() - .5) * 22));
  let d = `M${p[0][0]} ${p[0][1]}`;
  for (let i = 1; i <= n; i++) { const [x, y] = p[i % n], [px, py] = p[i - 1], ch = n1(Math.hypot(x - px, y - py) * .62); d += ` A${ch} ${ch} 0 0 1 ${x} ${y}`; }
  return `<path d="${d}Z" fill="${fill}" ${ink(sw)}/>`;
}
/** a strip of tape with torn ends, centred on 0 0 */
function tape(w, h, fill, sw = 1.2) {
  let d = `M${n1(-w / 2)} ${n1(-h / 2)} L${n1(w / 2)} ${n1(-h / 2)}`;
  for (let i = 1; i <= 4; i++) d += ` L${n1(w / 2 + (i % 2 ? 2.4 : 0))} ${n1(-h / 2 + h * i / 4)}`;
  d += ` L${n1(-w / 2)} ${n1(h / 2)}`;
  for (let i = 1; i <= 4; i++) d += ` L${n1(-w / 2 - (i % 2 ? 2.4 : 0))} ${n1(h / 2 - h * i / 4)}`;
  return `<path d="${d}Z" fill="${fill}" ${ink(sw)}/>`;
}
const spikeX = (z, fill) => g(0, 0, 45, 1, tape(z, z * .27, fill)) + g(0, 0, -45, 1, tape(z, z * .27, fill));
const spikeT = (z, fill) => tape(z, z * .27, fill) + g(0, z * .4, 90, 1, tape(z * .62, z * .27, fill));
const bulb = (rr, lit = true) => (lit ? `<circle r="${n1(rr * 1.9)}" fill="${C.butter}" opacity=".5"/>` : '') +
  `<circle r="${n1(rr)}" fill="${lit ? C.gold : C.rose}" ${ink(1.2)}/><circle cx="${n1(-rr * .35)}" cy="${n1(-rr * .35)}" r="${n1(rr * .3)}" fill="#fff" opacity=".85"/>`;
const polaroid = (z, photo, inner = '') => `<rect x="${n1(-z / 2)}" y="${n1(-z * .55)}" width="${n1(z)}" height="${n1(z * 1.16)}" rx="1.5" fill="${C.white}" ${ink(1.3)}/>` +
  `<rect x="${n1(-z * .39)}" y="${n1(-z * .44)}" width="${n1(z * .78)}" height="${n1(z * .74)}" fill="${photo}" ${ink(1)}/>` + inner;
/** two little people in a photo: heads and shoulders, side by side */
const couple = z => `<circle cx="${n1(-z * .16)}" cy="${n1(-z * .12)}" r="${n1(z * .1)}" fill="${C.wood3}" ${ink(.9)}/><circle cx="${n1(z * .16)}" cy="${n1(-z * .12)}" r="${n1(z * .1)}" fill="${C.wine}" ${ink(.9)}/>` +
  `<path d="M${n1(-z * .32)} ${n1(z * .22)} Q${n1(-z * .16)} ${n1(-z * .04)} 0 ${n1(z * .22)} Q${n1(z * .16)} ${n1(-z * .04)} ${n1(z * .32)} ${n1(z * .22)}Z" fill="${C.cream}" ${ink(.9)}/>`;

/* ---- props, drawn round 0 0 ---- */
function cup(z) {                                                       // a takeaway coffee with a heart on its sleeve
  const w0 = z * .62, w1 = z * .46, h = z;
  let s = `<path d="M${n1(-w0 / 2)} ${n1(-h * .36)} L${n1(w0 / 2)} ${n1(-h * .36)} L${n1(w1 / 2)} ${n1(h * .5)} Q0 ${n1(h * .56)} ${n1(-w1 / 2)} ${n1(h * .5)}Z" fill="${C.paper}" ${ink(2)}/>`;
  s += `<path d="M${n1(-w0 * .47)} ${n1(-h * .1)} L${n1(w0 * .47)} ${n1(-h * .1)} L${n1(w0 * .4)} ${n1(h * .24)} L${n1(-w0 * .4)} ${n1(h * .24)}Z" fill="${C.velvet}" ${ink(1.8)}/>`;
  s += g(0, h * .07, 0, 1, heart(h * .22, C.cream, 1.2));
  s += `<rect x="${n1(-w0 * .58)}" y="${n1(-h * .49)}" width="${n1(w0 * 1.16)}" height="${n1(h * .14)}" rx="${n1(h * .05)}" fill="${C.wood}" ${ink(1.8)}/>`;
  s += `<path d="M${n1(-w0 * .36)} ${n1(-h * .49)} Q0 ${n1(-h * .64)} ${n1(w0 * .36)} ${n1(-h * .49)}Z" fill="${C.wood2}" ${ink(1.6)}/>`;
  return s;
}
const steam = z => `<path d="M${n1(-z * .12)} ${n1(-z * .7)} q${n1(-z * .12)} ${n1(-z * .14)} 0 ${n1(-z * .28)} t0 ${n1(-z * .28)} M${n1(z * .12)} ${n1(-z * .74)} q${n1(z * .12)} ${n1(-z * .12)} 0 ${n1(-z * .24)} t0 ${n1(-z * .24)}" fill="none" ${ink(1.8, C.wood3)}/>`;
function popcorn(z) {                                                   // a striped bucket heaped with popcorn
  const w0 = z * .84, w1 = z * .6, y0 = 0, h = z * .74;
  let s = '';
  [[-.3, -.02, .15], [-.1, -.1, .17], [.12, -.08, .17], [.31, -.01, .14], [-.2, .05, .14], [.02, .03, .15], [.22, .06, .13], [-.36, .08, .11], [.38, .08, .11]]
    .forEach(([dx, dy, k]) => { s += g(dx * z, y0 + dy * z, r() * 60, 1, puff(k * z, 5, pick([C.cream, C.butter, C.paper]), 1.4)); });
  s += `<path d="M${n1(-w0 / 2)} ${n1(y0 + z * .1)} L${n1(w0 / 2)} ${n1(y0 + z * .1)} L${n1(w1 / 2)} ${n1(y0 + z * .1 + h)} L${n1(-w1 / 2)} ${n1(y0 + z * .1 + h)}Z" fill="${C.cream}" ${ink(2.2)}/>`;
  for (const i of [0, 2, 4]) {
    const xt = k => -w0 / 2 + w0 * k / 5, xb = k => -w1 / 2 + w1 * k / 5;
    s += `<path d="M${n1(xt(i))} ${n1(y0 + z * .1)} L${n1(xt(i + 1))} ${n1(y0 + z * .1)} L${n1(xb(i + 1))} ${n1(y0 + z * .1 + h)} L${n1(xb(i))} ${n1(y0 + z * .1 + h)}Z" fill="${C.red}" ${ink(1.4)}/>`;
  }
  s += `<rect x="${n1(-w0 * .53)}" y="${n1(y0 + z * .05)}" width="${n1(w0 * 1.06)}" height="${n1(z * .1)}" rx="3" fill="${C.cream}" ${ink(1.8)}/>`;
  s += `<ellipse cx="0" cy="${n1(y0 + z * .48)}" rx="${n1(z * .2)}" ry="${n1(z * .12)}" fill="${C.cream}" ${ink(1.5)}/>` + T(0, y0 + z * .52, 'BẮP', { s: n1(z * .11), w: 900, anchor: 'middle', fill: C.red });
  return s;
}
function remote(z) {                                                    // the remote they fight over
  const w = z * .34;
  let s = `<rect x="${n1(-w / 2)}" y="${n1(-z / 2)}" width="${n1(w)}" height="${n1(z)}" rx="${n1(w * .42)}" fill="${C.plum}" ${ink(2)}/>`;
  s += `<circle cy="${n1(-z * .35)}" r="${n1(w * .16)}" fill="${C.red}" ${ink(1.1, C.cream)}/>`;
  const cols = [C.gold, C.mint, C.pink, C.cream, C.rose, C.gold];
  cols.forEach((c, i) => { s += `<circle cx="${n1((i % 2 ? 1 : -1) * w * .2)}" cy="${n1(-z * .16 + (i >> 1) * z * .12)}" r="${n1(w * .11)}" fill="${c}"/>`; });
  return s + g(0, z * .3, 0, 1, heart(w * .42, C.velvet, 1.1, C.cream));
}
function tv(w, screen = C.pink, inner = '') {                          // a little old TV on legs, with its antenna
  const h = w * .74;
  let s = `<path d="M${n1(-w * .1)} ${n1(-h * .5)} L${n1(-w * .3)} ${n1(-h * .9)} M${n1(w * .1)} ${n1(-h * .5)} L${n1(w * .26)} ${n1(-h * .88)}" fill="none" ${ink(1.8)}/>`;
  s += `<circle cx="${n1(-w * .3)}" cy="${n1(-h * .9)}" r="${n1(w * .045)}" fill="${C.gold}" ${ink(1.1)}/><circle cx="${n1(w * .26)}" cy="${n1(-h * .88)}" r="${n1(w * .045)}" fill="${C.red}" ${ink(1.1)}/>`;
  s += `<path d="M${n1(-w * .3)} ${n1(h * .45)} l${n1(-w * .07)} ${n1(h * .2)} M${n1(w * .3)} ${n1(h * .45)} l${n1(w * .07)} ${n1(h * .2)}" ${ink(2.2)}/>`;
  s += `<rect x="${n1(-w / 2)}" y="${n1(-h / 2)}" width="${n1(w)}" height="${n1(h)}" rx="${n1(w * .14)}" fill="${C.wood2}" ${ink(2.2)}/>`;
  s += `<rect x="${n1(-w * .42)}" y="${n1(-h * .37)}" width="${n1(w * .6)}" height="${n1(h * .74)}" rx="${n1(w * .1)}" fill="${screen}" ${ink(1.8)}/>`;
  s += `<circle cx="${n1(w * .32)}" cy="${n1(-h * .16)}" r="${n1(w * .06)}" fill="${C.cream}" ${ink(1.2)}/><circle cx="${n1(w * .32)}" cy="${n1(h * .12)}" r="${n1(w * .06)}" fill="${C.cream}" ${ink(1.2)}/>`;
  return s + g(-w * .12, 0, 0, 1, inner);
}
function sofa(w) {                                                      // the velvet two-seater
  const h = w * .48;
  let s = `<path d="M${n1(-w * .4)} ${n1(h * .4)} v${n1(h * .14)} M${n1(w * .4)} ${n1(h * .4)} v${n1(h * .14)}" ${ink(3, C.wood3)}/>`;
  s += `<rect x="${n1(-w * .42)}" y="${n1(-h * .5)}" width="${n1(w * .84)}" height="${n1(h * .64)}" rx="${n1(h * .22)}" fill="${C.velvet}" ${ink(2.2)}/>`;
  s += `<path d="M0 ${n1(-h * .42)} V${n1(h * .02)}" ${ink(1.4, C.wine)}/>`;
  s += `<rect x="${n1(-w * .44)}" y="${n1(h * .02)}" width="${n1(w * .88)}" height="${n1(h * .32)}" rx="${n1(h * .12)}" fill="${C.rose}" ${ink(2)}/>`;
  s += `<rect x="${n1(-w * .5)}" y="${n1(-h * .2)}" width="${n1(w * .16)}" height="${n1(h * .62)}" rx="${n1(h * .1)}" fill="${C.velvet}" ${ink(2.2)}/>`;
  s += `<rect x="${n1(w * .34)}" y="${n1(-h * .2)}" width="${n1(w * .16)}" height="${n1(h * .62)}" rx="${n1(h * .1)}" fill="${C.velvet}" ${ink(2.2)}/>`;
  s += g(-w * .2, -h * .14, -10, 1, `<rect x="${n1(-w * .1)}" y="${n1(-h * .15)}" width="${n1(w * .2)}" height="${n1(h * .3)}" rx="${n1(h * .08)}" fill="${C.gold}" ${ink(1.6)}/>`);
  return s + g(w * .18, -h * .12, 8, 1, heart(h * .44, C.cream, 1.6));
}
function fridge(w) {                                                    // a fridge with two polaroids under magnets
  const h = w * 1.6;
  let s = `<rect x="${n1(-w / 2)}" y="${n1(-h / 2)}" width="${n1(w)}" height="${n1(h)}" rx="${n1(w * .16)}" fill="${C.paper}" ${ink(2.2)}/>`;
  s += `<path d="M${n1(-w / 2)} ${n1(-h * .16)} H${n1(w / 2)}" ${ink(1.8)}/>`;
  s += `<rect x="${n1(w * .3)}" y="${n1(-h * .42)}" width="${n1(w * .08)}" height="${n1(h * .16)}" rx="2" fill="${C.mint2}" ${ink(1.2)}/><rect x="${n1(w * .3)}" y="${n1(-h * .08)}" width="${n1(w * .08)}" height="${n1(h * .22)}" rx="2" fill="${C.mint2}" ${ink(1.2)}/>`;
  s += g(-w * .1, h * .1, -8, 1, polaroid(w * .4, C.rose, couple(w * .4)) + `<circle cy="${n1(-w * .22)}" r="${n1(w * .06)}" fill="${C.red}" ${ink(.9)}/>`);
  s += g(w * .02, -h * .32, 7, 1, polaroid(w * .34, C.gold, heart(w * .16, C.velvet, .9)) + `<circle cy="${n1(-w * .19)}" r="${n1(w * .05)}" fill="${C.mint2}" ${ink(.9)}/>`);
  return s;
}
function stove(w) {                                                     // the oven, a pan on it, and the smoke
  const h = w * .9;
  let s = `<rect x="${n1(-w / 2)}" y="${n1(-h * .3)}" width="${n1(w)}" height="${n1(h * .8)}" rx="${n1(w * .08)}" fill="${C.paper}" ${ink(2.2)}/>`;
  s += `<rect x="${n1(-w * .36)}" y="${n1(-h * .04)}" width="${n1(w * .72)}" height="${n1(h * .38)}" rx="${n1(w * .06)}" fill="${C.plum2}" ${ink(1.8)}/><path d="M${n1(-w * .26)} ${n1(h * .04)} l${n1(w * .12)} ${n1(-h * .0)}" ${ink(2, C.lilac)}/>`;
  for (let k = 0; k < 4; k++) s += `<circle cx="${n1(-w * .3 + k * w * .2)}" cy="${n1(-h * .17)}" r="${n1(w * .045)}" fill="${pick([C.red, C.gold, C.mint2])}" ${ink(1)}/>`;
  s += `<rect x="${n1(-w * .54)}" y="${n1(-h * .36)}" width="${n1(w * 1.08)}" height="${n1(h * .07)}" rx="2" fill="${C.wood2}" ${ink(1.6)}/>`;
  s += `<path d="M${n1(-w * .34)} ${n1(-h * .4)} Q0 ${n1(-h * .24)} ${n1(w * .34)} ${n1(-h * .4)}Z" fill="${C.plum}" ${ink(1.8)}/><path d="M${n1(w * .32)} ${n1(-h * .39)} L${n1(w * .66)} ${n1(-h * .5)}" ${ink(3.4)}/>`;
  s += `<ellipse cx="${n1(-w * .04)}" cy="${n1(-h * .41)}" rx="${n1(w * .12)}" ry="${n1(h * .05)}" fill="${C.white}" ${ink(1.1)}/><circle cx="${n1(-w * .04)}" cy="${n1(-h * .42)}" r="${n1(w * .045)}" fill="${C.gold}" ${ink(1)}/>`;
  return s + g(-w * .1, -h * .66, 0, 1, puff(w * .15, 6, C.cream)) + g(w * .14, -h * .86, 0, 1, puff(w * .12, 5, C.cream)) + g(-w * .04, -h * 1.04, 0, 1, puff(w * .08, 5, C.cream));
}
function cityWindow(w, id) {                                            // the balcony window: night, a moon, the city's lights
  const h = w * .84;
  let inner = `<rect x="${n1(-w / 2)}" y="${n1(-h / 2)}" width="${n1(w)}" height="${n1(h)}" fill="${C.plum}"/>`;
  for (let i = 0; i < 14; i++) inner += `<circle cx="${n1(-w / 2 + r() * w)}" cy="${n1(-h / 2 + r() * h * .45)}" r="${n1(.7 + r() * 1.1)}" fill="${pick([C.butter, C.white, C.lilac])}"/>`;
  inner += `<path d="M${n1(w * .2)} ${n1(-h * .36)} a${n1(w * .1)} ${n1(w * .1)} 0 1 0 ${n1(w * .12)} ${n1(w * .14)} a${n1(w * .08)} ${n1(w * .08)} 0 1 1 ${n1(-w * .12)} ${n1(-w * .14)}Z" fill="${C.butter}" ${ink(1, C.film)}/>`;
  for (let x = -w / 2, i = 0; x < w / 2; i++) {
    const bw = w * (.12 + r() * .1), bh = h * (.22 + r() * .3);
    inner += `<rect x="${n1(x)}" y="${n1(h / 2 - bh)}" width="${n1(bw)}" height="${n1(bh)}" fill="${pick([C.plum2, '#4b3a62', '#6a5486'])}" ${ink(1, C.film)}/>`;
    for (let k = 0; k < 4; k++) inner += `<rect x="${n1(x + 2 + r() * (bw - 6))}" y="${n1(h / 2 - bh + 3 + r() * (bh - 8))}" width="2.6" height="3.2" fill="${pick([C.gold, C.butter, C.rose])}"/>`;
    x += bw + 1;
  }
  let s = `<defs><clipPath id="${id}"><rect x="${n1(-w / 2 + 6)}" y="${n1(-h / 2 + 6)}" width="${n1(w - 12)}" height="${n1(h - 12)}" rx="3"/></clipPath></defs>`;
  s += `<rect x="${n1(-w / 2)}" y="${n1(-h / 2)}" width="${n1(w)}" height="${n1(h)}" rx="7" fill="${C.wood}" ${ink(2.2)}/>`;
  s += `<g clip-path="url(#${id})">${inner}</g>`;

/* ---- the frame: plum, its marquee bulbs, words on each side ---- */
function frame() {
  let s = `<rect width="1280" height="800" fill="${C.plum}"/>`;
  const font = `800 11.5px "${F.sans}"`, words = [
    [676, 19, 0, 'HAI ĐỨA MÌNH — THE SERIES  ·  MÙA 1  ·  SÁU TẬP  ·  PHIM TÌNH CẢM HÀI  ·  TRƯỜNG QUAY SỐ 2'],
    [676, 789, 0, 'ĐẶT THIỆP NẰM PHẲNG  ·  LAY THE CARD FLAT  ·  KEEP IT IN VIEW  ·  No. 0601  ·  CÒN TIẾP…'],
    [1265, 400, 90, 'VỖ TAY  ·  CƯỜI LÊN  ·  TẬP SAU CÒN HAY HƠN']];
  const half = words.map(([, , , str]) => (measure(str, font) + str.length * 3) / 2 + 16);
  const free = (x, y) => words.every(([wx, wy, a], i) => a ? !(Math.abs(x - wx) < 16 && Math.abs(y - wy) < half[i]) : !(Math.abs(y - wy) < 16 && Math.abs(x - wx) < half[i]));
  const run = (x0, y0, x1, y1) => {                                     // bulbs along a side, their spacing a little uneven
    const len = Math.hypot(x1 - x0, y1 - y0);
    for (let t = 12 + r() * 10; t < len - 12; t += 25 + r() * 16) {
      const x = x0 + (x1 - x0) * t / len, y = y0 + (y1 - y0) * t / len;
      if (free(x, y)) s += g(x, y, 0, 1, bulb(4.3 + r() * 1.5, r() > .14));
    }
  };
  run(130, 15, 1265, 15); run(130, 785, 1265, 785); run(1265, 34, 1265, 766);
  words.forEach(([x, y, a, str]) => { s += g(x, y, a, 1, T(0, a ? 4 : 0, str, { s: 11.5, ls: 3, anchor: 'middle', fill: C.cream })); });
  s += `<rect x="30" y="30" width="1220" height="740" rx="14" fill="${C.blush}" ${ink(2.6, C.film)}/>`;
  for (let i = 0; i < 1100; i++) {                                     // the studio floor: terrazzo chips, each its own size and turn
    const x = 36 + r() * 1208, y = 36 + r() * 728, z = 1.6 + r() * 3.8, k = 3 + (r() * 3 | 0);
    let d = '';
    for (let j = 0; j < k; j++) { const [px, py] = pt(x, y, z * (.6 + r() * .5), j / k * 360 + r() * 50); d += `${j ? 'L' : 'M'}${px} ${py}`; }
    s += `<path d="${d}Z" fill="${pick([C.pink, C.pink, C.rose, C.cream, C.mint, C.wood, C.lilac, C.gold, C.white])}"/>`;
  }
  s += `<rect x="42" y="42" width="1196" height="716" rx="10" fill="none" stroke="${C.velvet}" stroke-width="1.6" stroke-dasharray="12 7"/>`;
  return s;
}

/* ---- the film strip down the left edge: the six episodes as stills, a countdown leader at the top ---- */

  const cx = 72, W = 104, top = -70, bot = 870, fw = 78, fh = 100, gap = 12;

  const eps = [

      g(-6, -8, 0, 1, puff(10, 6, C.cream)) + g(8, -24, 0, 1, puff(8, 5, C.cream)) + g(18, -38, 0, 1, `<circle r="7" fill="${C.paper}" ${ink(1.5)}/><circle r="2.6" fill="${C.red}"/>`) + `<path d="M24 -44 l5 -4 M26 -36 l6 0" ${ink(1.4, C.red)}/>`],

    [C.plum2, z => lights(-34, -30, 34, -32, 12, 5) + g(0, 12, 0, 1, heart(26, C.rose, 1.6, C.cream)) + g(-22, 30, 0, 1, sparkle(5, C.gold, 1)) + g(22, 34, 0, 1, sparkle(4, C.butter, 1))],
    [C.cream, z => {
      let t = `<circle r="27" fill="${C.wood2}" ${ink(2)}/><circle r="7" fill="${C.cream}" ${ink(1.6)}/>`;
      for (let k = 0; k < 5; k++) { const [x, y] = pt(0, 0, 16, k * 72 - 90); t += `<circle cx="${x}" cy="${y}" r="5.6" fill="${C.cream}" ${ink(1.4)}/>`; }

  const sector = (a0, a1) => { const [x0, y0] = pt(TX, TY, RI, a0), [x1, y1] = pt(TX, TY, RI, a1); return `M${TX} ${TY} L${x0} ${y0} A${RI} ${RI} 0 0 1 ${x1} ${y1}Z`; };
  s += `<defs><clipPath id="room1"><path d="${sector(30, 150)}"/></clipPath><clipPath id="room2"><path d="${sector(150, 270)}"/></clipPath><clipPath id="room3"><path d="${sector(270, 390)}"/></clipPath></defs>`;
  let liv = `<rect x="${TX - RI}" y="${TY}" width="${RI * 2}" height="${RI}" fill="${C.pink}"/>`;           // living room: wallpaper dots
  for (let i = 0; i < 90; i++) { const x = TX - RI + r() * RI * 2, y = TY + r() * RI; liv += r() < .3 ? g(x, y, r() * 40, 1, sparkle(3 + r() * 2, C.cream, .8)) : `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(1.8 + r() * 2)}" fill="${pick([C.cream, C.rose, C.white])}"/>`; }
  let kit = `<rect x="${TX - RI}" y="${TY - RI}" width="${RI}" height="${RI * 1.6}" fill="${C.mint}"/>`;     // kitchen: tiles, each laid a little crooked
  for (let y = TY - RI, j = 0; y < TY + RI * .6; y += 24, j++) for (let x = TX - RI + (j % 2) * 12, i = 0; x < TX + 20; x += 24, i++) {
    kit += `<rect x="${n1(x + 1 + r() * 1.5)}" y="${n1(y + 1 + r() * 1.5)}" width="${n1(20 + r() * 2)}" height="${n1(20 + r() * 2)}" rx="3" fill="${(i + j) % 3 ? C.mint : C.paper}" stroke="${C.mint2}" stroke-width="1.2" transform="rotate(${n1((r() - .5) * 4)} ${n1(x + 12)} ${n1(y + 12)})"/>`;
  }
  let win = `<rect x="${TX - 20}" y="${TY - RI}" width="${RI + 30}" height="${RI * 1.6}" fill="${C.wood}"/>`;   // window corner: floorboards

    else if (k < .38) s += g(x, y, a, 1, star5(5 + r() * 4, pick([C.gold, C.butter, C.lilac])));

    else if (k < .7) s += g(x, y, a, 1, puff(4 + r() * 3, 5, pick([C.cream, C.butter, C.paper]), 1.3));
    else if (k < .74) s += g(x, y, a, 1, heart(9 + r() * 6, pick([C.velvet, C.rose, C.red])));
    else if (k < .8) s += g(x, y, a, 1, `<path d="M0 -8 L2.4 -2.4 L8 0 L2.4 2.4 L0 8 L-2.4 2.4 L-8 0 L-2.4 -2.4Z" fill="${pick([C.gold, C.cream])}" ${ink(1.2)}/>`);
    else if (k < .92) s += `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(2.4 + r() * 2.6)}" fill="${pick([C.velvet, C.gold, C.mint2, C.red, C.plum2])}"/>`;
    else s += g(x, y, a * 2, 1, tape(14 + r() * 10, 6, pick([C.mint, C.gold, C.rose])));
  }
  return s;
}

const FACES = [`400 74px "${F.logo}"`, `700 24px "${F.hand}"`, `400 17px "${F.note}"`, `600 14px "${F.sans}"`, `800 14px "${F.sans}"`, `900 14px "${F.sans}"`];
Promise.all(FACES.map(f => document.fonts.load(f, 'Hai Đứa Mình ĐANG QUAY Vỗ tay Lần đầu gặp nhau Ối! Cảnh Nội Căn hộ — … ữ ơ ư ạ ả ấ ỏ'))).then(() => {
  const parts = [frame(), stage(), studio(), onAir(), applause(), episodes(), script(), cornerBL(), ribbon(), filmStrip(), truss()];
  document.getElementById('card').innerHTML = parts.join('') + scatter();
  return document.fonts.ready;
}).then(() => { window.__ready = true; });
</script>
