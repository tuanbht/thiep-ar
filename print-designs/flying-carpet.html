<!doctype html>
<html><head><meta charset="utf-8"><title>Thảm bay đêm trăng: the print</title>
<link rel="stylesheet" href="/node_modules/@fontsource/dancing-script/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/pacifico/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/patrick-hand/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/600.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/800.css">
<style>
/* The printed card = the tracking image. "Thảm bay đêm trăng" (a carpet ride under the moon) as a night-city postcard
   that is itself a woven rug: patterned bands along the top and bottom (no two motifs alike in a row), knotted tassels at
   the left and right ends. On the right a tall arched window onto the night: a crescent moon, stars, clouds, doves, sky
   lanterns, a tiny rug with two riders looping in a dotted heart, and a skyline of domes and towers of our own design in
   soft blues and golds with lit windows and strings of lanterns. On the left the title and a boarding pass for the
   ride; along the foot a tiled square with a star of blue and gold, where the act stands (the act's centre is the card's
   centre: the stage's x is 640 + 1280x, its z is 400 + 1280z). Every shape is inked in navy so the tracker finds edges
   everywhere; nothing is mirrored or tiled, and all randomness is seeded, so every render is the same picture. */
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#fff6e4}
svg{display:block}
</style></head><body>
<svg id="card" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const rng = s => () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; const r = rng(1001);
const C = { ink: '#1d2550', paper: '#fff6e4', cream: '#fffbf0', navy: '#232a5c', night: '#141b4f', indigo: '#2c3a7a', blue: '#4c6fb8', sky: '#6b8fd8',
  pale: '#c9d6f2', gold: '#f0b54a', gold2: '#c98f2a', butter: '#ffe08a', rose: '#e8436d', pink: '#ff9fb4', blush: '#ffe1e6', plum: '#6d2457',
  plum2: '#9a3f7c', coral: '#ff7a5c', lilac: '#c9b3f2', lav: '#8e86cf', sand: '#f2e3c6', stone: '#e2cfa9', lit: '#ffd27a', red: '#b72f4a', teal: '#3f8f98' };
const F = { hand: 'Dancing Script', sans: 'Be Vietnam Pro', round: 'Pacifico', note: 'Patrick Hand' };
const n1 = v => Math.round(v * 10) / 10;
const pick = a => a[(r() * a.length) | 0];
const rad = d => d * Math.PI / 180;
const pt = (cx, cy, rr, deg) => [n1(cx + Math.cos(rad(deg)) * rr), n1(cy + Math.sin(rad(deg)) * rr)];
const tf = (x, y, a = 0, s = 1) => `translate(${n1(x)} ${n1(y)})${a ? ` rotate(${n1(a)})` : ''}${s !== 1 ? ` scale(${s})` : ''}`;
const g = (x, y, a, s, inner) => `<g transform="${tf(x, y, a, s)}">${inner}</g>`;
const ink = (sw = 2, c = C.ink) => `stroke="${c}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"`;
const T = (x, y, str, o = {}) => `<text x="${n1(x)}" y="${n1(y)}" font-family="${o.f || F.sans}" font-weight="${o.w || 800}" font-size="${o.s || 14}"` +
  `${o.ls ? ` letter-spacing="${o.ls}"` : ''}${o.anchor ? ` text-anchor="${o.anchor}"` : ''} fill="${o.fill || C.ink}"` +
  `${o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 4}" paint-order="stroke" stroke-linejoin="round"` : ''}>${str}</text>`;
const measure = (str, font) => { const c = measure.c || (measure.c = document.createElement('canvas').getContext('2d')); c.font = font; return c.measureText(str).width; };

/* what the scatter keeps clear of */
const BOX = [];
const keep = (x0, y0, x1, y1) => BOX.push([x0, y0, x1, y1]);
const blocked = (x, y, m = 0) => BOX.some(([a, b, c, d]) => x > a - m && x < c + m && y > b - m && y < d + m);

/* ---- small shapes ---- */
const heart = (z, fill, sw = 1.8) => `<path d="M0 ${n1(z * .38)} C${n1(-z * .95)} ${n1(-z * .18)} ${n1(-z * .48)} ${n1(-z * .9)} 0 ${n1(-z * .42)} C${n1(z * .48)} ${n1(-z * .9)} ${n1(z * .95)} ${n1(-z * .18)} 0 ${n1(z * .38)}Z" fill="${fill}" ${ink(sw)}/>`;
const sparkle = (z, fill, sw = 1.4) => `<path d="M0 ${n1(-z)} Q${n1(z * .14)} ${n1(-z * .14)} ${n1(z)} 0 Q${n1(z * .14)} ${n1(z * .14)} 0 ${n1(z)} Q${n1(-z * .14)} ${n1(z * .14)} ${n1(-z)} 0 Q${n1(-z * .14)} ${n1(-z * .14)} 0 ${n1(-z)}Z" fill="${fill}" ${ink(sw)}/>`;
const star5 = (z, fill, sw = 1.4) => { let d = ''; for (let i = 0; i < 10; i++) { const rr = i % 2 ? z * .45 * (.9 + r() * .2) : z * (.9 + r() * .18), [x, y] = pt(0, 0, rr, -90 + i * 36); d += `${i ? 'L' : 'M'}${x} ${y}`; } return `<path d="${d}Z" fill="${fill}" ${ink(sw)}/>`; };
const star8 = (z, fill, sw = 1.4) => { let d = ''; for (let i = 0; i < 16; i++) { const [x, y] = pt(0, 0, i % 2 ? z * .55 : z, -90 + i * 22.5); d += `${i ? 'L' : 'M'}${x} ${y}`; } return `<path d="${d}Z" fill="${fill}" ${ink(sw)}/>`; };
const crescent = (z, fill, sw = 1.6) => `<path d="M${n1(z * .3)} ${n1(-z)} A${n1(z)} ${n1(z)} 0 1 0 ${n1(z * .3)} ${n1(z)} A${n1(z * .78)} ${n1(z * .78)} 0 1 1 ${n1(z * .3)} ${n1(-z)}Z" fill="${fill}" ${ink(sw)}/>`;
const diamond = (z, fill, sw = 1.4) => `<path d="M0 ${n1(-z)} L${n1(z * .7)} 0 L0 ${n1(z)} L${n1(-z * .7)} 0Z" fill="${fill}" ${ink(sw)}/>`;
const dove = (z, fill = C.cream, sw = 1.6) => `<path d="M${n1(-z)} ${n1(z * .1)} Q${n1(-z * .4)} ${n1(-z * .1)} 0 ${n1(z * .12)} Q${n1(z * .5)} ${n1(-z * .05)} ${n1(z * .95)} ${n1(-z * .12)} L${n1(z * .7)} ${n1(z * .2)} Q${n1(z * .2)} ${n1(z * .45)} ${n1(-z * .35)} ${n1(z * .32)}Z" fill="${fill}" ${ink(sw)}/>` +
  `<path d="M${n1(-z * .1)} ${n1(z * .1)} Q${n1(-z * .05)} ${n1(-z * .75)} ${n1(z * .55)} ${n1(-z * .85)} Q${n1(z * .3)} ${n1(-z * .3)} ${n1(z * .25)} ${n1(z * .06)}" fill="${fill}" ${ink(sw)}/><circle cx="${n1(z * .78)}" cy="${n1(-z * .05)}" r="${n1(z * .05)}" fill="${C.ink}"/>`;
const lantern = (z, fill = C.coral) => `<path d="M0 ${n1(-z * 1.2)} V${n1(-z * .8)}" ${ink(1.2)}/><rect x="${n1(-z * .4)}" y="${n1(-z * .85)}" width="${n1(z * .8)}" height="${n1(z * .18)}" rx="1" fill="${C.gold2}" ${ink(1.1)}/>` +
  `<ellipse cx="0" cy="0" rx="${n1(z * .62)}" ry="${n1(z * .72)}" fill="${fill}" ${ink(1.5)}/><path d="M0 ${n1(-z * .7)} V${n1(z * .7)} M${n1(-z * .4)} ${n1(-z * .55)} Q${n1(-z * .62)} 0 ${n1(-z * .4)} ${n1(z * .55)} M${n1(z * .4)} ${n1(-z * .55)} Q${n1(z * .62)} 0 ${n1(z * .4)} ${n1(z * .55)}" fill="none" ${ink(.9, 'rgba(29,37,80,.55)')}/>` +
  `<rect x="${n1(-z * .3)}" y="${n1(z * .68)}" width="${n1(z * .6)}" height="${n1(z * .16)}" rx="1" fill="${C.gold2}" ${ink(1.1)}/><path d="M0 ${n1(z * .84)} V${n1(z * 1.15)}" ${ink(1.4, C.rose)}/>`;
const skyLantern = (z, fill = '#ffb45c') => `<circle cx="0" cy="${n1(z * .1)}" r="${n1(z * 1.4)}" fill="rgba(255,190,110,.22)"/><path d="M${n1(-z * .62)} ${n1(-z * .7)} L${n1(z * .62)} ${n1(-z * .7)} L${n1(z * .42)} ${n1(z * .7)} L${n1(-z * .42)} ${n1(z * .7)}Z" fill="${fill}" ${ink(1.4)}/>` +
  `<path d="M${n1(-z * .2)} ${n1(-z * .7)} L${n1(-z * .14)} ${n1(z * .7)} M${n1(z * .2)} ${n1(-z * .7)} L${n1(z * .14)} ${n1(z * .7)}" ${ink(.8, 'rgba(29,37,80,.45)')}/><ellipse cx="0" cy="${n1(z * .7)}" rx="${n1(z * .42)}" ry="${n1(z * .1)}" fill="${C.butter}" ${ink(1)}/>`;

/* ---- the rug the postcard is: woven bands top and bottom, knotted tassels at both ends ---- */
function sheet() {
  let s = `<rect width="1280" height="800" fill="${C.paper}"/>`;
  for (const [y0, y1] of [[0, 46], [754, 800]]) {                     // a navy band: a gold meander, motifs in no fixed order
    s += `<rect x="40" y="${y0}" width="1200" height="${y1 - y0}" fill="${C.navy}"/>`;
    let d = `M40 ${(y0 + y1) / 2}`;
    for (let x = 40; x <= 1240; x += 9 + r() * 8) d += ` L${n1(x)} ${n1((y0 + y1) / 2 + (r() < .5 ? -1 : 1) * (6 + r() * 7))}`;
    s += `<path d="${d}" fill="none" ${ink(3, C.gold)}/>`;
    for (let x = 52; x < 1232; x += 18 + r() * 26) {
      const y = (y0 + y1) / 2 + (r() - .5) * 18, k = r(), z = 4 + r() * 4;
      if (k < .3) s += g(x, y, 0, 1, diamond(z, pick([C.rose, C.cream, C.sky]), 1.1));
      else if (k < .55) s += g(x, y, r() * 40, 1, star8(z, pick([C.gold, C.butter, C.cream]), 1));
      else if (k < .7) s += g(x, y, 0, 1, heart(z * 1.6, pick([C.rose, C.pink]), 1));
      else if (k < .85) s += `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(z * .55)}" fill="${pick([C.cream, C.coral, C.lilac])}" ${ink(1)}/>`;
      else s += g(x, y, r() * 60 - 30, 1, crescent(z * .9, C.butter, 1));
    }
    s += `<path d="M40 ${y0 === 0 ? y1 : y0} H1240" ${ink(3)}/><path d="M40 ${y0 === 0 ? y1 + 5 : y0 - 5} H1240" ${ink(2, C.gold2)}/>`;
  }
  for (const [x0, dir] of [[40, -1], [1240, 1]]) {                    // the tassels: threads in bunches, a knot on each, some gold
    s += `<rect x="${x0 - 8}" y="0" width="16" height="800" fill="${C.plum}" ${ink(2)}/>`;
    for (let y = 6; y < 800; y += 11 + r() * 5) {
      const len = 22 + r() * 12, col = r() < .22 ? C.gold : C.cream, bend = (r() - .5) * 6;
      for (let k = -2; k <= 2; k++) s += `<path d="M${n1(x0 + dir * 7)} ${n1(y)} Q${n1(x0 + dir * (7 + len * .5))} ${n1(y + k * 1.3 + bend)} ${n1(x0 + dir * (7 + len - Math.abs(k) * 2))} ${n1(y + k * 2.2 + bend * 1.6)}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linecap="round"/>`;
      s += `<ellipse cx="${n1(x0 + dir * 9)}" cy="${n1(y)}" rx="4.2" ry="3.2" fill="${pick([C.gold2, C.rose, C.gold])}" ${ink(1)}/>`;
    }
  }
  s += `<rect x="52" y="58" width="1176" height="684" rx="14" fill="none" stroke="${C.gold2}" stroke-width="1.6" stroke-dasharray="14 5 3 5"/>`;
  const plaque = (x, y, str, size = 11) => {
    const w = measure(str, `800 ${size}px "${F.sans}"`) + str.length * 2.2 + 30;
    return g(x, y, 0, 1, `<rect x="${n1(-w / 2)}" y="-12" width="${n1(w)}" height="24" rx="12" fill="${C.cream}" ${ink(2)}/>` + T(0, 4.5, str, { s: size, ls: 2.2, anchor: 'middle' }));
  };
  s += plaque(640, 23, 'THẢM BAY ĐÊM TRĂNG  ·  FLY WITH ME TONIGHT  ·  CHUYẾN BAY CỦA HAI TA');
  s += plaque(640, 777, 'ĐẶT THIỆP NẰM PHẲNG  ·  LAY THE CARD FLAT  ·  BAY CÙNG NHAU  ·  No. 1001');
  return s;
}

/* ---- the window onto the night: sky, moon, clouds, doves, sky lanterns, the tiny rug, the skyline ---- */
const WIN = { x0: 520, x1: 1206, top: 74, bot: 548 };
const winPath = `M${WIN.x0} ${WIN.bot} L${WIN.x0} 236 Q${WIN.x0} 132 ${n1((WIN.x0 + WIN.x1) / 2 - 120)} 102 Q${(WIN.x0 + WIN.x1) / 2} 82 ${(WIN.x0 + WIN.x1) / 2} ${WIN.top} ` +
  `Q${(WIN.x0 + WIN.x1) / 2} 82 ${n1((WIN.x0 + WIN.x1) / 2 + 120)} 102 Q${WIN.x1} 132 ${WIN.x1} 236 L${WIN.x1} ${WIN.bot}Z`;
function windowFrame() {
  keep(WIN.x0 - 14, WIN.top - 12, WIN.x1 + 14, WIN.bot + 10);
  return `<defs><clipPath id="win"><path d="${winPath}"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1446"/><stop offset=".45" stop-color="#26357a"/><stop offset=".78" stop-color="#4d5ca8"/><stop offset="1" stop-color="#9c88c4"/></linearGradient>
    <radialGradient id="moonglow"><stop offset="0" stop-color="#fff2c4" stop-opacity=".55"/><stop offset="1" stop-color="#fff2c4" stop-opacity="0"/></radialGradient></defs>
    <path d="${winPath}" fill="url(#sky)" ${ink(4)}/>`;
}
function sky() {
  let s = '';
  for (let i = 0; i < 230; i++) {                                    // stars: dots, and some with points
    const x = WIN.x0 + 8 + r() * (WIN.x1 - WIN.x0 - 16), y = WIN.top + 20 + Math.pow(r(), 1.2) * 330, k = r();
    if (k < .72) s += `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(.8 + r() * 1.8)}" fill="${pick(['#fff8e6', '#ffe9a8', '#dfe6ff'])}"/>`;
    else if (k < .9) s += g(x, y, r() * 30, 1, sparkle(3 + r() * 4, pick([C.butter, '#fff8e6', C.pale]), .9));
    else s += g(x, y, r() * 50, 1, star5(3.5 + r() * 3, C.butter, .9));
  }
  const mx = 1068, my = 176, mr = 66;                                  // the crescent moon, its glow, its seas
  s += `<circle cx="${mx}" cy="${my}" r="${mr * 2.2}" fill="url(#moonglow)"/>`;
  s += `<defs><mask id="cres"><rect x="0" y="0" width="1280" height="800" fill="#000"/><circle cx="${mx}" cy="${my}" r="${mr}" fill="#fff"/><circle cx="${mx + 34}" cy="${my - 18}" r="${mr * .86}" fill="#000"/></mask></defs>`;
  s += `<g mask="url(#cres)"><circle cx="${mx}" cy="${my}" r="${mr}" fill="#fbe4a0"/>`;
  for (const [dx, dy, z] of [[-30, -10, 12], [-40, 24, 8], [-14, 40, 10], [-48, -34, 6], [-22, 8, 5]]) s += `<ellipse cx="${mx + dx}" cy="${my + dy}" rx="${z}" ry="${z * .8}" fill="#e8c77a" ${ink(1, 'rgba(201,143,42,.6)')}/>`;
  s += `<circle cx="${mx}" cy="${my}" r="${mr}" fill="none" ${ink(4)}/><circle cx="${mx + 34}" cy="${my - 18}" r="${mr * .86}" fill="none" ${ink(3)}/></g>`;
  const cloud = (x, y, w, fill, rim) => {                             // a puffy cloud lit on top
    let d = ''; const n = 5 + ((r() * 3) | 0);
    for (let i = 0; i < n; i++) { const t = i / (n - 1), cx = x - w / 2 + t * w, rr = w * (.12 + .1 * Math.sin(Math.PI * t)) * (.8 + r() * .4); d += `<circle cx="${n1(cx)}" cy="${n1(y - rr * .4)}" r="${n1(rr)}" fill="${fill}" ${ink(2)}/>`; }
    return d + `<rect x="${n1(x - w / 2)}" y="${n1(y - 4)}" width="${n1(w)}" height="${n1(w * .1)}" rx="${n1(w * .05)}" fill="${fill}" ${ink(2)}/><path d="M${n1(x - w * .4)} ${n1(y - w * .2)} q${n1(w * .1)} ${n1(-w * .08)} ${n1(w * .22)} ${n1(-w * .04)}" fill="none" ${ink(2, rim)}/>`;
  };
  s += cloud(640, 212, 120, '#8f8fd6', '#e0dcff') + cloud(905, 150, 96, '#7d7fcc', '#d8d6ff') + cloud(1150, 318, 84, '#8c86cf', '#e8e2ff') + cloud(760, 330, 70, '#9a96da', '#ecebff');
  let loop = '';                                                     // the rug's way: a dotted loop that ends in a heart
  for (let i = 0; i <= 60; i++) { const t = i / 60 * Math.PI * 2, x = 820 + Math.sin(t) ** 3 * 120, y = 248 - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 7.4; loop += `${i ? 'L' : 'M'}${n1(x)} ${n1(y)}`; }
  s += `<path d="${loop}" fill="none" stroke="${C.butter}" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>`;
  s += g(948, 196, -14, 1, `<path d="M-30 0 Q-15 -6 0 0 T30 0 L26 9 Q10 4 -4 9 T-34 9Z" fill="${C.red}" ${ink(2)}/><path d="M-26 3 H22" stroke="${C.gold}" stroke-width="2" stroke-dasharray="3 3"/>` +
    `<path d="M-34 9 l-5 6 M-30 9 l-4 7 M26 9 l5 6 M30 1 l6 4" ${ink(1.4, C.cream)}/>` +
    `<circle cx="-8" cy="-14" r="7" fill="${C.ink}"/><path d="M-14 -8 Q-8 -2 -2 -8 L-3 0 H-13Z" fill="${C.cream}" ${ink(1.4)}/>` +
    `<path d="M4 -20 Q14 -26 18 -12 L16 0 H4Z" fill="${C.plum2}" ${ink(1.4)}/><circle cx="12" cy="-12" r="5" fill="#f6cfae" ${ink(1.2)}/>`);   // two riders
  [[600, 120, 18, -8], [700, 156, 14, 10], [1000, 270, 16, -4], [866, 300, 12, 6], [1150, 118, 13, -12]].forEach(([x, y, z, a]) => { s += g(x, y, a, 1, dove(z)); });
  [[560, 300, 11], [610, 250, 9], [700, 290, 8], [990, 340, 10], [1120, 380, 9], [880, 380, 8], [1186, 250, 7]].forEach(([x, y, z]) => { s += g(x, y, (r() - .5) * 10, 1, skyLantern(z)); });
  return s;
}
function skyline() {
  let s = '';
  const ground = WIN.bot - 2;
  const building = (x, w, h, fill, roof, lit) => {
    let b = `<rect x="${n1(x)}" y="${n1(ground - h)}" width="${n1(w)}" height="${n1(h + 2)}" fill="${fill}" ${ink(2)}/>`;
    const cx = x + w / 2, top = ground - h;
    if (roof === 'onion') b += `<path d="M${n1(cx - w * .4)} ${n1(top)} C${n1(cx - w * .58)} ${n1(top - w * .45)} ${n1(cx - w * .08)} ${n1(top - w * .66)} ${n1(cx)} ${n1(top - w * .92)} C${n1(cx + w * .08)} ${n1(top - w * .66)} ${n1(cx + w * .58)} ${n1(top - w * .45)} ${n1(cx + w * .4)} ${n1(top)}Z" fill="${r() < .5 ? C.gold : C.sky}" ${ink(2)}/>` +
      `<path d="M${n1(cx)} ${n1(top - w * .92)} V${n1(top - w * 1.1)}" ${ink(2)}/><circle cx="${n1(cx)}" cy="${n1(top - w * 1.12)}" r="2.6" fill="${C.gold}" ${ink(1)}/>`;
    else if (roof === 'dome') b += `<path d="M${n1(x + w * .08)} ${n1(top)} A${n1(w * .42)} ${n1(w * .36)} 0 0 1 ${n1(x + w * .92)} ${n1(top)}Z" fill="${r() < .6 ? C.sky : C.lilac}" ${ink(2)}/>` +
      `<path d="M${n1(cx)} ${n1(top - w * .36)} V${n1(top - w * .5)}" ${ink(2)}/><circle cx="${n1(cx)}" cy="${n1(top - w * .52)}" r="2.4" fill="${C.gold}" ${ink(1)}/>` +
      [.3, .5, .7].map(k => `<path d="M${n1(x + w * k)} ${n1(top)} Q${n1(x + w * (k + (k - .5) * .2))} ${n1(top - w * .2)} ${n1(cx)} ${n1(top - w * .35)}" fill="none" ${ink(1, C.gold2)}/>`).join('');
    else if (roof === 'flat') for (let k = x + 2; k < x + w - 5; k += 9) b += `<rect x="${n1(k)}" y="${n1(top - 7)}" width="5.5" height="7" fill="${fill}" ${ink(1.4)}/>`;
    else if (roof === 'tower') {
      const tw = w * .3, th = h * .55;
      b += `<rect x="${n1(cx - tw / 2)}" y="${n1(top - th)}" width="${n1(tw)}" height="${n1(th)}" fill="${fill}" ${ink(2)}/><rect x="${n1(cx - tw * .85)}" y="${n1(top - th * .6)}" width="${n1(tw * 1.7)}" height="5" fill="${C.cream}" ${ink(1.4)}/>` +
        `<path d="M${n1(cx - tw * .6)} ${n1(top - th)} Q${n1(cx - tw * .7)} ${n1(top - th - tw * .8)} ${n1(cx)} ${n1(top - th - tw * 1.3)} Q${n1(cx + tw * .7)} ${n1(top - th - tw * .8)} ${n1(cx + tw * .6)} ${n1(top - th)}Z" fill="${C.gold}" ${ink(1.8)}/>`;
    }
    const cols = Math.max(1, Math.floor(w / 22)), rows = Math.max(1, Math.floor(h / 30));
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
      if (r() < .2) continue;
      const wx = x + (i + .5) * w / cols, wy = top + 14 + j * (h - 18) / rows, ww = 7 + r() * 3, wh = 12 + r() * 4;
      b += `<path d="M${n1(wx - ww / 2)} ${n1(wy + wh)} V${n1(wy + ww * .5)} Q${n1(wx - ww / 2)} ${n1(wy)} ${n1(wx)} ${n1(wy - 3)} Q${n1(wx + ww / 2)} ${n1(wy)} ${n1(wx + ww / 2)} ${n1(wy + ww * .5)} V${n1(wy + wh)}Z" fill="${r() < lit ? C.lit : C.indigo}" ${ink(1.2)}/>`;
    }
    if (h > 70 && r() < .6) b += `<path d="M${n1(cx - 7)} ${ground} V${n1(ground - 15)} Q${n1(cx)} ${n1(ground - 23)} ${n1(cx + 7)} ${n1(ground - 15)} V${ground}Z" fill="${pick([C.plum, C.red, C.blue])}" ${ink(1.4)}/>`;
    return { b, top, cx };
  };
  const back = [], front = [];
  for (let x = WIN.x0 - 6; x < WIN.x1;) { const w = 40 + r() * 46; back.push(building(x, w, 120 + r() * 120, pick(['#a9b6e2', '#b8c0ea', '#9fafde', '#c2c4ec']), pick(['onion', 'dome', 'flat', 'tower', 'dome']), .55)); x += w - 4 + r() * 6; }
  for (let x = WIN.x0 - 10; x < WIN.x1;) { const w = 50 + r() * 60; front.push(building(x, w, 50 + r() * 80, pick(['#f2e3c6', '#e9d6f0', '#d9e4f5', '#f6d9c4', '#fff1d6']), pick(['dome', 'flat', 'onion', 'flat', 'tower']), .45)); x += w - 6 + r() * 8; }
  s += `<g clip-path="url(#win)">${back.map(o => o.b).join('')}`;
  for (let i = 0; i + 1 < back.length; i += 2) {                       // strings of lanterns from roof to roof
    const a = back[i], b = back[i + 1], sag = 16 + r() * 10;
    s += `<path d="M${n1(a.cx)} ${n1(a.top + 6)} Q${n1((a.cx + b.cx) / 2)} ${n1((a.top + b.top) / 2 + sag * 2)} ${n1(b.cx)} ${n1(b.top + 6)}" fill="none" ${ink(1.2)}/>`;
    for (let k = 1; k < 5; k++) { const t = k / 5, x = a.cx + (b.cx - a.cx) * t, y = a.top + 6 + (b.top - a.top) * t + sag * 4 * t * (1 - t); s += `<circle cx="${n1(x)}" cy="${n1(y + 3)}" r="3.2" fill="${pick([C.lit, C.coral, C.pink, C.butter])}" ${ink(1)}/>`; }
  }
  s += `${front.map(o => o.b).join('')}</g><path d="${winPath}" fill="none" ${ink(4)}/>`;
  s += `<path d="${winPath}" fill="none" stroke="${C.gold}" stroke-width="5" transform="translate(${n1((WIN.x0 + WIN.x1) / 2)} ${WIN.bot}) scale(1.03 1.03) translate(${n1(-(WIN.x0 + WIN.x1) / 2)} ${-WIN.bot})"/>`;
  return s;
}

/* ---- the title and the boarding pass for the ride ---- */
function title() {
  keep(64, 70, 500, 300);
  let s = '';
  s += T(72, 162, 'Thảm bay', { f: F.round, w: 400, s: 84, fill: C.rose, stroke: C.cream, sw: 10 });
  s += `<text x="72" y="162" font-family="${F.round}" font-weight="400" font-size="84" fill="none" ${ink(2.2)}>Thảm bay</text>`;
  s += T(150, 248, 'đêm trăng', { f: F.hand, w: 700, s: 92, fill: C.plum, stroke: C.cream, sw: 10 });
  s += `<text x="150" y="248" font-family="${F.hand}" font-weight="700" font-size="92" fill="none" ${ink(1.8)}>đêm trăng</text>`;
  s += T(108, 290, 'Fly with me tonight', { f: F.hand, w: 700, s: 30, fill: C.navy });
  s += g(442, 100, -16, 1, crescent(26, C.gold, 2.4)) + g(404, 80, 12, 1, sparkle(9, C.butter)) + g(470, 276, 0, 1, star5(11, C.gold));
  s += `<path d="M96 300 q60 -14 120 0 t120 0" fill="none" ${ink(2, C.rose)}/>`;
  return s;
}
function pass() {
  const x = 70, y = 326, w = 420, h = 226;
  keep(x - 8, y - 8, x + w + 8, y + h + 10);
  let s = `<g transform="${tf(x, y, -1.5)}"><rect x="0" y="0" width="${w}" height="${h}" rx="14" fill="${C.cream}" ${ink(2.6)}/>`;
  s += `<path d="M0 14 Q0 0 14 0 H${w - 14} Q${w} 0 ${w} 14 V44 H0Z" fill="${C.navy}" ${ink(2.6)}/>`;
  const head = 'VÉ BAY THẢM', hw = measure(head, `800 17px "${F.sans}"`) + head.length * 2;
  s += T(18, 29, head, { s: 17, ls: 2, fill: C.butter }) + T(18 + hw + 16, 29, 'MAGIC CARPET PASS', { w: 600, s: 11, ls: 2, fill: C.cream });
  s += g(w - 36, 22, 0, 1, crescent(11, C.gold, 1.6));
  const rows = [['Chuyến', 'đêm trăng số 1001'], ['Cất cánh', 'khi trăng vừa lên'], ['Ghế', 'ngay cạnh anh'], ['Điểm đến', 'thế giới của hai ta']];
  rows.forEach(([k, v], i) => {
    const yy = 76 + i * 33;
    s += T(18, yy, k, { w: 600, s: 14, fill: C.plum });
    s += `<path d="M104 ${yy + 5} H${w - 120}" stroke="rgba(29,37,80,.35)" stroke-width="1.4" stroke-dasharray="3 3"/>`;
    s += T(110, yy, v, { f: F.hand, w: 700, s: 22, fill: C.navy });
  });
  s += `<path d="M${w - 104} 50 V${h - 8}" stroke="${C.ink}" stroke-width="2" stroke-dasharray="5 5"/>`;
  for (let i = 0; i < 26; i++) { const bw = 1 + ((r() * 3) | 0); s += `<rect x="${w - 92 + i * 3.1}" y="${n1(62 + (i % 3))}" width="${bw}" height="58" fill="${C.ink}"/>`; }
  s += T(w - 52, 140, 'GHẾ', { s: 12, ls: 2, anchor: 'middle', fill: C.plum }) + T(w - 52, 172, '02', { f: F.round, w: 400, s: 30, anchor: 'middle', fill: C.rose });
  s += g(w - 52, 188, 0, 1, heart(10, C.rose, 1.2));
  s += g(256, 204, -12, 1, `<circle r="26" fill="none" ${ink(2.4, 'rgba(232,67,109,.85)')}/><circle r="19" fill="none" ${ink(1.6, 'rgba(232,67,109,.85)')}/>` + T(0, 5, 'ĐÃ BAY', { s: 9, ls: 1, anchor: 'middle', fill: 'rgba(232,67,109,.9)' }));
  return s + '</g>';
}
function notes() {
  keep(70, 572, 486, 668);
  let s = g(130, 620, -4, 1, `<rect x="-62" y="-40" width="124" height="80" rx="4" fill="${C.butter}" ${ink(2)}/><rect x="-26" y="-48" width="52" height="16" rx="3" fill="rgba(232,67,109,.6)"/>` +
    T(0, -10, 'Hành lý:', { f: F.note, w: 400, s: 19, anchor: 'middle' }) + T(0, 16, 'một trái tim', { f: F.note, w: 400, s: 19, anchor: 'middle' }) + g(46, 26, 0, 1, heart(10, C.rose, 1.2)));
  s += g(278, 624, 3, 1, `<rect x="-70" y="-40" width="140" height="80" rx="4" fill="${C.blush}" ${ink(2)}/><rect x="-24" y="-48" width="48" height="16" rx="3" fill="rgba(107,143,216,.65)"/>` +
    T(0, -10, 'Nhớ nắm tay', { f: F.note, w: 400, s: 19, anchor: 'middle' }) + T(0, 16, 'thật chặt nhé!', { f: F.note, w: 400, s: 19, anchor: 'middle' }));
  s += g(430, 622, -6, 1, lantern(26, C.coral)) + g(472, 600, 8, 1, lantern(18, C.gold));
  return s;
}

/* ---- the square at the foot of the window, where the act stands: setts and a star of blue and gold ---- */
function square() {
  let s = `<rect x="56" y="556" width="1168" height="192" rx="10" fill="#efe2c8"/>`;
  for (let i = 0; i < 1500; i++) {
    const x = 60 + r() * 1160, y = 560 + r() * 186, w = 9 + r() * 12, h = 6 + r() * 7;
    if (blocked(x, y, 3) || Math.hypot((x - 760) / 112, (y - 660) / 76) < 1) continue;
    s += `<rect x="${n1(x - w / 2)}" y="${n1(y - h / 2)}" width="${n1(w)}" height="${n1(h)}" rx="2.5" fill="${pick([C.sand, C.stone, '#f6ead2', '#e8d6b4', C.cream])}" ${ink(1.1, '#9a8566')} transform="rotate(${n1(r() * 24 - 12)} ${n1(x)} ${n1(y)})"/>`;
  }
  const cx = 760, cy = 660;
  for (const [rr, col] of [[104, C.blue], [86, C.cream], [68, C.sky], [44, C.gold], [24, C.cream]]) {
    let d = ''; for (let i = 0; i < 16; i++) { const [x, y] = pt(cx, cy, i % 2 ? rr * .72 : rr, -90 + i * 22.5); d += `${i ? 'L' : 'M'}${x} ${n1(cy + (y - cy) * .7)}`; }
    s += `<path d="${d}Z" fill="${col}" ${ink(2)}/>`;
  }
  s += g(cx, cy + 2, 0, 1, heart(26, C.rose, 1.8));
  const post = x => g(x, 744, 0, 1, `<path d="M0 0 V-74" ${ink(4)}/><rect x="-8" y="-4" width="16" height="6" rx="2" fill="${C.ink}"/>` + g(0, -84, 0, 1, lantern(16, C.lit)));
  s += post(592) + post(1172);
  s += g(980, 712, 0, 1, `<ellipse cx="0" cy="8" rx="34" ry="9" fill="${C.sky}" ${ink(2)}/><rect x="-26" y="-14" width="52" height="22" rx="4" fill="${C.cream}" ${ink(2)}/>` +
    `<path d="M-20 -14 Q-10 -40 0 -46 Q10 -40 20 -14" fill="none" ${ink(2, C.blue)}/><circle cx="0" cy="-48" r="4" fill="${C.sky}" ${ink(1.4)}/>` + [-14, 0, 14].map(x => `<path d="M${x} -10 V4" ${ink(1.2, C.blue)}/>`).join(''));   // a little fountain
  const sq = 'QUẢNG TRƯỜNG ĐÊM', sw = measure(sq, `800 12px "${F.sans}"`) + sq.length * 2.4 + 34;
  s += g(380, 724, 0, 1, `<rect x="${n1(-sw / 2)}" y="-14" width="${n1(sw)}" height="28" rx="6" fill="${C.plum}" ${ink(2)}/>` + T(0, 6, sq, { s: 12, ls: 2.4, anchor: 'middle', fill: C.butter }));
  return s;
}
function instruction() {
  const str = 'Đặt thiệp nằm phẳng, hướng điện thoại vào đây', w = measure(str, `700 21px "${F.sans}"`) + 70, x = 760, y = 572;
  keep(x - w / 2 - 6, y - 22, x + w / 2 + 6, y + 22);
  return g(x, y, 0, 1, `<path d="M${n1(-w / 2 - 16)} -18 H${n1(w / 2 + 16)} L${n1(w / 2 + 4)} 0 L${n1(w / 2 + 16)} 18 H${n1(-w / 2 - 16)} L${n1(-w / 2 - 4)} 0Z" fill="${C.navy}" ${ink(2.4)}/>` +
    T(0, 7, str, { w: 700, s: 21, anchor: 'middle', fill: C.cream }));
}

/* ---- little things everywhere else on the paper ---- */
function scatter() {
  let s = '';
  const placed = [];
  for (let i = 0; i < 4000 && placed.length < 120; i++) {
    const x = 64 + r() * 1152, y = 64 + r() * 680;
    if (blocked(x, y, 12) || placed.some(([px, py]) => Math.hypot(px - x, py - y) < 26)) continue;
    if (y > 552) continue;                                            // the square has its own setts
    placed.push([x, y]);
    const k = r(), a = (r() * 60 - 30) | 0;
    if (k < .22) s += g(x, y, a, 1, star5(5 + r() * 5, pick([C.gold, C.butter, C.lilac])));
    else if (k < .4) s += g(x, y, a, 1, sparkle(5 + r() * 5, pick([C.butter, C.pale, C.pink, C.cream])));
    else if (k < .55) s += g(x, y, a, 1, heart(9 + r() * 8, pick([C.rose, C.pink, C.coral])));
    else if (k < .67) s += g(x, y, a, 1, crescent(6 + r() * 4, pick([C.butter, C.gold])));
    else if (k < .78) s += g(x, y, a, 1, diamond(5 + r() * 4, pick([C.sky, C.rose, C.plum2])));
    else if (k < .88) s += g(x, y, a / 3, 1, lantern(9 + r() * 5, pick([C.coral, C.lit, C.pink, C.lilac])));
    else s += `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(2.4 + r() * 3)}" fill="${pick([C.rose, C.blue, C.gold, C.plum2])}"/>`;
  }
  return s;
}

const FACES = [`700 92px "${F.hand}"`, `400 84px "${F.round}"`, `400 19px "${F.note}"`, `600 14px "${F.sans}"`, `800 14px "${F.sans}"`];
Promise.all(FACES.map(f => document.fonts.load(f, 'Thảm bay đêm trăng ĐẶT Hành lý ữ Ơ ’'))).then(() => {
  const order = [title(), pass(), notes(), instruction()];        // these claim their room first
  let out = sheet() + windowFrame() + `<g clip-path="url(#win)">${sky()}</g>` + skyline() + square();
  out += order.join('') + scatter();
  document.getElementById('card').innerHTML = out;
  return document.fonts.ready;
}).then(() => { window.__ready = true; });
</script>
