<!doctype html>
<html><head><meta charset="utf-8"><title>Chung ô ngày mưa: the print</title>
<link rel="stylesheet" href="/node_modules/@fontsource/pacifico/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/dancing-script/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/600.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/800.css">
<link rel="stylesheet" href="/node_modules/@fontsource/playfair-display/400-italic.css">
<link rel="stylesheet" href="/node_modules/@fontsource/patrick-hand/400.css">
<style>
/* The printed card = the tracking image. A rainy country postcard: a cream sheet on a rain-blue band; the title in script
   with "under one umbrella"; a fogged window with an umbrella-and-heart doodle drawn in the mist; the bus stop's round sign
   and its timetable (Tuyến 14 · Trạm Hẹn) under a rainbow corner; a bus ticket stub; the weather forecast; rubber boots in a
   puddle with a paper boat; a hydrangea bush; a little mint bus splashing by; the wet stone pavement where the act stands
   (x 404–876, y 368–664) with the instruction ribbon under it; raindrops of every size scattered between them.
   Every shape is inked in deep slate so the tracker finds edges everywhere. Nothing mirrored or tiled; all randomness is
   seeded, so every render is the same picture. */
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#3b5578}
svg{display:block}
</style></head><body>
<svg id="card" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const rng = s => () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; const r = rng(1406);
const C = { band: '#3b5578', ink: '#25324d', slate: '#4f6a8f', cream: '#fff8ee', paper: '#fdf3e6', mist: '#e3edf6', rain: '#a9cdf2',
  sky: '#7fb6ea', deep: '#2f4766', red: '#e5444f', coral: '#f0727e', blush: '#fbd3d8', pink: '#f3a5c3', yellow: '#f6c13a', butter: '#ffe6a3',
  lav: '#9b7fe6', lilac: '#cbb8ff', blue: '#6f97e8', hydra: '#9fbcf5', mint: '#9fd8c8', bus: '#58bfb1', teal: '#3d9c90', leaf: '#5fae6a',
  moss: '#2f6b4a', stone: '#d7dde4', stone2: '#c3ccd6', wood: '#9a6b45', white: '#ffffff', orange: '#ffa04a', green: '#7fd67a', violet: '#b77af0' };
const F = { title: 'Pacifico', hand: 'Dancing Script', sans: 'Be Vietnam Pro', serif: 'Playfair Display', note: 'Patrick Hand' };
const n1 = v => Math.round(v * 10) / 10;
const pick = a => a[(r() * a.length) | 0];
const rad = d => d * Math.PI / 180;
const pt = (cx, cy, rr, deg) => [n1(cx + Math.cos(rad(deg)) * rr), n1(cy + Math.sin(rad(deg)) * rr)];
const tf = (x, y, a = 0, s = 1) => `translate(${n1(x)} ${n1(y)})${a ? ` rotate(${n1(a)})` : ''}${s !== 1 ? ` scale(${s})` : ''}`;
const g = (x, y, a, s, inner) => `<g transform="${tf(x, y, a, s)}">${inner}</g>`;
const ink = (sw = 2, c = C.ink) => `stroke="${c}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"`;
const T = (x, y, str, o = {}) => `<text x="${n1(x)}" y="${n1(y)}" font-family="${o.f || F.sans}" font-weight="${o.w || 800}" font-size="${o.s || 14}"` +
  `${o.style ? ` font-style="${o.style}"` : ''}${o.ls ? ` letter-spacing="${o.ls}"` : ''}${o.anchor ? ` text-anchor="${o.anchor}"` : ''} fill="${o.fill || C.ink}"` +
  `${o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 4}" paint-order="stroke" stroke-linejoin="round"` : ''}>${str}</text>`;

const measure = (str, font) => { const c = measure.c || (measure.c = document.createElement('canvas').getContext('2d')); c.font = font; return c.measureText(str).width; };

/* what the scatter keeps clear of */
const BOX = [];
const keep = (x0, y0, x1, y1) => BOX.push([x0, y0, x1, y1]);
const blocked = (x, y, m = 0) => BOX.some(([a, b, c, d]) => x > a - m && x < c + m && y > b - m && y < d + m);

/* small shapes */
const heart = (z, fill, sw = 1.8, c = C.ink) => `<path d="M0 ${n1(z * .38)} C${n1(-z * .95)} ${n1(-z * .18)} ${n1(-z * .48)} ${n1(-z * .9)} 0 ${n1(-z * .42)} C${n1(z * .48)} ${n1(-z * .9)} ${n1(z * .95)} ${n1(-z * .18)} 0 ${n1(z * .38)}Z" fill="${fill}" ${ink(sw, c)}/>`;
/** a raindrop z tall, its tip up, with a shine */
const drop = (z, fill, sw = 1.6, c = C.ink) => `<path d="M0 ${n1(-z * .5)} C${n1(z * .1)} ${n1(-z * .2)} ${n1(z * .36)} ${n1(z * .02)} ${n1(z * .34)} ${n1(z * .2)} A${n1(z * .34)} ${n1(z * .32)} 0 0 1 ${n1(-z * .34)} ${n1(z * .2)} C${n1(-z * .36)} ${n1(z * .02)} ${n1(-z * .1)} ${n1(-z * .2)} 0 ${n1(-z * .5)}Z" fill="${fill}" ${ink(sw, c)}/>` +
  (z > 12 ? `<path d="M${n1(-z * .16)} ${n1(z * .08)} q${n1(-z * .04)} ${n1(z * .14)} ${n1(z * .08)} ${n1(z * .22)}" fill="none" stroke="${C.white}" stroke-width="${n1(Math.max(1.2, z * .07))}" stroke-linecap="round"/>` : '');
const twinkle = (z, fill, sw = 1.4, c = C.ink) => `<path d="M0 ${n1(-z)} Q${n1(z * .14)} ${n1(-z * .14)} ${n1(z)} 0 Q${n1(z * .14)} ${n1(z * .14)} 0 ${n1(z)} Q${n1(-z * .14)} ${n1(z * .14)} ${n1(-z)} 0 Q${n1(-z * .14)} ${n1(-z * .14)} 0 ${n1(-z)}Z" fill="${fill}" ${ink(sw, c)}/>`;
/** an open umbrella z wide seen from the side: panels, a hem of scallops, a J handle */
function umbrella(z, fill, alt, sw = 1.8) {
  const w = z / 2, h = z * .42, n = 4 + (z > 40 ? 2 : 0);
  let d = `M${n1(-w)} 0 Q${n1(-w * .92)} ${n1(-h * 1.05)} 0 ${n1(-h)} Q${n1(w * .92)} ${n1(-h * 1.05)} ${n1(w)} 0`;
  for (let i = n; i > 0; i--) { const x0 = -w + (i / n) * 2 * w, x1 = -w + ((i - 1) / n) * 2 * w; d += ` Q${n1((x0 + x1) / 2)} ${n1(-h * .2)} ${n1(x1)} 0`; }
  let s = `<path d="${d}Z" fill="${fill}" ${ink(sw)}/>`;
  for (let i = 1; i < n; i++) { const x = -w + (i / n) * 2 * w; s += `<path d="M0 ${n1(-h)} Q${n1(x * .55)} ${n1(-h * .62)} ${n1(x)} 0" fill="none" ${ink(sw * .7)}/>`; }
  if (alt) for (let i = 0; i < n; i += 2) { const x0 = -w + (i / n) * 2 * w, x1 = -w + ((i + 1) / n) * 2 * w; s += `<path d="M0 ${n1(-h)} Q${n1(x0 * .55)} ${n1(-h * .62)} ${n1(x0)} 0 Q${n1((x0 + x1) / 2)} ${n1(-h * .2)} ${n1(x1)} 0 Q${n1(x1 * .55)} ${n1(-h * .62)} 0 ${n1(-h)}Z" fill="${alt}" ${ink(sw * .7)}/>`; }
  s += `<path d="M0 ${n1(-h - z * .08)} L0 ${n1(z * .42)} q0 ${n1(z * .12)} ${n1(-z * .1)} ${n1(z * .1)}" fill="none" ${ink(sw * 1.2)}/>`;
  return s;
}
/** a cloud about z wide, its own bumps */
function cloud(z, fill, sw = 2) {
  let d = `M${n1(-z * .5)} ${n1(z * .12)}`;
  [[-.36, -.08, .17], [-.12, -.2, .22], [.14, -.14, .19], [.36, 0, .14]].forEach(([dx, dy, rr]) => { d += ` A${n1(rr * z)} ${n1(rr * z)} 0 0 1 ${n1((dx + rr * .8) * z)} ${n1((dy + rr * .6) * z)}`; });
  return `<path d="${d} L${n1(z * .52)} ${n1(z * .14)} Q${n1(z * .5)} ${n1(z * .2)} ${n1(z * .42)} ${n1(z * .2)} L${n1(-z * .44)} ${n1(z * .2)} Q${n1(-z * .54)} ${n1(z * .2)} ${n1(-z * .5)} ${n1(z * .12)}Z" fill="${fill}" ${ink(sw)}/>`;
}
/** a hydrangea head: a mound of four-petal florets */
function hydrangea(z, tints) {
  let s = `<circle r="${n1(z)}" fill="${tints[1]}" ${ink(2)}/>`;
  const n = Math.round(z * .9);
  for (let i = 0; i < n; i++) {
    const a = r() * 360, rr = Math.sqrt(r()) * z * .82, [x, y] = pt(0, 0, rr, a), f = z * (.16 + r() * .06), col = pick([tints[0], tints[2], tints[0]]);
    let p = '';
    for (let q = 0; q < 4; q++) { const [px, py] = pt(0, 0, f * .55, q * 90 + a); p += `<ellipse cx="${px}" cy="${py}" rx="${n1(f * .55)}" ry="${n1(f * .36)}" transform="rotate(${n1(q * 90 + a)} ${px} ${py})" fill="${col}" ${ink(.9)}/>`; }
    s += g(x, y, 0, 1, p + `<circle r="${n1(f * .16)}" fill="${C.butter}"/>`);
  }
  return s;
}

/* ── the sheet: a rain-blue band with drops and running words, a scalloped cream sheet on it ── */
function sheet() {
  let s = `<rect width="1280" height="800" fill="${C.band}"/>`;
  const words = [
    [640, 21, 0, 'CHUNG Ô NGÀY MƯA  ·  UNDER ONE UMBRELLA  ·  MƯA THÌ MÌNH CHUNG Ô  ·  TRẠM HẸN', 620],
    [640, 790, 0, 'ĐẶT THIỆP NẰM PHẲNG  ·  LAY THE CARD FLAT  ·  KEEP IT IN VIEW  ·  TUYẾN 14  ·  RAINY DAY POST', 700],
    [19, 400, -90, 'MƯA RỒI SẼ TẠNH  ·  AFTER THE RAIN', 300],
    [1262, 390, 90, 'CÓ EM LÀ NẮNG  ·  SUNSHINE', 250]];
  const inWords = (x, y) => words.some(([wx, wy, a, , w]) => a ? Math.abs(x - wx) < 15 && Math.abs(y - wy) < w / 2 + 12 : Math.abs(y - wy + 4) < 15 && Math.abs(x - wx) < w / 2 + 12);
  for (let i = 0; i < 1300; i++) {
    const x = r() * 1280, y = r() * 800;
    if (x > 30 && x < 1250 && y > 30 && y < 770) continue;
    if (inWords(x, y)) continue;
    const z = 3 + r() * 7;
    s += r() < .45 ? g(x, y, (r() - .5) * 30, 1, drop(z, pick([C.rain, C.mist, C.white, C.sky]), .8, C.deep)) : `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(1 + r() * 2.6)}" fill="${pick([C.cream, C.rain, C.lilac, C.butter, C.mint])}"/>`;
  }
  words.forEach(([x, y, a, str]) => { s += g(x, y, a, 1, T(0, a ? 4 : 0, str, { s: 11.5, ls: 3, anchor: 'middle', fill: C.cream })); });
  const L = 30, Tp = 30, R = 1250, B = 770;
  let d = `M${L} ${Tp}`;
  const edge = (from, to, fixed, horizontal, out) => {             // scallops along one edge, each its own width
    for (let p = from; Math.abs(to - p) > 1;) {
      const step = Math.sign(to - p) * Math.min(Math.abs(to - p), 15 + r() * 10), q = p + step, m = (p + q) / 2, b = (6 + r() * 4) * out;
      d += horizontal ? ` Q${n1(m)} ${n1(fixed + b)} ${n1(q)} ${n1(fixed)}` : ` Q${n1(fixed + b)} ${n1(m)} ${n1(fixed)} ${n1(q)}`;
      p = q;
    }
  };
  edge(L, R, Tp, true, -1); edge(Tp, B, R, false, 1); edge(R, L, B, true, 1); edge(B, Tp, L, false, -1);
  s += `<path d="${d}Z" fill="${C.cream}" ${ink(2.4)}/>`;
  s += `<rect x="44" y="44" width="1192" height="712" rx="10" fill="none" stroke="${C.slate}" stroke-width="1.4" stroke-dasharray="9 5 2 5"/>`;
  return s;
}

/* ── the title: "Chung ô" in Pacifico, "ngày mưa" in script, under one umbrella ── */
function title() {
  keep(56, 50, 548, 288);
  const w1 = measure('Chung ô', `400 84px "${F.title}"`), w2 = measure('ngày mưa', `700 82px "${F.hand}"`), x2 = Math.min(150, 540 - w2);
  let s = T(80, 132, 'Chung ô', { f: F.title, w: 400, s: 84, fill: C.ink }) + T(74, 126, 'Chung ô', { f: F.title, w: 400, s: 84, fill: C.red, stroke: C.ink, sw: 5 });
  s += T(x2 + 4, 210, 'ngày mưa', { f: F.hand, w: 700, s: 82, fill: C.ink }) + T(x2, 206, 'ngày mưa', { f: F.hand, w: 700, s: 82, fill: C.blue, stroke: C.ink, sw: 4 });
  s += T(86, 246, 'under one umbrella', { f: F.serif, w: 400, style: 'italic', s: 22, fill: C.slate });
  const wu = measure('under one umbrella', `italic 400 22px "${F.serif}"`);
  s += `<path d="M86 256 C${n1(86 + wu * .3)} 266 ${n1(86 + wu * .7)} 250 ${n1(86 + wu)} 258" fill="none" ${ink(2.2, C.coral)}/>`;
  s += `<rect x="${n1(102 + wu)}" y="${232}" width="214" height="26" rx="13" fill="${C.ink}"/>` + T(n1(209 + wu), 249.5, 'TUYẾN 14 · TRẠM HẸN', { s: 11, ls: 2.2, anchor: 'middle', fill: C.cream });
  s += g(80 + w1 + 46, 78, 12, 1, umbrella(56, C.yellow, C.butter, 2)) + g(80 + w1 + 98, 104, -16, 1, drop(17, C.rain)) + g(80 + w1 + 112, 62, 8, 1, drop(12, C.mist));
  s += g(64, 168, -10, 1, heart(16, C.coral)) + g(x2 - 22, 196, 0, 1, twinkle(8, C.butter)) + g(60, 82, 0, 1, drop(14, C.sky));
  return s;
}

/* ── a fogged window: rain running down the glass, an umbrella with a heart drawn in the mist, "anh" and "em" ── */
function windowPane() {
  const x0 = 568, y0 = 58, w = 236, h = 196;
  keep(x0 - 16, y0 - 14, x0 + w + 16, y0 + h + 26);
  let s = `<g transform="${tf(x0 + w / 2, y0 + h / 2, 2)}">`;
  s += `<rect x="${-w / 2 - 12}" y="${-h / 2 - 12}" width="${w + 24}" height="${h + 24}" rx="8" fill="${C.wood}" ${ink(2.4)}/>`;
  s += `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" fill="${C.slate}" ${ink(2)}/>`;
  s += `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" fill="${C.mist}" opacity=".38"/>`;
  for (let i = 0; i < 26; i++) {                                     // drops running down, each leaving a clear trail
    const x = -w / 2 + 10 + r() * (w - 20), y = -h / 2 + 8 + r() * (h - 40), l = 14 + r() * 40;
    if (Math.abs(x) < 70 && y + l > 20 && y + l < 64) continue;            // not under the words
    s += `<path d="M${n1(x)} ${n1(y)} q${n1((r() - .5) * 6)} ${n1(l / 2)} ${n1((r() - .5) * 4)} ${n1(l)}" fill="none" stroke="${C.slate}" stroke-width="${n1(2 + r() * 2.4)}" stroke-linecap="round" opacity=".55"/>`;
    s += `<circle cx="${n1(x)}" cy="${n1(y + l)}" r="${n1(2 + r() * 2.2)}" fill="${C.white}" ${ink(1, C.deep)}/>`;
  }
  const doodle = `<path d="M-62 -6 Q-56 -62 0 -66 Q56 -62 62 -6 Q46 -16 31 -6 Q16 -16 0 -6 Q-16 -16 -31 -6 Q-46 -16 -62 -6Z" fill="none" stroke="${C.white}" stroke-width="4.5" stroke-linejoin="round"/>` +
    `<path d="M0 -66 L0 66" stroke="${C.white}" stroke-width="4.5" stroke-linecap="round"/>` +
    g(0, -84, 0, 1, heart(26, 'none', 4.5, C.white)) + g(0, -84, 0, 1, heart(15, C.coral, 1.6, C.ink));
  s += g(0, 6, .8, 1, doodle);
  s += T(-34, 44, 'anh', { f: F.hand, w: 700, s: 32, anchor: 'middle', fill: C.white, stroke: C.deep, sw: 4 });
  s += T(36, 44, 'em', { f: F.hand, w: 700, s: 32, anchor: 'middle', fill: C.white, stroke: C.deep, sw: 4 });
  s += `<path d="M0 ${-h / 2} V${h / 2} M${-w / 2} 20 H${w / 2}" stroke="${C.wood}" stroke-width="7"/><path d="M0 ${-h / 2} V${h / 2} M${-w / 2} 20 H${w / 2}" fill="none" ${ink(1.4)}/>`;
  s += `<rect x="${-w / 2 - 20}" y="${h / 2 + 10}" width="${w + 40}" height="14" rx="4" fill="${C.wood}" ${ink(2)}/>`;
  s += g(-w / 2 + 24, h / 2 + 3, 0, 1, `<path d="M-14 6 L14 6 L10 -10 L-10 -10Z" fill="${C.coral}" ${ink(1.6)}/>` + `<circle cy="-18" r="9" fill="${C.leaf}" ${ink(1.4)}/><circle cx="-8" cy="-14" r="6" fill="${C.leaf}" ${ink(1.2)}/>`);
  s += T(w / 2 - 6, h / 2 + 2, 'cửa sổ mờ hơi mưa', { f: F.note, w: 400, s: 15, anchor: 'end', fill: C.ink });
  return s + '</g>';
}

/* ── the bus stop: a rainbow out of a cloud in the corner, the round sign on its post, the timetable board ── */
function busStop() {
  keep(836, 40, 1240, 330);
  let s = '';
  const cx = 1236, cy = 342, cols = [C.red, C.orange, C.yellow, C.green, C.sky, C.blue, C.violet];   // the rainbow corner
  cols.forEach((c, i) => { const rr = 268 - i * 15; s += `<path d="M${cx - rr} ${cy} A${rr} ${rr} 0 0 1 ${cx} ${cy - rr}" fill="none" stroke="${c}" stroke-width="15"/>`; });
  s += `<path d="M${cx - 276} ${cy} A276 276 0 0 1 ${cx} ${cy - 276}" fill="none" ${ink(2)}/><path d="M${cx - 166} ${cy} A166 166 0 0 1 ${cx} ${cy - 166}" fill="none" ${ink(2)}/>`;
  s += g(1012, 318, -4, 1, cloud(150, C.white, 2.4)) + g(1190, 70, 6, 1, cloud(84, C.white, 2.2));
  const px = 896;                                                    // the post and the round sign
  s += `<rect x="${px - 6}" y="96" width="12" height="226" fill="${C.wood}" ${ink(2)}/>`;
  for (let y = 120; y < 316; y += 22) s += `<path d="M${px - 5} ${y} l10 4" ${ink(1, C.ink)}/>`;
  s += `<rect x="${px - 22}" y="312" width="44" height="16" rx="3" fill="${C.stone2}" ${ink(2)}/>`;
  s += `<circle cx="${px}" cy="96" r="54" fill="${C.red}" ${ink(2.6)}/><circle cx="${px}" cy="96" r="42" fill="${C.cream}" ${ink(1.8)}/>`;
  s += g(px, 96, 0, 1, `<rect x="-24" y="-12" width="48" height="22" rx="6" fill="${C.teal}" ${ink(1.6)}/>` +
    [-17, -6, 5].map(x => `<rect x="${x}" y="-8" width="9" height="8" rx="2" fill="${C.mist}" ${ink(1)}/>`).join('') +
    `<circle cx="-13" cy="11" r="5" fill="${C.ink}"/><circle cx="13" cy="11" r="5" fill="${C.ink}"/><circle cx="-22" cy="4" r="2.6" fill="${C.butter}"/>`);
  s += `<path id="signArc" d="M${px - 34} 96 A34 34 0 0 1 ${px + 34} 96" fill="none"/>`;
  s += `<text font-family="${F.sans}" font-weight="800" font-size="11" letter-spacing="2" fill="${C.ink}"><textPath href="#signArc" startOffset="50%" text-anchor="middle">TRẠM HẸN</textPath></text>`;
  s += T(px, 136, '14', { s: 15, anchor: 'middle' });
  const bx = 944, by = 112;                                          // the timetable
  s += `<g transform="${tf(bx, by, 3)}"><rect x="0" y="0" width="168" height="196" rx="8" fill="${C.white}" ${ink(2.4)}/>`;
  s += `<path d="M0 8 Q0 0 8 0 L160 0 Q168 0 168 8 L168 34 L0 34Z" fill="${C.teal}" ${ink(2)}/>`;
  s += T(84, 23, 'TUYẾN 14 · TRẠM HẸN', { s: 12, ls: 1.2, anchor: 'middle', fill: C.cream });
  s += T(12, 52, 'GIỜ XE CHẠY · TIMETABLE', { s: 8.5, ls: 1.4, fill: C.slate });
  [['06:15', '07:40'], ['09:05', '10:30'], ['13:20', '15:45'], ['17:20', '18:40']].forEach(([a, b], i) => {
    const y = 76 + i * 25;
    s += T(16, y, a, { f: F.note, w: 400, s: 19 }) + T(92, y, b, { f: F.note, w: 400, s: 19 });
    s += `<line x1="12" y1="${y + 6}" x2="156" y2="${y + 6}" stroke="${C.rain}" stroke-width="1.2"/>`;
  });
  s += g(150, 145, 0, 1, heart(14, C.coral, 1.4));
  s += T(84, 184, 'chuyến này có em', { f: F.hand, w: 700, s: 19, anchor: 'middle', fill: C.red });
  return s + '</g>';
}

/* ── a bus ticket stub: perforated, a barcode, the route ── */
function ticket() {
  const x = 62, y = 296, w = 300, h = 150;
  keep(x - 8, y - 12, x + w + 16, y + h + 14);
  let s = `<g transform="${tf(x, y, -3)}">`;
  s += `<path d="M0 12 Q0 0 12 0 L${w - 12} 0 Q${w} 0 ${w} 12 L${w} ${h / 2 - 11} A11 11 0 0 0 ${w} ${h / 2 + 11} L${w} ${h - 12} Q${w} ${h} ${w - 12} ${h} L12 ${h} Q0 ${h} 0 ${h - 12} L0 ${h / 2 + 11} A11 11 0 0 0 0 ${h / 2 - 11}Z" fill="${C.butter}" ${ink(2.4)}/>`;
  s += `<line x1="${w - 76}" y1="10" x2="${w - 76}" y2="${h - 10}" stroke="${C.ink}" stroke-width="1.6" stroke-dasharray="4 5"/>`;
  s += T(16, 28, 'VÉ XE BUÝT', { s: 18, ls: 1.4 }) + T(16, 45, 'BUS TICKET · TUYẾN 14', { s: 10, ls: 1.6, fill: C.red });
  [['Từ', 'Trạm Hẹn'], ['Đến', 'nhà em'], ['Ghế', 'chung một ô'], ['Giá vé', 'một nụ cười']].forEach(([k, v], i) => {
    s += T(16, 70 + i * 21, k, { s: 10.5, w: 600, fill: C.slate }) + T(72, 70 + i * 21, v, { f: F.hand, w: 700, s: 17, fill: C.deep });
    s += `<line x1="72" y1="${74 + i * 21}" x2="${w - 90}" y2="${74 + i * 21}" stroke="${C.ink}" stroke-width=".8" opacity=".4"/>`;
  });
  for (let bx = w - 64; bx < w - 14;) { const bw = 1 + (r() * 3.6 | 0); s += `<rect x="${n1(bx)}" y="16" width="${bw}" height="84" fill="${C.ink}"/>`; bx += bw + 1 + r() * 2.6; }

  s += g(w - 112, 30, -12, 1, umbrella(30, C.red, null, 1.4));

}

/* ── the weather forecast: rain this morning, sun this afternoon (because of you) ── */

  s += T(14, 22, 'DỰ BÁO THỜI TIẾT', { s: 12, ls: 2, fill: C.deep }) + T(w - 14, 22, 'hôm nay', { f: F.hand, w: 700, s: 17, anchor: 'end', fill: C.red });
  s += `<line x1="12" y1="30" x2="${w - 12}" y2="30" stroke="${C.rain}" stroke-width="1.4"/>`;

}

/* ── rubber boots standing in a puddle, a paper boat, a closed umbrella leaning ── */
function boots() {

  const boot = (x, y, a, fill, trim) => g(x, y, a, 1, `<path d="M-20 -78 L18 -78 L20 -12 Q42 -10 46 4 L46 12 L-22 12 L-22 -10Z" fill="${fill}" ${ink(2.4)}/>` +
    `<rect x="-24" y="-84" width="46" height="12" rx="4" fill="${trim}" ${ink(2)}/><path d="M-22 4 L46 4" ${ink(2)}/>` +
    `<path d="M-12 -60 q6 -6 12 0" fill="none" ${ink(1.6)}/><circle cx="8" cy="-40" r="5" fill="${C.cream}" ${ink(1.4)}/>`);

    `<rect x="-6" y="-46" width="12" height="6" rx="2" fill="${C.cream}" ${ink(1.2)}/>`);
  s += T(196, 748, 'đôi ủng đi mưa', { f: F.note, w: 400, s: 15, anchor: 'middle', fill: C.slate });

/* ── the hydrangea bush: blue, lilac and pink heads among leaves ── */
function hydrangeas() {
  keep(1060, 352, 1240, 584);
  let s = '';
  for (let i = 0; i < 11; i++) {
    const x = 1072 + r() * 150, y = 404 + r() * 118, a = r() * 360;

  [[1104, 420, 40, [C.hydra, C.blue, '#c9dbff']], [1184, 404, 44, [C.lilac, C.lav, '#e4d8ff']], [1140, 480, 38, [C.pink, '#e97fae', '#ffd6e6']],
    [1206, 500, 32, [C.hydra, C.blue, '#d4e4ff']], [1088, 520, 30, [C.lilac, C.lav, '#efe6ff']]].forEach(([x, y, z, t]) => { s += g(x, y, r() * 40, 1, hydrangea(z, t)); });
  s += T(1150, 578, 'cẩm tú cầu mùa mưa', { f: F.note, w: 400, s: 15, anchor: 'middle', fill: C.slate });

}

/* ── a little mint bus splashing through a puddle ── */
function bus() {
  const x = 930, y = 598;
  keep(x - 24, y - 14, x + 300, y + 152);

  s += T(80, 84, 'TRẠM HẸN', { s: 9.5, ls: 1, anchor: 'middle', fill: C.cream });
  s += `<rect x="96" y="-12" width="54" height="14" rx="3" fill="${C.ink}"/>` + T(123, -1.5, '14 · HẸN', { s: 9, ls: .8, anchor: 'middle', fill: C.butter });

/* ── the wet stone pavement the act stands on: puddles, a drain, a curb; the instruction ribbon under it ── */
function pavement() {
  const x0 = 404, x1 = 876, y0 = 368, y1 = 664;
  keep(x0 - 16, y0 - 14, x1 + 16, y1 + 60);
  const edge = `M${x0 + 20} ${y0} L${x1 - 18} ${y0 + 4} Q${x1 + 4} ${y0 + 4} ${x1 + 2} ${y0 + 26} L${x1 + 8} ${y1 - 20} Q${x1 + 10} ${y1} ${x1 - 10} ${y1 + 2} L${x0 + 8} ${y1 - 2} Q${x0 - 12} ${y1 - 4} ${x0 - 8} ${y1 - 24} L${x0} ${y0 + 22} Q${x0} ${y0 + 2} ${x0 + 20} ${y0}Z`;
  let s = `<clipPath id="paveClip"><path d="${edge}"/></clipPath>`;
  s += `<path d="${edge}" fill="${C.stone}" ${ink(2.8)}/>`;
  s += `<g clip-path="url(#paveClip)">`;
  for (let y = y0 - 6, row = 0; y < y1 + 10; row++) {              // stones in rows, each its own size and tone
    const hh = 30 + r() * 14;
    for (let x = x0 - 20 - (row % 2) * 24; x < x1 + 20;) {
      const ww = 40 + r() * 34;
      s += `<rect x="${n1(x + 2)}" y="${n1(y + 2)}" width="${n1(ww - 4)}" height="${n1(hh - 4)}" rx="${n1(5 + r() * 6)}" fill="${pick([C.stone, C.stone2, '#e3e8ee', '#cdd5de', '#e8dccb', '#d9cfe8'])}" ${ink(1.4, C.slate)}/>`;
      const k = r();
      if (k < .25) s += `<path d="M${n1(x + 8 + r() * 10)} ${n1(y + 8 + r() * 6)} l${n1(6 + r() * 8)} ${n1(2 + r() * 4)}" ${ink(1, C.slate)}/>`;
      else if (k < .33) s += `<path d="M${n1(x + 2)} ${n1(y + hh - 2)} q4 -8 8 0 q4 -9 8 0 q3 -7 6 0" fill="${C.leaf}" ${ink(1.2, C.moss)}/>`;   // moss between stones
      else if (k < .4) s += g(x + ww * .5, y + hh * .5, r() * 90, 1, [0, 90, 180, 270].map(a => { const [px, py] = pt(0, 0, 3.4, a); return `<ellipse cx="${px}" cy="${py}" rx="3.6" ry="2.4" transform="rotate(${a} ${px} ${py})" fill="${pick([C.hydra, C.lilac, C.pink])}" ${ink(.8)}/>`; }).join(''));
      else if (k < .46) s += g(x + ww * .5, y + hh * .5, 0, 1, `<path d="M-7 0 l-4 -5 M-3 -4 l-1 -6 M3 -4 l1 -6 M7 0 l4 -5" ${ink(1.3, C.blue)}/><ellipse rx="7" ry="2.4" fill="none" ${ink(1.2, C.blue)}/>`);   // a splash
      x += ww;
    }
    y += hh;
  }
  s += '</g>';
  [[640, 560, 96, 30], [520, 452, 48, 16], [790, 600, 40, 13]].forEach(([cx, cy, rx, ry], i) => {   // puddles with rings
    let d = '';
    for (let k = 0; k <= 24; k++) { const a = k / 24 * Math.PI * 2, w = 1 + .08 * Math.sin(a * 3 + i * 2); d += `${k ? 'L' : 'M'}${n1(cx + Math.cos(a) * rx * w)} ${n1(cy + Math.sin(a) * ry * w)}`; }
    s += `<path d="${d}Z" fill="${C.sky}" ${ink(2.2)}/>`;
    s += `<ellipse cx="${cx - rx * .2}" cy="${cy - ry * .25}" rx="${n1(rx * .36)}" ry="${n1(ry * .2)}" fill="${C.white}" opacity=".7"/>`;
    if (i === 0) s += `<ellipse cx="${cx + 30}" cy="${cy + 6}" rx="22" ry="7" fill="none" stroke="${C.white}" stroke-width="1.8"/><ellipse cx="${cx + 30}" cy="${cy + 6}" rx="12" ry="4" fill="none" stroke="${C.white}" stroke-width="1.4"/>`;
  });
  s += g(452, 620, 0, 1, `<rect x="-26" y="-12" width="52" height="24" rx="4" fill="${C.slate}" ${ink(2)}/>` + [-16, -6, 4, 14].map(x => `<rect x="${x}" y="-8" width="5" height="16" rx="2" fill="${C.ink}"/>`).join(''));
  s += g(640, 408, 0, 1, T(0, 0, 'chỗ hai đứa trú mưa', { f: F.hand, w: 700, s: 24, anchor: 'middle', fill: C.deep, stroke: C.cream, sw: 6 }));
  s += g(700, 520, -8, 1, heart(28, C.coral, 2));
  const ry = y1 + 32;                                                 // the instruction ribbon
  s += `<path d="M452 ${ry - 16} L828 ${ry - 16} L812 ${ry} L828 ${ry + 16} L452 ${ry + 16} L468 ${ry}Z" fill="${C.ink}" ${ink(2)}/>`;
  s += T(640, ry + 5, 'Đặt thiệp nằm phẳng, hướng điện thoại vào đây', { s: 14.5, w: 600, anchor: 'middle', fill: C.cream });
  return s;
}

/* ── a short handwritten note on a slip of paper, beside the window ── */
function slip() {
  const x = 392, y = 304;
  keep(x - 8, y - 22, x + 186, y + 66);
  let s = `<g transform="${tf(x, y, -2)}"><rect x="0" y="-14" width="178" height="74" rx="6" fill="${C.paper}" ${ink(1.8)}/>`;
  [8, 32].forEach(ly => { s += `<line x1="10" y1="${ly}" x2="168" y2="${ly}" stroke="${C.rain}" stroke-width="1.2"/>`; });
  s += T(12, 4, 'Mưa thì mình', { f: F.hand, w: 700, s: 21, fill: C.deep }) + T(12, 28, 'chung ô nhé!', { f: F.hand, w: 700, s: 21, fill: C.deep });
  s += g(150, 40, 8, 1, heart(16, C.coral, 1.4));
  s += `<rect x="136" y="-46" width="46" height="15" fill="${C.mint}" opacity=".85" transform="rotate(14)" ${ink(1.1)}/>`;
  return s + '</g>';
}

/* ── the scatter: raindrops of every size, little umbrellas, hearts, puddle rings, where nothing else is ── */
function scatter() {
  let s = '';
  for (let i = 0, placed = 0; i < 6000 && placed < 150; i++) {
    const x = 52 + r() * 1176, y = 52 + r() * 696;
    if (blocked(x, y, 14)) continue;
    keep(x - 9, y - 9, x + 9, y + 9); placed++;
    const k = r();
    s += g(x, y, k < .5 ? (r() - .5) * 24 : r() * 60 - 30, 1, k < .5 ? drop(10 + r() * 16, pick([C.rain, C.sky, C.mist, C.white]))
      : k < .62 ? umbrella(18 + r() * 12, pick([C.red, C.yellow, C.lav, C.mint, C.coral]), null, 1.3)
      : k < .76 ? heart(10 + r() * 10, pick([C.pink, C.coral, C.blush]))
      : k < .86 ? twinkle(6 + r() * 6, pick([C.butter, C.white, C.mint]))
      : k < .94 ? `<ellipse rx="${n1(8 + r() * 6)}" ry="${n1(3 + r() * 2)}" fill="none" ${ink(1.4, C.slate)}/><ellipse rx="${n1(4 + r() * 2)}" ry="1.6" fill="none" ${ink(1, C.slate)}/>`
      : `<circle r="${n1(2 + r() * 3)}" fill="${pick([C.ink, C.coral, C.blue])}"/>`);
  }
  return s;
}

const svg = document.getElementById('card');
svg.innerHTML = sheet() + title() + windowPane() + busStop() + ticket() + forecast() + slip() + pavement() + boots() + hydrangeas() + bus() + scatter();
window.__ready = true;
</script>
