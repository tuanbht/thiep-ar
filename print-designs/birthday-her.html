<!doctype html>
<html><head><meta charset="utf-8"><title>Sinh nhật nàng: the print</title>
<link rel="stylesheet" href="/node_modules/@fontsource/pacifico/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/dancing-script/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/600.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/800.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/900.css">
<link rel="stylesheet" href="/node_modules/@fontsource/patrick-hand/400.css">
<style>
/* The printed card = the tracking image. "Sinh nhật nàng": a birthday on a city rooftop at night. A plum frame with
   party bulbs and running words; on a scalloped cream sheet, the night over the city across the top (a moon, small
   fireworks, a skyline of lit windows with a neon heart and water tanks on the roofs) with string lights, bunting and
   three polaroids hanging from them; "Chúc mừng sinh nhật" in the middle on a ring of confetti; on the left a cake with
   candles on a little round table, the wish card hung from it, and a ticket to the rooftop; on the right a bunch of
   balloons (clear ones with photos inside) tied to a gift; along the bottom the rooftop itself (the stairwell's door with
   its sign, a parapet of breeze blocks, potted plants), the wish list, a stamp and postmarks, and the instruction ribbon;
   confetti, streamers, stars and hearts wherever there is paper left. Every shape is inked in plum so the tracker finds
   edges everywhere; nothing is mirrored or tiled, and all randomness is seeded, so every render is the same picture. */
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#2b1d45}
svg{display:block}
</style></head><body>
<svg id="card" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const rng = s => () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; const r = rng(2410);
const C = { night: '#2b1d45', plum: '#3b2a4a', deep: '#1c1433', violet: '#4b3a7a', violet2: '#6a5486', lilac: '#c5a3ff', cream: '#fff4ec', paper: '#fffaf3',
  blush: '#fde4ea', pink: '#f6c9d6', rose: '#ee7fa0', hot: '#e8436d', wine: '#9e1f45', gold: '#ffd27a', butter: '#ffe9b8', mint: '#8fd0bd', mint2: '#5aa39b',
  sky: '#9be7ff', peach: '#ffb08f', wood: '#e2b98c', wood2: '#c99a6b', wood3: '#a87850', leaf: '#6fbf73', leaf2: '#4f9a5c', red: '#e5484d', white: '#ffffff' };
const F = { logo: 'Pacifico', sans: 'Be Vietnam Pro', hand: 'Dancing Script', note: 'Patrick Hand' };
const n1 = v => Math.round(v * 10) / 10;
const pick = a => a[(r() * a.length) | 0];
const rad = d => d * Math.PI / 180;
const pt = (cx, cy, rr, deg) => [n1(cx + Math.cos(rad(deg)) * rr), n1(cy + Math.sin(rad(deg)) * rr)];
const tf = (x, y, a = 0, s = 1) => `translate(${n1(x)} ${n1(y)})${a ? ` rotate(${n1(a)})` : ''}${s !== 1 ? ` scale(${s})` : ''}`;
const g = (x, y, a, s, inner) => `<g transform="${tf(x, y, a, s)}">${inner}</g>`;
const ink = (sw = 2, c = C.plum) => `stroke="${c}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"`;
const T = (x, y, str, o = {}) => `<text x="${n1(x)}" y="${n1(y)}" font-family="${o.f || F.sans}" font-weight="${o.w || 800}" font-size="${o.s || 14}"` +
  `${o.ls ? ` letter-spacing="${o.ls}"` : ''}${o.anchor ? ` text-anchor="${o.anchor}"` : ''} fill="${o.fill || C.plum}"` +
  `${o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 4}" paint-order="stroke" stroke-linejoin="round"` : ''}>${str}</text>`;
const measure = (str, font) => { const c = measure.c || (measure.c = document.createElement('canvas').getContext('2d')); c.font = font; return c.measureText(str).width; };
const fit = (str, weight, family, size, w) => Math.min(size, n1(w / measure(str, `${weight} 100px "${family}"`) * 100));

/* what the scatter keeps clear of */
const BOX = [];
const keep = (x0, y0, x1, y1) => BOX.push([x0, y0, x1, y1]);
const blocked = (x, y, m = 0) => BOX.some(([a, b, c, d]) => x > a - m && x < c + m && y > b - m && y < d + m);

/* ---- small shapes ---- */
const heart = (z, fill, sw = 1.8, c = C.plum) => `<path d="M0 ${n1(z * .38)} C${n1(-z * .95)} ${n1(-z * .18)} ${n1(-z * .48)} ${n1(-z * .9)} 0 ${n1(-z * .42)} C${n1(z * .48)} ${n1(-z * .9)} ${n1(z * .95)} ${n1(-z * .18)} 0 ${n1(z * .38)}Z" fill="${fill}" ${ink(sw, c)}/>`;
const sparkle = (z, fill, sw = 1.4, c = C.plum) => `<path d="M0 ${n1(-z)} Q${n1(z * .14)} ${n1(-z * .14)} ${n1(z)} 0 Q${n1(z * .14)} ${n1(z * .14)} 0 ${n1(z)} Q${n1(-z * .14)} ${n1(z * .14)} ${n1(-z)} 0 Q${n1(-z * .14)} ${n1(-z * .14)} 0 ${n1(-z)}Z" fill="${fill}" ${ink(sw, c)}/>`;
const star5 = (z, fill, sw = 1.4, c = C.plum) => { let d = ''; for (let i = 0; i < 10; i++) { const rr = i % 2 ? z * .45 : z * (.9 + r() * .2), [x, y] = pt(0, 0, rr, -90 + i * 36); d += `${i ? 'L' : 'M'}${x} ${y}`; } return `<path d="${d}Z" fill="${fill}" ${ink(sw, c)}/>`; };
/** a strip of tape with torn ends, centred on 0 0 */
function tape(w, h, fill, sw = 1.2) {
  let d = `M${n1(-w / 2)} ${n1(-h / 2)} L${n1(w / 2)} ${n1(-h / 2)}`;
  for (let i = 1; i <= 4; i++) d += ` L${n1(w / 2 + (i % 2 ? 2.4 : 0))} ${n1(-h / 2 + h * i / 4)}`;
  d += ` L${n1(-w / 2)} ${n1(h / 2)}`;
  for (let i = 1; i <= 4; i++) d += ` L${n1(-w / 2 - (i % 2 ? 2.4 : 0))} ${n1(h / 2 - h * i / 4)}`;
  return `<path d="${d}Z" fill="${fill}" ${ink(sw)}/>`;
}
const bulb = (rr, lit = true, col = C.gold) => (lit ? `<circle r="${n1(rr * 1.9)}" fill="${C.butter}" opacity=".5"/>` : '') +
  `<circle r="${n1(rr)}" fill="${lit ? col : C.rose}" ${ink(1.2)}/><circle cx="${n1(-rr * .35)}" cy="${n1(-rr * .35)}" r="${n1(rr * .3)}" fill="#fff" opacity=".85"/>`;
/** a burst of firework: inked rays of uneven length, dots at their tips */
function burst(z, col, col2) {
  let s = '';
  const n = 12 + (r() * 5 | 0);
  for (let i = 0; i < n; i++) {
    const a = i / n * 360 + r() * 10, l = z * (.65 + r() * .35), [x0, y0] = pt(0, 0, z * .18, a), [x1, y1] = pt(0, 0, l, a);
    s += `<path d="M${x0} ${y0} L${x1} ${y1}" ${ink(2.2, i % 2 ? col : col2)}/><circle cx="${pt(0, 0, l + 4, a)[0]}" cy="${pt(0, 0, l + 4, a)[1]}" r="${n1(1.6 + r() * 1.4)}" fill="${i % 3 ? col2 : C.white}"/>`;
  }
  return s + `<circle r="${n1(z * .12)}" fill="${C.white}"/>`;
}
/** two little people in a photo: heads and shoulders, side by side */
const couple = z => `<circle cx="${n1(-z * .16)}" cy="${n1(-z * .12)}" r="${n1(z * .1)}" fill="${C.wood3}" ${ink(.9)}/><circle cx="${n1(z * .16)}" cy="${n1(-z * .12)}" r="${n1(z * .1)}" fill="${C.wine}" ${ink(.9)}/>` +
  `<path d="M${n1(-z * .32)} ${n1(z * .22)} Q${n1(-z * .16)} ${n1(-z * .04)} 0 ${n1(z * .22)} Q${n1(z * .16)} ${n1(-z * .04)} ${n1(z * .32)} ${n1(z * .22)}Z" fill="${C.cream}" ${ink(.9)}/>`;
/** a polaroid z wide, its picture `inner` on `photo` */
const polaroid = (z, photo, inner = '') => `<rect x="${n1(-z / 2)}" y="${n1(-z * .55)}" width="${n1(z)}" height="${n1(z * 1.18)}" rx="1.5" fill="${C.white}" ${ink(1.4)}/>` +
  `<rect x="${n1(-z * .4)}" y="${n1(-z * .45)}" width="${n1(z * .8)}" height="${n1(z * .76)}" fill="${photo}" ${ink(1)}/>` + inner;
/** a gift box z wide, its ribbon and bow */
function gift(z, box, ribbon) {
  const h = z * .78;
  let s = `<rect x="${n1(-z / 2)}" y="${n1(-h)}" width="${n1(z)}" height="${n1(h)}" rx="3" fill="${box}" ${ink(2)}/>`;
  s += `<rect x="${n1(-z * .56)}" y="${n1(-h - z * .16)}" width="${n1(z * 1.12)}" height="${n1(z * .2)}" rx="3" fill="${box}" ${ink(2)}/>`;
  s += `<rect x="${n1(-z * .08)}" y="${n1(-h - z * .16)}" width="${n1(z * .16)}" height="${n1(h + z * .16)}" fill="${ribbon}" ${ink(1.4)}/>`;
  s += `<path d="M0 ${n1(-h - z * .16)} C${n1(-z * .4)} ${n1(-h - z * .5)} ${n1(-z * .44)} ${n1(-h - z * .06)} 0 ${n1(-h - z * .16)} C${n1(z * .44)} ${n1(-h - z * .06)} ${n1(z * .4)} ${n1(-h - z * .5)} 0 ${n1(-h - z * .16)}Z" fill="${ribbon}" ${ink(1.6)}/>`;
  for (let i = 0; i < 5; i++) s += `<circle cx="${n1(-z * .34 + r() * z * .2 + (i % 2) * z * .44)}" cy="${n1(-h * (.2 + r() * .6))}" r="${n1(z * .04)}" fill="${ribbon}" opacity=".7"/>`;
  return s;
}
/** a party hat z tall with stripes and a pompom */
function hat(z, fill, stripe) {
  let s = `<path d="M0 ${n1(-z)} L${n1(z * .36)} 0 L${n1(-z * .36)} 0Z" fill="${fill}" ${ink(1.8)}/>`;
  for (let k = 1; k < 4; k++) s += `<path d="M${n1(-z * .36 * (1 - k / 4) - z * .04)} ${n1(-z * k / 4)} L${n1(z * .36 * (1 - k / 4) + z * .04)} ${n1(-z * k / 4 + z * .08)}" ${ink(3, stripe)}/>`;
  return s + `<circle cy="${n1(-z)}" r="${n1(z * .1)}" fill="${C.cream}" ${ink(1.4)}/><path d="M${n1(-z * .4)} 0 Q0 ${n1(z * .1)} ${n1(z * .4)} 0" fill="none" ${ink(2)}/>`;
}
/** a curly paper streamer */
function streamer(len, col) {
  let d = 'M0 0';
  for (let i = 1; i <= 8; i++) d += ` Q${n1(len * (i - .5) / 8)} ${n1((i % 2 ? -1 : 1) * (8 + r() * 6))} ${n1(len * i / 8)} 0`;
  return `<path d="${d}" fill="none" ${ink(5, C.plum)}/><path d="${d}" fill="none" ${ink(3, col)}/>`;
}
/** a confetti bit: a strip, a dot, a triangle or a squiggle */
function confettiBit(z, col) {
  const k = r();
  if (k < .35) return `<rect x="${n1(-z / 2)}" y="${n1(-z * .2)}" width="${n1(z)}" height="${n1(z * .4)}" rx="1" fill="${col}" ${ink(1)}/>`;
  if (k < .6) return `<circle r="${n1(z * .32)}" fill="${col}" ${ink(1)}/>`;
  if (k < .8) return `<path d="M0 ${n1(-z * .45)} L${n1(z * .42)} ${n1(z * .32)} L${n1(-z * .42)} ${n1(z * .32)}Z" fill="${col}" ${ink(1)}/>`;
  return `<path d="M${n1(-z * .6)} 0 q${n1(z * .3)} ${n1(-z * .5)} ${n1(z * .6)} 0 t${n1(z * .6)} 0" fill="none" ${ink(2.4, col)}/>`;
}

/* ---- the frame: plum, its party bulbs, words on each side ---- */
function frame() {
  let s = `<rect width="1280" height="800" fill="${C.night}"/>`;
  const font = `800 11.5px "${F.sans}"`, words = [
    [640, 19, 0, 'CHÚC MỪNG SINH NHẬT  ·  HAPPY BIRTHDAY  ·  TUỔI MỚI RỰC RỠ  ·  TRÊN SÂN THƯỢNG  ·  TỐI NAY CÓ BẤT NGỜ'],
    [640, 789, 0, 'ĐẶT THIỆP NẰM PHẲNG  ·  LAY THE CARD FLAT  ·  KEEP IT IN VIEW  ·  No. 2410  ·  ƯỚC ĐI EM'],
    [15, 400, -90, 'THỔI NẾN  ·  ƯỚC MỘT ĐIỀU'],
    [1265, 400, 90, 'BÓNG BAY  ·  BÁNH KEM  ·  PHÁO HOA']];
  const half = words.map(([, , , str]) => (measure(str, font) + str.length * 3) / 2 + 16);
  const free = (x, y) => words.every(([wx, wy, a], i) => a ? !(Math.abs(x - wx) < 16 && Math.abs(y - wy) < half[i]) : !(Math.abs(y - wy) < 16 && Math.abs(x - wx) < half[i]));
  const run = (x0, y0, x1, y1) => {                                     // bulbs along a side, their spacing and colours a little uneven
    const len = Math.hypot(x1 - x0, y1 - y0);
    for (let t = 10 + r() * 10; t < len - 10; t += 24 + r() * 16) {
      const x = x0 + (x1 - x0) * t / len, y = y0 + (y1 - y0) * t / len;
      if (free(x, y)) s += g(x, y, 0, 1, bulb(4.2 + r() * 1.4, r() > .12, pick([C.gold, C.gold, C.rose, C.mint, C.lilac])));
    }
  };
  run(15, 15, 1265, 15); run(15, 785, 1265, 785); run(15, 34, 15, 766); run(1265, 34, 1265, 766);
  words.forEach(([x, y, a, str]) => { s += g(x, y, a, 1, T(0, a ? 4 : 0, str, { s: 11.5, ls: 3, anchor: 'middle', fill: C.cream })); });
  const L = 30, Tp = 30, R = 1250, B = 770;                            // the sheet: scallops along each edge, each its own width
  let d = `M${L} ${Tp}`;
  const edge = (from, to, fixed, horizontal, out) => {
    for (let p = from; Math.abs(to - p) > 1;) {
      const step = Math.sign(to - p) * Math.min(Math.abs(to - p), 15 + r() * 10), q = p + step, m = (p + q) / 2, b = (6 + r() * 4) * out;
      d += horizontal ? ` Q${n1(m)} ${n1(fixed + b)} ${n1(q)} ${n1(fixed)}` : ` Q${n1(fixed + b)} ${n1(m)} ${n1(fixed)} ${n1(q)}`;
      p = q;
    }
  };
  edge(L, R, Tp, true, -1); edge(Tp, B, R, false, 1); edge(R, L, B, true, 1); edge(B, Tp, L, false, -1);
  s += `<path d="${d}Z" fill="${C.cream}" ${ink(2.6, C.deep)}/>`;
  s += `<rect x="42" y="42" width="1196" height="716" rx="10" fill="none" stroke="${C.rose}" stroke-width="1.6" stroke-dasharray="12 7"/>`;
  return s;
}

/* ---- the night over the city, across the top: moon, fireworks, the skyline, string lights with bunting and polaroids ---- */
function night() {
  const x0 = 54, y0 = 54, w = 1172, h = 236, base = y0 + h;
  keep(x0 - 6, y0 - 6, x0 + w + 6, base + 34);
  let s = `<defs><linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#211a4a"/><stop offset=".6" stop-color="#4b2f74"/><stop offset="1" stop-color="#a1527f"/></linearGradient>` +
    `<clipPath id="nightClip"><rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="18"/></clipPath></defs>`;
  s += `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="18" fill="url(#nightSky)" ${ink(3, C.deep)}/>`;
  let inner = '';
  for (let i = 0; i < 230; i++) {                                      // stars, each its own size and shape
    const x = x0 + 12 + r() * (w - 24), y = y0 + 10 + r() * (h * .62);
    inner += r() < .2 ? g(x, y, r() * 40, 1, sparkle(2.5 + r() * 4, pick([C.butter, C.white, C.gold]), .9, C.deep)) : `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(.8 + r() * 1.8)}" fill="${pick([C.white, C.butter, C.sky, C.lilac])}"/>`;
  }
  const mx = x0 + 96, my = y0 + 70;                                    // the crescent moon, sleepy
  inner += `<circle cx="${mx}" cy="${my}" r="54" fill="${C.butter}" opacity=".22"/>`;
  inner += `<path d="M${mx + 6} ${my - 42} A42 42 0 1 0 ${mx + 28} ${my + 32} A34 34 0 1 1 ${mx + 6} ${my - 42}Z" fill="${C.butter}" ${ink(2.4, C.deep)}/>`;
  inner += `<path d="M${mx - 24} ${my - 20} q5 4 10 0 M${mx - 6} ${my - 30} q4 3 8 -1" fill="none" ${ink(1.8, C.deep)}/><path d="M${mx - 15} ${my - 4} q6 6 12 1" fill="none" ${ink(2.2, C.hot)}/>`;
  inner += `<circle cx="${mx - 20}" cy="${my + 10}" r="3.4" fill="${C.gold}" ${ink(1, C.deep)}/><circle cx="${mx - 30}" cy="${my - 6}" r="2.4" fill="${C.gold}" ${ink(1, C.deep)}/>`;
  for (const [cx, cy, k] of [[x0 + 210, y0 + 44, .9], [x0 + 468, y0 + 96, .75], [x0 + 714, y0 + 40, .8], [x0 + 972, y0 + 92, .7]]) {   // small clouds, each its own shape
    let c = `M${n1(cx - 40 * k)} ${n1(cy + 10 * k)}`;
    [[-32, -14, 16], [-8, -24, 20], [18, -16, 17], [38, -2, 12]].forEach(([dx, dy, rr]) => { const q = rr * (.85 + r() * .3); c += ` A${n1(q * k)} ${n1(q * k)} 0 0 1 ${n1(cx + (dx + q * .8) * k)} ${n1(cy + (dy + q * .6) * k)}`; });
    inner += `<path d="${c} L${n1(cx + 46 * k)} ${n1(cy + 12 * k)} Z" fill="${pick(['#6a4f93', '#7a5aa0', '#5d4688'])}" ${ink(2, C.deep)}/>`;
  }
  [[x0 + 330, y0 + 62, 46, C.gold, C.rose], [x0 + 590, y0 + 44, 34, C.sky, C.white], [x0 + 846, y0 + 70, 42, C.rose, C.butter], [x0 + 1060, y0 + 46, 30, C.lilac, C.gold],
    [x0 + 260, y0 + 118, 22, C.mint, C.white], [x0 + 520, y0 + 30, 20, C.gold, C.white], [x0 + 650, y0 + 104, 24, C.lilac, C.butter], [x0 + 930, y0 + 30, 22, C.sky, C.gold], [x0 + 1130, y0 + 104, 20, C.rose, C.white], [x0 + 400, y0 + 26, 18, C.butter, C.rose]]
    .forEach(([x, y, z, a, b]) => { inner += g(x, y, r() * 30, 1, burst(z, a, b)); });
  let sky = '';                                                        // the skyline: towers of every width, lit windows, tanks and masts
  for (let x = x0 - 10, i = 0; x < x0 + w + 10; i++) {
    const bw = 34 + r() * 46, bh = 50 + r() * 78 + (i % 5 === 2 ? 40 : 0), top = base - bh;
    sky += `<rect x="${n1(x)}" y="${n1(top)}" width="${n1(bw)}" height="${n1(bh + 4)}" fill="${pick([C.violet, '#3d2d63', C.violet2, '#55407a'])}" ${ink(1.6, C.deep)}/>`;
    for (let wy = top + 8; wy < base - 8; wy += 12) for (let wx = x + 5; wx < x + bw - 8; wx += 10)
      sky += `<rect x="${n1(wx)}" y="${n1(wy)}" width="5" height="6.5" fill="${r() < .55 ? pick([C.gold, C.butter, C.butter, C.rose, C.sky]) : '#2a2045'}"/>`;
    const k = r();
    if (k < .22) sky += `<path d="M${n1(x + bw * .2)} ${n1(top)} v-12 a${n1(bw * .14)} ${n1(bw * .14)} 0 0 1 ${n1(bw * .28)} 0 v12Z" fill="#cfd4de" ${ink(1.4, C.deep)}/>`;   // a water tank
    else if (k < .4) sky += `<path d="M${n1(x + bw / 2)} ${n1(top)} v-26" ${ink(1.8, C.deep)}/><circle cx="${n1(x + bw / 2)}" cy="${n1(top - 27)}" r="2.6" fill="${C.red}"/>`;
    else if (k < .5) sky += `<path d="M${n1(x + 3)} ${n1(top)} L${n1(x + bw / 2)} ${n1(top - 22)} L${n1(x + bw - 3)} ${n1(top)}Z" fill="${C.violet2}" ${ink(1.6, C.deep)}/>`;
    if (i === 17) sky += g(x + bw / 2, top + 26, 0, 1, heart(26, 'none', 3, C.rose) + heart(26, 'none', 1.2, C.white));   // a neon heart
    x += bw + 2 + r() * 8;
  }
  inner += sky;
  s += `<g clip-path="url(#nightClip)">${inner}</g>`;
  const at = t => [x0 + 10 + (w - 20) * t, y0 + 150 + 46 * 4 * t * (1 - t) - 20 * t];   // the string lights sag across
  let d = ''; for (let i = 0; i <= 40; i++) { const [x, y] = at(i / 40); d += `${i ? 'L' : 'M'}${n1(x)} ${n1(y)}`; }
  s += `<path d="${d}" fill="none" ${ink(2.2, C.deep)}/>`;
  for (let i = 0; i < 26; i++) {
    const t = (i + .5) / 26, [x, y] = at(t);
    if ([5, 13, 20].some(k => Math.abs(i - k) < .5)) {                  // three polaroids on pegs
      const ph = pick([C.pink, C.mint, C.butter, C.lilac]);
      s += g(x, y + 2, (r() - .5) * 14, 1, `<rect x="-3" y="-2" width="6" height="14" fill="${C.wood2}" ${ink(1.1)}/>` + g(0, 40, 0, 1, polaroid(46, ph, i === 13 ? heart(18, C.hot, 1.2) : couple(46))));
    } else s += g(x, y + 6, 0, 1, `<rect x="-2.6" y="-6" width="5.2" height="4.4" fill="${C.deep}"/>` + bulb(4.4 + r(), true, pick([C.gold, C.gold, C.butter, C.rose])));
  }
  const bunt = t => [x0 + 10 + (w - 20) * t, y0 + 12 + 30 * 4 * t * (1 - t)];   // and bunting higher up
  let b = ''; for (let i = 0; i <= 40; i++) { const [x, y] = bunt(i / 40); b += `${i ? 'L' : 'M'}${n1(x)} ${n1(y)}`; }
  s += `<path d="${b}" fill="none" ${ink(1.6, C.deep)}/>`;
  for (let i = 0; i < 30; i++) {
    const [x, y] = bunt((i + .5) / 30), z = 13 + r() * 4;

  const placed = [];
  for (let i = 0; i < 14000 && placed.length < 420; i++) {

    else if (k < .76) s += g(x, y, a, 1, heart(9 + r() * 7, pick([C.hot, C.rose, C.pink, C.red])));
    else if (k < .9) s += `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(2.2 + r() * 2.6)}" fill="${pick([C.hot, C.gold, C.mint2, C.violet, C.rose])}"/>`;
    else s += g(x, y, a * 2, 1, tape(14 + r() * 10, 6, pick([C.mint, C.gold, C.rose])));
  }
  return s;
}
