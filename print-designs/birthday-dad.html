<!doctype html>
<html><head><meta charset="utf-8"><title>Sinh nhật Bố: the print</title>
<link rel="stylesheet" href="/node_modules/@fontsource/pacifico/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/dancing-script/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/600.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/800.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/900.css">
<link rel="stylesheet" href="/node_modules/@fontsource/patrick-hand/400.css">
<style>
/* The printed card = the tracking image. "Sinh nhật Bố": a birthday party for Dad in the living room. A navy frame with
   party bulbs and running words; on a scalloped cream sheet, a line of photo pennants and fairy lights across the top
   with a disco ball; at the left the front door with its welcome mat, the coat stand with Bố's hat, the light switch
   with the children's sticky note and the briefcase set down; in the middle "Chúc mừng sinh nhật" and a big "Bố" with a
   moustache and a tie, over a ribbon from the children; under it the coffee table with a three-tier cake, Bố's mug and
   presents; at the right a big gold trophy (BỐ TUYỆT NHẤT) and balloons spelling BỐ; along the bottom the instruction
   ribbon, a stamp and a postmark; confetti, stars, hearts, notes, little ties and moustaches wherever there is paper
   left. Every shape is inked so the tracker finds edges everywhere; nothing is mirrored or tiled, and all randomness is
   seeded, so every render is the same picture. */
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#23294a}
svg{display:block}
</style></head><body>
<svg id="card" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const rng = s => () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; const r = rng(1906);
const C = { frame: '#23294a', ink: '#33263f', deep: '#1a1730', navy: '#2f3f6e', navy2: '#4a5d9a', cream: '#fff4ec', paper: '#fffaf3',
  blush: '#fde4ea', pink: '#f6c9d6', rose: '#ee7fa0', hot: '#e8436d', wine: '#9e1f45', gold: '#ffd27a', gold2: '#f4b63c', butter: '#ffe9b8',
  orange: '#f28c3a', mint: '#8fd0bd', mint2: '#5aa39b', sky: '#9be7ff', lilac: '#c5a3ff', peach: '#ffb08f', wood: '#e2b98c', wood2: '#c99a6b',
  wood3: '#a87850', coffee: '#7a4a2e', leaf: '#6fbf73', leaf2: '#4f9a5c', red: '#e5484d', white: '#ffffff', grey: '#d9dde6' };
const F = { logo: 'Pacifico', sans: 'Be Vietnam Pro', hand: 'Dancing Script', note: 'Patrick Hand' };
const n1 = v => Math.round(v * 10) / 10;
const pick = a => a[(r() * a.length) | 0];
const rad = d => d * Math.PI / 180;
const pt = (cx, cy, rr, deg) => [n1(cx + Math.cos(rad(deg)) * rr), n1(cy + Math.sin(rad(deg)) * rr)];
const tf = (x, y, a = 0, s = 1) => `translate(${n1(x)} ${n1(y)})${a ? ` rotate(${n1(a)})` : ''}${s !== 1 ? ` scale(${s})` : ''}`;
const g = (x, y, a, s, inner) => `<g transform="${tf(x, y, a, s)}">${inner}</g>`;
const ink = (sw = 2, c = C.ink) => `stroke="${c}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"`;
const T = (x, y, str, o = {}) => `<text x="${n1(x)}" y="${n1(y)}" font-family="${o.f || F.sans}" font-weight="${o.w || 800}" font-size="${o.s || 14}"` +
  `${o.ls ? ` letter-spacing="${o.ls}"` : ''}${o.anchor ? ` text-anchor="${o.anchor}"` : ''} fill="${o.fill || C.ink}"` +
  `${o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 4}" paint-order="stroke" stroke-linejoin="round"` : ''}>${str}</text>`;
const measure = (str, font) => { const c = measure.c || (measure.c = document.createElement('canvas').getContext('2d')); c.font = font; return c.measureText(str).width; };
const fit = (str, weight, family, size, w) => Math.min(size, n1(w / measure(str, `${weight} 100px "${family}"`) * 100));

/* what the scatter keeps clear of */
const BOX = [];
const keep = (x0, y0, x1, y1) => BOX.push([x0, y0, x1, y1]);
const blocked = (x, y, m = 0) => BOX.some(([a, b, c, d]) => x > a - m && x < c + m && y > b - m && y < d + m);

/* ---- small shapes ---- */
const heart = (z, fill, sw = 1.8, c = C.ink) => `<path d="M0 ${n1(z * .38)} C${n1(-z * .95)} ${n1(-z * .18)} ${n1(-z * .48)} ${n1(-z * .9)} 0 ${n1(-z * .42)} C${n1(z * .48)} ${n1(-z * .9)} ${n1(z * .95)} ${n1(-z * .18)} 0 ${n1(z * .38)}Z" fill="${fill}" ${ink(sw, c)}/>`;
const sparkle = (z, fill, sw = 1.4, c = C.ink) => `<path d="M0 ${n1(-z)} Q${n1(z * .14)} ${n1(-z * .14)} ${n1(z)} 0 Q${n1(z * .14)} ${n1(z * .14)} 0 ${n1(z)} Q${n1(-z * .14)} ${n1(z * .14)} ${n1(-z)} 0 Q${n1(-z * .14)} ${n1(-z * .14)} 0 ${n1(-z)}Z" fill="${fill}" ${ink(sw, c)}/>`;
const star5 = (z, fill, sw = 1.4, c = C.ink) => { let d = ''; for (let i = 0; i < 10; i++) { const rr = i % 2 ? z * .45 : z * (.9 + r() * .2), [x, y] = pt(0, 0, rr, -90 + i * 36); d += `${i ? 'L' : 'M'}${x} ${y}`; } return `<path d="${d}Z" fill="${fill}" ${ink(sw, c)}/>`; };
const note8 = (z, fill) => `<ellipse cx="${n1(-z * .3)}" cy="${n1(z * .5)}" rx="${n1(z * .32)}" ry="${n1(z * .24)}" transform="rotate(-20 ${n1(-z * .3)} ${n1(z * .5)})" fill="${fill}" ${ink(1.2)}/>` +
  `<path d="M${n1(-z * .02)} ${n1(z * .45)} V${n1(-z * .6)} Q${n1(z * .3)} ${n1(-z * .4)} ${n1(z * .42)} ${n1(-z * .1)}" fill="none" ${ink(2)}/>`;
/** a little necktie z tall: the knot and the blade, striped */
function tie(z, fill, stripe) {
  let s = `<path d="M${n1(-z * .12)} 0 L${n1(z * .12)} 0 L${n1(z * .08)} ${n1(z * .14)} L${n1(-z * .08)} ${n1(z * .14)}Z" fill="${fill}" ${ink(1.6)}/>`;
  s += `<path d="M${n1(-z * .08)} ${n1(z * .14)} L${n1(z * .08)} ${n1(z * .14)} L${n1(z * .17)} ${n1(z * .82)} L0 ${n1(z)} L${n1(-z * .17)} ${n1(z * .82)}Z" fill="${fill}" ${ink(1.6)}/>`;
  for (let k = 1; k < 4; k++) s += `<path d="M${n1(-z * (.08 + k * .025))} ${n1(z * (.16 + k * .17))} L${n1(z * (.08 + k * .025))} ${n1(z * (.08 + k * .17))}" ${ink(2, stripe)}/>`;
  return s;
}
/** a handlebar moustache z wide */
const moustache = (z, fill = C.coffee) => `<path d="M0 ${n1(-z * .06)} C${n1(-z * .1)} ${n1(-z * .2)} ${n1(-z * .3)} ${n1(-z * .16)} ${n1(-z * .34)} ${n1(-z * .02)} C${n1(-z * .38)} ${n1(z * .08)} ${n1(-z * .46)} ${n1(z * .1)} ${n1(-z * .5)} ${n1(-z * .04)} ` +
  `C${n1(-z * .46)} ${n1(z * .2)} ${n1(-z * .26)} ${n1(z * .2)} ${n1(-z * .14)} ${n1(z * .08)} C${n1(-z * .08)} ${n1(z * .04)} ${n1(-z * .03)} ${n1(z * .06)} 0 ${n1(z * .1)} ` +
  `C${n1(z * .03)} ${n1(z * .06)} ${n1(z * .08)} ${n1(z * .04)} ${n1(z * .14)} ${n1(z * .08)} C${n1(z * .26)} ${n1(z * .2)} ${n1(z * .46)} ${n1(z * .2)} ${n1(z * .5)} ${n1(-z * .04)} ` +
  `C${n1(z * .46)} ${n1(z * .1)} ${n1(z * .38)} ${n1(z * .08)} ${n1(z * .34)} ${n1(-z * .02)} C${n1(z * .3)} ${n1(-z * .16)} ${n1(z * .1)} ${n1(-z * .2)} 0 ${n1(-z * .06)}Z" fill="${fill}" ${ink(1.6)}/>`;
/** a strip of tape with torn ends, centred on 0 0 */
function tape(w, h, fill, sw = 1.2) {
  let d = `M${n1(-w / 2)} ${n1(-h / 2)} L${n1(w / 2)} ${n1(-h / 2)}`;
  for (let i = 1; i <= 4; i++) d += ` L${n1(w / 2 + (i % 2 ? 2.4 : 0))} ${n1(-h / 2 + h * i / 4)}`;
  d += ` L${n1(-w / 2)} ${n1(h / 2)}`;
  for (let i = 1; i <= 4; i++) d += ` L${n1(-w / 2 - (i % 2 ? 2.4 : 0))} ${n1(h / 2 - h * i / 4)}`;
  return `<path d="${d}Z" fill="${fill}" ${ink(sw)}/>`;
}
const bulb = (rr, lit = true, col = C.gold) => (lit ? `<circle r="${n1(rr * 1.9)}" fill="${C.butter}" opacity=".5"/>` : '') +
  `<circle r="${n1(rr)}" fill="${lit ? col : C.rose}" ${ink(1.2)}/><circle cx="${n1(-rr * .35)}" cy="${n1(-rr * .35)}" r="${n1(rr * .3)}" fill="#fff" opacity=".85"/>`;
/** a gift box z wide, its ribbon and bow */
function gift(z, box, ribbon) {
  const h = z * .78;
  let s = `<rect x="${n1(-z / 2)}" y="${n1(-h)}" width="${n1(z)}" height="${n1(h)}" rx="3" fill="${box}" ${ink(2)}/>`;
  s += `<rect x="${n1(-z * .56)}" y="${n1(-h - z * .16)}" width="${n1(z * 1.12)}" height="${n1(z * .2)}" rx="3" fill="${box}" ${ink(2)}/>`;
  s += `<rect x="${n1(-z * .08)}" y="${n1(-h - z * .16)}" width="${n1(z * .16)}" height="${n1(h + z * .16)}" fill="${ribbon}" ${ink(1.4)}/>`;
  s += `<path d="M0 ${n1(-h - z * .16)} C${n1(-z * .4)} ${n1(-h - z * .5)} ${n1(-z * .44)} ${n1(-h - z * .06)} 0 ${n1(-h - z * .16)} C${n1(z * .44)} ${n1(-h - z * .06)} ${n1(z * .4)} ${n1(-h - z * .5)} 0 ${n1(-h - z * .16)}Z" fill="${ribbon}" ${ink(1.6)}/>`;
  for (let i = 0; i < 5; i++) s += `<circle cx="${n1(-z * .34 + r() * z * .2 + (i % 2) * z * .44)}" cy="${n1(-h * (.2 + r() * .6))}" r="${n1(z * .04)}" fill="${ribbon}" opacity=".7"/>`;
  return s;
}
/** a party hat z tall with stripes and a pompom */
function hat(z, fill, stripe) {
  let s = `<path d="M0 ${n1(-z)} L${n1(z * .36)} 0 L${n1(-z * .36)} 0Z" fill="${fill}" ${ink(1.8)}/>`;
  for (let k = 1; k < 4; k++) s += `<path d="M${n1(-z * .36 * (1 - k / 4) - z * .04)} ${n1(-z * k / 4)} L${n1(z * .36 * (1 - k / 4) + z * .04)} ${n1(-z * k / 4 + z * .08)}" ${ink(3, stripe)}/>`;
  return s + `<circle cy="${n1(-z)}" r="${n1(z * .1)}" fill="${C.cream}" ${ink(1.4)}/><path d="M${n1(-z * .4)} 0 Q0 ${n1(z * .1)} ${n1(z * .4)} 0" fill="none" ${ink(2)}/>`;
}
/** a curly paper streamer */
function streamer(len, col) {
  let d = 'M0 0';
  for (let i = 1; i <= 8; i++) d += ` Q${n1(len * (i - .5) / 8)} ${n1((i % 2 ? -1 : 1) * (8 + r() * 6))} ${n1(len * i / 8)} 0`;
  return `<path d="${d}" fill="none" ${ink(5, C.ink)}/><path d="${d}" fill="none" ${ink(3, col)}/>`;
}
/** a confetti bit: a strip, a dot, a triangle or a squiggle */
function confettiBit(z, col) {
  const k = r();
  if (k < .35) return `<rect x="${n1(-z / 2)}" y="${n1(-z * .2)}" width="${n1(z)}" height="${n1(z * .4)}" rx="1" fill="${col}" ${ink(1)}/>`;
  if (k < .6) return `<circle r="${n1(z * .32)}" fill="${col}" ${ink(1)}/>`;
  if (k < .8) return `<path d="M0 ${n1(-z * .45)} L${n1(z * .42)} ${n1(z * .32)} L${n1(-z * .42)} ${n1(z * .32)}Z" fill="${col}" ${ink(1)}/>`;
  return `<path d="M${n1(-z * .6)} 0 q${n1(z * .3)} ${n1(-z * .5)} ${n1(z * .6)} 0 t${n1(z * .6)} 0" fill="none" ${ink(2.4, col)}/>`;
}
/** a little framed photo z wide: a doodle inside (Bố with his beard and tie, the children, a heart or a house) */
function snapshot(z, bg, kind) {
  const h = z * .82;
  let s = `<rect x="${n1(-z / 2)}" y="${n1(-h / 2)}" width="${n1(z)}" height="${n1(h)}" rx="1.5" fill="${C.white}" ${ink(1.4)}/>`;
  s += `<rect x="${n1(-z * .4)}" y="${n1(-h * .38)}" width="${n1(z * .8)}" height="${n1(h * .76)}" fill="${bg}" ${ink(1)}/>`;
  if (kind === 'dad') {
    s += `<path d="M${n1(-z * .26)} ${n1(h * .38)} Q${n1(-z * .22)} ${n1(h * .06)} 0 ${n1(h * .04)} Q${n1(z * .22)} ${n1(h * .06)} ${n1(z * .26)} ${n1(h * .38)}Z" fill="${C.navy}" ${ink(1)}/>`;
    s += g(0, h * .06, 0, 1, tie(h * .3, C.orange, C.gold));
    s += `<circle cx="0" cy="${n1(-h * .1)}" r="${n1(z * .14)}" fill="${C.peach}" ${ink(1)}/><path d="M${n1(-z * .14)} ${n1(-h * .1)} Q0 ${n1(h * .12)} ${n1(z * .14)} ${n1(-h * .1)} Q0 ${n1(-h * .02)} ${n1(-z * .14)} ${n1(-h * .1)}Z" fill="${C.coffee}" ${ink(.8)}/>`;
    s += `<path d="M${n1(-z * .15)} ${n1(-h * .14)} Q0 ${n1(-h * .36)} ${n1(z * .15)} ${n1(-h * .14)}" fill="${C.coffee}" ${ink(.8)}/>`;
  } else if (kind === 'kids') {
    for (const [dx, col] of [[-.17, C.hot], [.17, C.mint2]]) {
      s += `<circle cx="${n1(z * dx)}" cy="${n1(-h * .04)}" r="${n1(z * .1)}" fill="${C.peach}" ${ink(.9)}/>`;
      s += `<path d="M${n1(z * (dx - .14))} ${n1(h * .36)} Q${n1(z * dx)} ${n1(h * .02)} ${n1(z * (dx + .14))} ${n1(h * .36)}Z" fill="${col}" ${ink(.9)}/>`;
    }
    s += g(0, -h * .22, 0, 1, heart(z * .16, C.hot, .9));
  } else if (kind === 'house') {
    s += `<path d="M${n1(-z * .2)} ${n1(h * .34)} V${n1(-h * .02)} L0 ${n1(-h * .24)} L${n1(z * .2)} ${n1(-h * .02)} V${n1(h * .34)}Z" fill="${C.cream}" ${ink(1)}/>` + g(0, h * .12, 0, 1, heart(z * .14, C.hot, .9));
  } else s += g(0, h * .02, 0, 1, heart(z * .36, C.hot, 1.1));
  return s;
}

/* ---- the frame: navy, its party bulbs, words on each side ---- */
function frame() {
  let s = `<rect width="1280" height="800" fill="${C.frame}"/>`;
  const font = `800 11.5px "${F.sans}"`, words = [
    [640, 19, 0, 'CHÚC MỪNG SINH NHẬT BỐ  ·  HAPPY BIRTHDAY DAD  ·  BỐ LÀ SIÊU ANH HÙNG  ·  TỐI NAY NHÀ MÌNH CÓ TIỆC'],
    [640, 789, 0, 'ĐẶT THIỆP NẰM PHẲNG  ·  LAY THE CARD FLAT  ·  KEEP IT IN VIEW  ·  No. 1906  ·  BỐ BẬT ĐÈN LÊN NHÉ'],
    [15, 400, -90, 'BỐ TUYỆT NHẤT  ·  ĐIỆU NHẢY CỦA BỐ'],
    [1265, 400, 90, 'BÁNH KEM  ·  CÚP VÀNG  ·  TỤI CON THƯƠNG BỐ']];
  const half = words.map(([, , , str]) => (measure(str, font) + str.length * 3) / 2 + 16);
  const free = (x, y) => words.every(([wx, wy, a], i) => a ? !(Math.abs(x - wx) < 16 && Math.abs(y - wy) < half[i]) : !(Math.abs(y - wy) < 16 && Math.abs(x - wx) < half[i]));
  const run = (x0, y0, x1, y1) => {                                     // bulbs along a side, their spacing and colours a little uneven
    const len = Math.hypot(x1 - x0, y1 - y0);
    for (let t = 10 + r() * 10; t < len - 10; t += 24 + r() * 16) {
      const x = x0 + (x1 - x0) * t / len, y = y0 + (y1 - y0) * t / len;
      if (free(x, y)) s += g(x, y, 0, 1, bulb(4.2 + r() * 1.4, r() > .12, pick([C.gold, C.gold, C.orange, C.rose, C.mint])));
    }
  };
  run(15, 15, 1265, 15); run(15, 785, 1265, 785); run(15, 34, 15, 766); run(1265, 34, 1265, 766);
  words.forEach(([x, y, a, str]) => { s += g(x, y, a, 1, T(0, a ? 4 : 0, str, { s: 11.5, ls: 3, anchor: 'middle', fill: C.cream })); });
  const L = 30, Tp = 30, R = 1250, B = 770;                            // the sheet: scallops along each edge, each its own width
  let d = `M${L} ${Tp}`;
  const edge = (from, to, fixed, horizontal, out) => {
    for (let p = from; Math.abs(to - p) > 1;) {
      const step = Math.sign(to - p) * Math.min(Math.abs(to - p), 15 + r() * 10), q = p + step, m = (p + q) / 2, b = (6 + r() * 4) * out;
      d += horizontal ? ` Q${n1(m)} ${n1(fixed + b)} ${n1(q)} ${n1(fixed)}` : ` Q${n1(fixed + b)} ${n1(m)} ${n1(fixed)} ${n1(q)}`;
      p = q;
    }
  };
  edge(L, R, Tp, true, -1); edge(Tp, B, R, false, 1); edge(R, L, B, true, 1); edge(B, Tp, L, false, -1);
  s += `<path d="${d}Z" fill="${C.cream}" ${ink(2.6, C.deep)}/>`;
  s += `<rect x="42" y="42" width="1196" height="716" rx="10" fill="none" stroke="${C.rose}" stroke-width="1.6" stroke-dasharray="12 7"/>`;
  return s;
}

/* ---- across the top: fairy lights, a line of photo pennants, a disco ball ---- */
function garland() {
  let s = '';
  keep(50, 48, 1230, 150);
  const lights = t => [60 + 1160 * t, 58 + 16 * Math.abs(Math.sin(t * Math.PI * 7))];
  let d = ''; for (let i = 0; i <= 140; i++) { const [x, y] = lights(i / 140); d += `${i ? 'L' : 'M'}${n1(x)} ${n1(y)}`; }
  s += `<path d="${d}" fill="none" ${ink(1.8, C.deep)}/>`;
  for (let i = 0; i < 48; i++) { const [x, y] = lights((i + .5) / 48); s += g(x, y + 6, 0, 1, `<rect x="-2.4" y="-6" width="4.8" height="4" fill="${C.deep}"/>` + bulb(4 + r(), true, pick([C.gold, C.gold, C.rose, C.mint, C.lilac]))); }
  const sag = t => [74 + 1132 * t, 84 + 34 * 4 * t * (1 - t) - 14 * Math.sin(t * Math.PI * 3) ** 2];   // the pennant string
  let p = ''; for (let i = 0; i <= 60; i++) { const [x, y] = sag(i / 60); p += `${i ? 'L' : 'M'}${n1(x)} ${n1(y)}`; }
  s += `<path d="${p}" fill="none" ${ink(2, C.deep)}/>`;
  const KINDS = ['dad', 'kids', 'heart', 'house'];
  for (let i = 0; i < 17; i++) {
    const [x, y] = sag((i + .5) / 17), col = [C.rose, C.gold, C.mint, C.lilac, C.peach, C.sky][i % 6], w = 46 + r() * 6, h = w * 1.18, a = (r() - .5) * 10;
    let f = `<path d="M${n1(-w / 2)} 0 L${n1(w / 2)} 0 L${n1(w / 2)} ${n1(h * .66)} L0 ${n1(h)} L${n1(-w / 2)} ${n1(h * .66)}Z" fill="${col}" ${ink(1.8)}/>`;
    f += `<path d="M${n1(-w / 2 + 5)} 5 L${n1(w / 2 - 5)} 5 L${n1(w / 2 - 5)} ${n1(h * .63)} L0 ${n1(h - 8)} L${n1(-w / 2 + 5)} ${n1(h * .63)}Z" fill="none" stroke="${C.white}" stroke-width="1.4" stroke-dasharray="4 3"/>`;
    f += g(0, h * .36, 0, 1, snapshot(w * .66, pick([C.blush, C.butter, C.sky, C.mint]), KINDS[i % 4]));
    s += g(x, y, a, 1, f);
  }
  /* the disco ball over the middle, its cord and its sparkle */
  const bx = 356, by = 206;
  keep(bx - 40, 120, bx + 40, by + 40);
  s += `<path d="M${bx} 60 V${by - 30}" ${ink(1.6, C.deep)}/>`;
  let ball = `<circle r="30" fill="${C.grey}" ${ink(2.2)}/>`;
  for (let k = -3; k <= 3; k++) ball += `<path d="M${n1(-Math.sqrt(900 - (k * 8.4) ** 2))} ${n1(k * 8.4)} H${n1(Math.sqrt(900 - (k * 8.4) ** 2))}" ${ink(.9)}/>`;
  for (let k = -3; k <= 3; k++) ball += `<ellipse rx="${n1(Math.abs(k) * 4.3)}" ry="30" fill="none" ${ink(.9)}/>`;
  for (let i = 0; i < 9; i++) { const [x, y] = pt(0, 0, 8 + r() * 18, r() * 360); ball += `<rect x="${n1(x - 3)}" y="${n1(y - 3)}" width="6" height="6" fill="${pick([C.sky, C.pink, C.butter, C.white])}"/>`; }
  ball += `<rect x="-5" y="-36" width="10" height="7" rx="1.5" fill="${C.grey}" ${ink(1.4)}/>`;
  s += g(bx, by, 0, 1, ball);
  for (const [a, l, col] of [[200, 34, C.hot], [235, 30, C.gold], [300, 32, C.mint], [340, 28, C.lilac], [20, 30, C.sky], [160, 26, C.peach]]) {
    const [x0, y0] = pt(bx, by, 38, a), [x1, y1] = pt(bx, by, 38 + l, a);

/* ---- streamers and confetti, stars, sparkles, hearts, notes, little ties and moustaches wherever there is paper left ---- */
function scatter() {
  let s = '';
  [[392, 498, -8, 120, C.mint], [882, 504, 10, 110, C.rose], [930, 682, -4, 100, C.gold], [80, 740, 3, 100, C.lilac]].forEach(([x, y, a, len, col]) => {
    if (!blocked(x + len / 2, y, 2)) { s += g(x, y, a, 1, streamer(len, col)); keep(x - 4, y - 18, x + len + 4, y + 18); }
  });
  const placed = [];
  for (let i = 0; i < 16000 && placed.length < 460; i++) {
    const x = 46 + r() * 1188, y = 46 + r() * 708;
    if (blocked(x, y, 8) || placed.some(([px, py]) => Math.hypot(px - x, py - y) < 19)) continue;
    placed.push([x, y]);
    const k = r(), a = (r() * 60 - 30) | 0;
    if (k < .3) s += g(x, y, r() * 180, 1, confettiBit(9 + r() * 6, pick([C.rose, C.gold, C.mint, C.lilac, C.hot, C.sky, C.peach, C.orange])));
    else if (k < .45) s += g(x, y, a, 1, sparkle(5 + r() * 5, pick([C.gold, C.butter, C.mint, C.pink])));
    else if (k < .56) s += g(x, y, a, 1, star5(5 + r() * 4, pick([C.gold, C.butter, C.lilac])));
    else if (k < .67) s += g(x, y, a, 1, heart(9 + r() * 7, pick([C.hot, C.rose, C.pink, C.red])));
    else if (k < .74) s += g(x, y - 6, a / 2, 1, tie(16 + r() * 5, pick([C.orange, C.navy2, C.hot, C.mint2]), C.gold));
    else if (k < .8) s += g(x, y, a / 3, 1, moustache(20 + r() * 6));
    else if (k < .86) s += g(x, y, a / 2, 1, note8(11 + r() * 3, pick([C.hot, C.navy2, C.mint2])));
    else if (k < .94) s += `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(2.2 + r() * 2.6)}" fill="${pick([C.hot, C.gold, C.mint2, C.navy2, C.rose])}"/>`;
    else s += g(x, y, a * 2, 1, tape(14 + r() * 10, 6, pick([C.mint, C.gold, C.rose])));
  }
  return s;
}

const FACES = [`400 74px "${F.logo}"`, `700 24px "${F.hand}"`, `400 17px "${F.note}"`, `600 14px "${F.sans}"`, `800 14px "${F.sans}"`, `900 14px "${F.sans}"`];
Promise.all(FACES.map(f => document.fonts.load(f, 'Chúc mừng sinh nhật Bố bật đèn lên nhé tụi con TỪ CÁC CON YÊU CỦA BỐ TUYỆT NHẤT CHÀO VỀ ĐẶT THIỆP BƯU CỤC ữ ơ ư ạ ả ấ ỏ ừ ậ ộ ố ệ ề ẳ Ố ♥'))).then(() => {
  const parts = [frame(), garland(), hallway(), title(), party(), trophy(), ribbon(), stamps()];
  document.getElementById('card').innerHTML = parts.join('') + scatter();
  return document.fonts.ready;
}).then(() => { window.__ready = true; });
</script>
