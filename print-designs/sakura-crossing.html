<!doctype html>
<html><head><meta charset="utf-8"><title>Mưa hoa anh đào: the print</title>
<link rel="stylesheet" href="/node_modules/@fontsource/pacifico/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/dancing-script/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/600.css">
<link rel="stylesheet" href="/node_modules/@fontsource/be-vietnam-pro/800.css">
<link rel="stylesheet" href="/node_modules/@fontsource/playfair-display/400-italic.css">
<link rel="stylesheet" href="/node_modules/@fontsource/patrick-hand/400.css">
<style>
/* The printed card = the tracking image. "Mưa hoa anh đào" (cherry blossom rain) as a spring rail postcard: a plum band
   with falling petals and running words round a cream sheet; the title in script; cherry branches; a station-name board
   (Ga Hoa Anh Đào, the stations either side under it); a train ticket from Ga Hoa Anh Đào to Ga Gặp Lại; the spring
   line's map with its stations; a crossing sign with its two lamps; a little train of our own, cream over rose; a stamp
   with a blossom and a postmark; a verse; and in the middle, where the act stands (the act's centre is the card's centre,
   640 x 400; the stage's x is 640 + 1280x, its z is 400 + 1280z), a little crossing seen from above with the instruction
   ribbon under it. Every shape is inked in plum so the tracker finds edges everywhere. Nothing mirrored or tiled; all
   randomness is seeded, so every render is the same picture. */
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#3b2440}
svg{display:block}
</style></head><body>
<svg id="card" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const rng = s => () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; const r = rng(404);
const C = { ink: '#3b2440', band: '#3b2440', paper: '#fff8f0', cream: '#fffdf7', blush: '#fde0e8', pink: '#f7a8c2', pink2: '#fbc9d8', rose: '#e8557f',
  deep: '#c23b67', wine: '#8e2550', sky: '#bfe0ff', sky2: '#8fc4f0', mint: '#bfe9d9', teal: '#3fa69b', leaf: '#7cc47a', moss: '#3e7f55',
  butter: '#ffe8a3', gold: '#f2b84b', yellow: '#f6c51c', black: '#2a2430', red: '#e0352f', bark: '#6e4b3e', grey: '#d9d3dc', lilac: '#cbbcf0',
  tcream: '#fff5e6', trose: '#ee7ea2', glass: '#3a4f78', warm: '#ffd88f' };
const F = { title: 'Pacifico', hand: 'Dancing Script', sans: 'Be Vietnam Pro', serif: 'Playfair Display', note: 'Patrick Hand' };
const n1 = v => Math.round(v * 10) / 10;
const pick = a => a[(r() * a.length) | 0];
const rad = d => d * Math.PI / 180;
const pt = (cx, cy, rr, deg) => [n1(cx + Math.cos(rad(deg)) * rr), n1(cy + Math.sin(rad(deg)) * rr)];
const tf = (x, y, a = 0, s = 1) => `translate(${n1(x)} ${n1(y)})${a ? ` rotate(${n1(a)})` : ''}${s !== 1 ? ` scale(${s})` : ''}`;
const g = (x, y, a, s, inner) => `<g transform="${tf(x, y, a, s)}">${inner}</g>`;
const ink = (sw = 2, c = C.ink) => `stroke="${c}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"`;
const T = (x, y, str, o = {}) => `<text x="${n1(x)}" y="${n1(y)}" font-family="${o.f || F.sans}" font-weight="${o.w || 800}" font-size="${o.s || 14}"` +
  `${o.style ? ` font-style="${o.style}"` : ''}${o.ls ? ` letter-spacing="${o.ls}"` : ''}${o.anchor ? ` text-anchor="${o.anchor}"` : ''} fill="${o.fill || C.ink}"` +
  `${o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 4}" paint-order="stroke" stroke-linejoin="round"` : ''}>${str}</text>`;

/* what the scatter keeps clear of */
const BOX = [];
const keep = (x0, y0, x1, y1) => BOX.push([x0, y0, x1, y1]);
const blocked = (x, y, m = 0) => BOX.some(([a, b, c, d]) => x > a - m && x < c + m && y > b - m && y < d + m);

/* small shapes */
const heart = (z, fill, sw = 1.8) => `<path d="M0 ${n1(z * .38)} C${n1(-z * .95)} ${n1(-z * .18)} ${n1(-z * .48)} ${n1(-z * .9)} 0 ${n1(-z * .42)} C${n1(z * .48)} ${n1(-z * .9)} ${n1(z * .95)} ${n1(-z * .18)} 0 ${n1(z * .38)}Z" fill="${fill}" ${ink(sw)}/>`;
const twinkle = (z, fill, sw = 1.4) => `<path d="M0 ${n1(-z)} Q${n1(z * .14)} ${n1(-z * .14)} ${n1(z)} 0 Q${n1(z * .14)} ${n1(z * .14)} 0 ${n1(z)} Q${n1(-z * .14)} ${n1(z * .14)} ${n1(-z)} 0 Q${n1(-z * .14)} ${n1(-z * .14)} 0 ${n1(-z)}Z" fill="${fill}" ${ink(sw)}/>`;
/** one cherry petal pointing up from (0, 0) to (0, -L), notched at its tip, each a little uneven */
const petal = (L, fill, sw = 1.4) => {
  const a = .5 + r() * .1, b = .52 + r() * .1;
  return `<path d="M0 0 C${n1(-L * a)} ${n1(-L * .2)} ${n1(-L * .56)} ${n1(-L * .86)} ${n1(-L * .18)} ${n1(-L)} L0 ${n1(-L * .83)} L${n1(L * .18)} ${n1(-L)} C${n1(L * b)} ${n1(-L * .86)} ${n1(L * .5)} ${n1(-L * .2)} 0 0Z" fill="${fill}" ${ink(sw)}/>`;
};
/** a blossom from the front: five petals turned their own ways, a dark middle with stamens */
function blossom(R, fill, eye = C.deep) {
  const a0 = r() * 72; let s = '';
  for (let i = 0; i < 5; i++) s += `<g transform="rotate(${n1(a0 + i * 72 + (r() - .5) * 10)})">${petal(R * (.88 + r() * .22), fill, Math.max(1, R * .1))}</g>`;
  s += `<circle r="${n1(R * .27)}" fill="${eye}" ${ink(1.1)}/>`;
  for (let i = 0; i < 5; i++) { const [x, y] = pt(0, 0, R * (.38 + r() * .12), r() * 360); s += `<circle cx="${x}" cy="${y}" r="${n1(Math.max(1, R * .08))}" fill="${C.gold}"/>`; }
  return s;
}
const bud = (z, fill = C.pink) => `<path d="M0 ${n1(z * .5)} C${n1(-z * .6)} ${n1(z * .1)} ${n1(-z * .45)} ${n1(-z * .7)} 0 ${n1(-z * .8)} C${n1(z * .45)} ${n1(-z * .7)} ${n1(z * .6)} ${n1(z * .1)} 0 ${n1(z * .5)}Z" fill="${fill}" ${ink(1.2)}/>` +
  `<path d="M${n1(-z * .35)} ${n1(z * .35)} Q0 ${n1(z * .1)} ${n1(z * .35)} ${n1(z * .35)} L0 ${n1(z * .7)}Z" fill="${C.leaf}" ${ink(1)}/>`;

/** a cherry branch: a tapering twig through pts (its first point the thick end), side twigs, blossoms and buds */
function branch(pts, w0, n) {
  let s = '', tips = [];
  const twig = (list, w) => {
    for (let i = 1; i < list.length; i++) {
      const [ax, ay] = list[i - 1], [bx, by] = list[i], k = w * (1 - (i - 1) / list.length * .7);
      const mx = (ax + bx) / 2 + (r() - .5) * 12, my = (ay + by) / 2 + (r() - .5) * 12;
      s += `<path d="M${n1(ax)} ${n1(ay)} Q${n1(mx)} ${n1(my)} ${n1(bx)} ${n1(by)}" fill="none" stroke="${C.ink}" stroke-width="${n1(k + 3)}" stroke-linecap="round"/>`;
      s += `<path d="M${n1(ax)} ${n1(ay)} Q${n1(mx)} ${n1(my)} ${n1(bx)} ${n1(by)}" fill="none" stroke="${C.bark}" stroke-width="${n1(k)}" stroke-linecap="round"/>`;
    }
    tips.push(list[list.length - 1]);
  };
  twig(pts, w0);
  for (let i = 1; i < pts.length - 1; i++) {                       // side twigs, each its own length and turn
    const [x, y] = pts[i], a = Math.atan2(pts[i + 1][1] - y, pts[i + 1][0] - x) + (i % 2 ? 1 : -1) * (.7 + r() * .5), len = 40 + r() * 40;
    twig([[x, y], [x + Math.cos(a) * len * .55, y + Math.sin(a) * len * .55], [x + Math.cos(a + .2) * len, y + Math.sin(a + .2) * len]], w0 * .5);
  }
  const spots = [];
  tips.forEach(([x, y]) => { for (let k = 0; k < 3; k++) spots.push([x + (r() - .5) * 34, y + (r() - .5) * 30]); });
  for (let i = 1; i < pts.length; i++) spots.push([(pts[i - 1][0] + pts[i][0]) / 2 + (r() - .5) * 20, (pts[i - 1][1] + pts[i][1]) / 2 + (r() - .5) * 20]);
  spots.slice(0, n).forEach(([x, y], i) => {
    s += i % 4 === 3 ? g(x, y, r() * 360, 1, bud(9 + r() * 5, pick([C.pink, C.rose, C.pink2]))) : g(x, y, 0, 1, blossom(12 + r() * 8, pick([C.pink2, C.pink, C.cream, C.blush])));
  });
  return s;
}

/* ── the sheet: a plum band with petals and running words, a cream sheet with a stitched edge ── */
function sheet() {
  let s = `<rect width="1280" height="800" fill="${C.band}"/>`;
  const words = [
    [640, 21, 0, 'MƯA HOA ANH ĐÀO  ·  SEE YOU AT THE CROSSING  ·  GA HOA ANH ĐÀO → GA GẶP LẠI  ·  MÙA XUÂN NĂM ẤY', 760],
    [640, 790, 0, 'ĐẶT THIỆP NẰM PHẲNG  ·  LAY THE CARD FLAT  ·  KEEP IT IN VIEW  ·  No. 0404  ·  TUYẾN TÀU MÙA XUÂN', 740],
    [19, 400, -90, 'DỪNG LẠI  ·  NHÌN HAI PHÍA', 250],
    [1262, 400, 90, 'MỘT CHUYẾN TÀU  ·  MỘT LẦN GẶP LẠI', 320]];
  const inWords = (x, y) => words.some(([wx, wy, a, , w]) => a ? Math.abs(x - wx) < 15 && Math.abs(y - wy) < w / 2 + 12 : Math.abs(y - wy + 4) < 15 && Math.abs(x - wx) < w / 2 + 12);
  for (let i = 0; i < 1300; i++) {
    const x = r() * 1280, y = r() * 800;
    if (x > 30 && x < 1250 && y > 30 && y < 770) continue;
    if (inWords(x, y)) continue;
    s += r() < .45 ? g(x, y, r() * 360, 1, petal(5 + r() * 6, pick([C.pink, C.pink2, C.cream, C.rose]), .8)) : `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(1 + r() * 2.6)}" fill="${pick([C.pink2, C.cream, C.pink, C.lilac])}"/>`;
  }
  words.forEach(([x, y, a, str]) => { s += g(x, y, a, 1, T(0, a ? 4 : 0, str, { s: 11.5, ls: 3, anchor: 'middle', fill: C.cream })); });
  s += `<rect x="30" y="30" width="1220" height="740" rx="22" fill="${C.paper}" ${ink(2.6)}/>`;
  let d = '';                                                        // a stitched line, each stitch its own length
  const run = (x0, y0, x1, y1) => { const len = Math.hypot(x1 - x0, y1 - y0); for (let t = 0; t < len;) { const a = 5 + r() * 9, b = 4 + r() * 6, k0 = t / len, k1 = Math.min(1, (t + a) / len); d += `M${n1(x0 + (x1 - x0) * k0)} ${n1(y0 + (y1 - y0) * k0)}L${n1(x0 + (x1 - x0) * k1)} ${n1(y0 + (y1 - y0) * k1)}`; t += a + b; } };
  run(52, 44, 1228, 44); run(1236, 52, 1236, 748); run(1228, 756, 52, 756); run(44, 748, 44, 52);
  s += `<path d="${d}" fill="none" ${ink(1.6, C.deep)}/>`;
  return s;
}

/* ── the title ── */
function title() {
  keep(56, 52, 600, 290); keep(330, 136, 700, 262);                  // the script word runs past the block
  let s = T(70, 146, 'Mưa hoa', { f: F.title, w: 400, s: 88, fill: C.ink, stroke: C.blush, sw: 10 });
  s += T(346, 240, 'anh đào', { f: F.hand, w: 700, s: 112, fill: C.rose, stroke: C.cream, sw: 8 });
  s += T(80, 198, 'See you at the crossing', { f: F.serif, w: 400, style: 'italic', s: 25, fill: C.wine });
  s += `<path d="M80 212 C170 226 230 202 290 216" fill="none" ${ink(2.2, C.rose)}/>`;
  s += `<rect x="82" y="252" width="246" height="26" rx="13" fill="${C.ink}"/>` + T(205, 270, 'MÙA XUÂN · GA HOA ANH ĐÀO', { s: 11.5, ls: 2, anchor: 'middle', fill: C.cream });
  s += g(436, 62, -12, 1, blossom(20, C.pink2)) + g(470, 104, 30, 1, petal(14, C.pink)) + g(352, 268, 0, 1, twinkle(9, C.butter));
  return s;
}

/* ── the station's name board on two posts: this station big, the ones either side under it ── */
function stationBoard() {
  const x = 830, y = 64, w = 384, h = 176;
  keep(x - 12, y - 10, x + w + 12, y + h + 64);
  let s = '';
  for (const px of [x + 60, x + w - 74]) s += `<rect x="${px}" y="${y + h - 6}" width="12" height="62" fill="${C.grey}" ${ink(2)}/>`;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${C.cream}" ${ink(3)}/>`;
  s += `<rect x="${x + 10}" y="${y + 10}" width="${w - 20}" height="${h - 20}" rx="8" fill="none" ${ink(1.2, C.pink)}/>`;
  s += T(x + w / 2, y + 40, 'GA · CHERRY BLOSSOM STATION', { s: 12.5, ls: 2.4, anchor: 'middle', fill: C.wine });
  s += T(x + w / 2, y + 92, 'Hoa Anh Đào', { s: 46, anchor: 'middle', fill: C.ink });
  s += `<path d="M${x + 22} ${y + 112} L${x + w - 22} ${y + 112} L${x + w - 22} ${y + 124} L${x + 22} ${y + 124}Z" fill="${C.rose}" ${ink(1.6)}/>`;
  s += `<path d="M${x + w / 2 - 10} ${y + 108} l10 -8 l10 8 l-10 20z" fill="${C.cream}" ${ink(1.6)}/>`;
  s += T(x + 26, y + 152, '← Ga Mùa Xuân', { s: 15, w: 600, fill: C.ink }) + T(x + w - 26, y + 152, 'Ga Gặp Lại →', { s: 15, w: 600, anchor: 'end', fill: C.deep });
  s += g(x + w - 22, y + 18, 22, 1, blossom(16, C.pink)) + g(x + 18, y + h - 10, -10, 1, blossom(11, C.pink2));
  return s;
}

/* ── a train ticket for two, with a stub, a punched hole and a barcode ── */
function ticket() {
  const x = 62, y = 304, w = 318, h = 176;
  keep(x - 8, y - 14, x + w + 14, y + h + 16);
  let s = `<g transform="${tf(x, y, -3)}">`;
  s += `<path d="M0 12 Q0 0 12 0 L${w - 12} 0 Q${w} 0 ${w} 12 L${w} ${h / 2 - 12} A12 12 0 0 0 ${w} ${h / 2 + 12} L${w} ${h - 12} Q${w} ${h} ${w - 12} ${h} L12 ${h} Q0 ${h} 0 ${h - 12} L0 ${h / 2 + 12} A12 12 0 0 0 0 ${h / 2 - 12}Z" fill="${C.butter}" ${ink(2.4)}/>`;
  s += `<path d="M2 12 Q2 2 12 2 L${w - 80} 2 L${w - 80} 40 L2 40Z" fill="${C.rose}"/>` + T(14, 27, 'VÉ TÀU · ONE WAY FOR TWO', { s: 13, ls: 1.5, fill: C.cream });
  s += `<line x1="${w - 80}" y1="8" x2="${w - 80}" y2="${h - 8}" stroke="${C.ink}" stroke-width="1.6" stroke-dasharray="4 5"/>`;
  s += T(12, 70, 'Ga Hoa Anh Đào → Ga Gặp Lại', { f: F.hand, w: 700, s: 16.5, fill: C.ink });
  [['Toa', '02 · hồng'], ['Ghế', 'cạnh em'], ['Giờ tàu', 'khi hoa rơi'], ['Hạng', 'mãi mãi ♥']].forEach(([k, v], i) => {
    const ly = 96 + i * 20;
    s += T(14, ly, k, { s: 11, w: 600, fill: C.wine }) + T(78, ly, v, { f: F.note, w: 400, s: 18, fill: C.ink });
    s += `<line x1="78" y1="${ly + 4}" x2="${w - 96}" y2="${ly + 4}" stroke="${C.ink}" stroke-width=".8" opacity=".35"/>`;
  });
  for (let bx = w - 66; bx < w - 14;) { const bw = 1 + (r() * 3.6 | 0); s += `<rect x="${n1(bx)}" y="50" width="${bw}" height="56" fill="${C.ink}"/>`; bx += bw + 1 + r() * 2.6; }
  s += g(w - 40, 30, 0, 1, `<circle r="9" fill="${C.paper}" ${ink(1.8)}/>`) + g(w - 40, 140, -90, 1, T(0, 4, 'No. 0404', { s: 10.5, ls: 1.5, anchor: 'middle' }));
  s += g(w - 112, 150, 12, 1, blossom(13, C.pink2));
  return s + '</g>';
}

/* ── the spring line: a route map with its stations, a little train on it, the stop we are going to ── */
function routeMap() {
  const x = 60, y = 508, w = 352, h = 196;
  keep(x - 8, y - 10, x + w + 10, y + h + 10);
  let s = `<g transform="${tf(x, y, 1.6)}"><rect width="${w}" height="${h}" rx="12" fill="${C.cream}" ${ink(2.2)}/>`;
  s += T(16, 28, 'TUYẾN TÀU MÙA XUÂN', { s: 13, ls: 2, fill: C.wine }) + T(w - 16, 28, 'spring line', { f: F.serif, w: 400, style: 'italic', s: 15, anchor: 'end', fill: C.ink });
  const st = [[30, 132, 'Ga Mùa Xuân'], [104, 92, 'Ga Hoa Anh Đào'], [174, 140, 'Chắn tàu'], [244, 96, 'Ga Mưa Hoa'], [308, 128, 'Ga Gặp Lại']];
  let d = `M${st[0][0]} ${st[0][1]}`;
  for (let i = 1; i < st.length; i++) { const [ax, ay] = st[i - 1], [bx, by] = st[i]; d += ` C${n1(ax + 30)} ${ay} ${n1(bx - 30)} ${by} ${bx} ${by}`; }
  s += `<path d="${d}" fill="none" stroke="${C.ink}" stroke-width="11" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${C.teal}" stroke-width="6" stroke-linecap="round"/>`;
  st.forEach(([sx, sy, name], i) => {
    const last = i === st.length - 1;
    s += last ? g(sx, sy, 0, 1, heart(26, C.rose, 2)) : `<circle cx="${sx}" cy="${sy}" r="${i === 1 ? 9 : 7}" fill="${i === 1 ? C.pink : C.cream}" ${ink(2.2)}/>`;
    const ax = i === 0 ? 12 : last ? w - 12 : sx, an = i === 0 ? 'start' : last ? 'end' : 'middle';   // the end labels stay on the card
    s += T(ax, sy + (sy > 115 ? 32 : -18), name, { s: i === 1 || last ? 12.5 : 11, w: i === 1 || last ? 800 : 600, anchor: an, fill: last ? C.deep : C.ink });
  });
  s += g(160, 128, 28, .2, littleTrain(2));                          // on its way between two stops
  s += g(178, 50, 0, 1, blossom(9, C.pink2)) + g(36, 72, 0, 1, twinkle(7, C.butter));
  return s + '</g>';
}

/* ── the little train, seen from the side: cream over rose, lit windows, a rounded nose; its origin is the nose's foot ── */
function littleTrain(cars) {
  let s = '';
  for (let i = 0; i < cars; i++) {
    const x0 = -i * 124 - 118, w = 116;
    const nose = i === 0, back = i === cars - 1;
    const body = `M${x0 + 8} 0 L${x0 + w - (nose ? 26 : 6)} 0 ${nose ? `Q${x0 + w + 2} 0 ${x0 + w + 2} -30 L${x0 + w + 2} -52 Q${x0 + w} -80 ${x0 + w - 28} -82` : `Q${x0 + w} 0 ${x0 + w} -8 L${x0 + w} -74 Q${x0 + w} -82 ${x0 + w - 8} -82`} L${x0 + 8} -82 Q${x0} -82 ${x0} -74 L${x0} -8 Q${x0} 0 ${x0 + 8} 0Z`;
    s += `<path d="${body}" fill="${C.tcream}" ${ink(2.4)}/>`;
    s += `<path d="M${x0 + 1.5} -38 L${x0 + w - (nose ? 0 : 1.5)} -38 L${x0 + w - (nose ? -1 : 1.5)} -10 Q${x0 + w - 4} -1.5 ${x0 + w - (nose ? 24 : 8)} -1.5 L${x0 + 8} -1.5 Q${x0 + 1.5} -1.5 ${x0 + 1.5} -8Z" fill="${C.trose}"/>`;
    s += `<line x1="${x0 + 1}" y1="-39" x2="${x0 + w + (nose ? 1 : 0)}" y2="-39" ${ink(1.6)}/>`;
    const wins = nose ? [[8, 24], [40, 24], [72, 22]] : [[8, 26], [44, 26], [80, 26]];
    wins.forEach(([wx, ww], k) => {
      s += `<rect x="${x0 + wx}" y="-72" width="${ww}" height="26" rx="5" fill="${C.warm}" ${ink(1.8)}/>`;
      if ((i + k) % 2) s += `<circle cx="${n1(x0 + wx + ww * .55)}" cy="-56" r="5.5" fill="${pick([C.wine, C.glass, C.bark])}"/><rect x="${n1(x0 + wx + ww * .55 - 7)}" y="-50" width="14" height="5" rx="2.5" fill="${pick([C.wine, C.glass])}"/>`;
    });
    if (nose) s += `<path d="M${x0 + 100} -72 L${x0 + 108} -72 Q${x0 + 115} -66 ${x0 + 116} -50 L${x0 + 100} -50Z" fill="${C.glass}" ${ink(1.6)}/><circle cx="${x0 + 110}" cy="-22" r="5" fill="${C.butter}" ${ink(1.4)}/>`;
    s += g(x0 + w / 2, -22, 0, 1, blossom(8, C.cream));
    for (const wx of [18, w - 20]) s += `<circle cx="${x0 + wx}" cy="2" r="9" fill="${C.black}" ${ink(1.6)}/><circle cx="${x0 + wx}" cy="2" r="3" fill="${C.grey}"/>`;
    s += `<rect x="${x0 + w / 2 - 22}" y="-90" width="44" height="9" rx="3" fill="${C.grey}" ${ink(1.4)}/>`;
    if (!back) s += `<rect x="${x0 - 8}" y="-62" width="8" height="44" fill="${C.black}"/>`;
  }
  return s;
}
/** the train on its own piece of track, petals flying behind it */
function trainScene() {
  const x = 1222, y = 704;
  keep(960, 590, 1236, 726);
  let s = `<line x1="958" y1="${y + 13}" x2="1238" y2="${y + 13}" ${ink(3)}/>`;
  for (let sx = 966; sx < 1232;) { s += `<rect x="${n1(sx)}" y="${y + 13}" width="${n1(8 + r() * 4)}" height="7" fill="${C.bark}" ${ink(1)}/>`; sx += 16 + r() * 9; }
  s += g(x, y, 0, .92, littleTrain(2));
  for (let i = 0; i < 9; i++) s += g(968 + r() * 40, 618 + r() * 80, r() * 360, 1, petal(7 + r() * 5, pick([C.pink, C.pink2, C.rose])));
  return s;
}

/* ── a crossing sign: the crossbuck in yellow and black, two red lamps (one lit), the arrow, a plate ── */
function crossingSign() {
  const x = 930, top = 300, foot = 600;
  keep(x - 82, top - 40, x + 80, foot + 10);
  let s = `<rect x="${x - 5}" y="${top}" width="10" height="${foot - top}" fill="${C.grey}" ${ink(2)}/>`;
  for (let y = foot - 90; y < foot; y += 15) s += `<path d="M${x - 5} ${y} L${x + 5} ${y - 8} L${x + 5} ${y - 1} L${x - 5} ${y + 7}Z" fill="${C.black}"/>`;
  s += `<rect x="${x - 7}" y="${foot - 92}" width="14" height="92" fill="none" ${ink(2)}/><rect x="${x - 7}" y="${foot - 92}" width="14" height="92" fill="${C.yellow}" opacity=".45"/>`;
  s += `<rect x="${x - 22}" y="${foot - 8}" width="44" height="12" rx="3" fill="${C.grey}" ${ink(2)}/>`;
  for (const a of [32, -32]) {                                       // the crossbuck: stripes drawn one by one
    let b = `<rect x="-78" y="-11" width="156" height="22" rx="3" fill="${C.yellow}" ${ink(2.4)}/>`;
    for (let sx = -70; sx < 70; sx += 17 + (r() - .5) * 3) b += `<path d="M${n1(sx)} 10 L${n1(sx + 8)} 10 L${n1(sx + 15)} -10 L${n1(sx + 7)} -10Z" fill="${C.black}"/>`;
    s += g(x, top + 26, a, 1, b);
  }
  s += `<rect x="${x - 58}" y="${top + 82}" width="116" height="14" rx="4" fill="${C.black}" ${ink(1.6)}/>`;
  for (const [side, lit] of [[-1, true], [1, false]]) {
    const lx = x + side * 40, ly = top + 89;
    if (lit) for (let k = 0; k < 9; k++) { const a = -160 + k * 18 + (r() - .5) * 6, [ax, ay] = pt(lx, ly, 34, a), [bx, by] = pt(lx, ly, 50 + r() * 14, a); s += `<path d="M${ax} ${ay} L${bx} ${by}" ${ink(2.2, C.red)}/>`; }
    s += `<circle cx="${lx}" cy="${ly}" r="27" fill="${C.black}" ${ink(1.6)}/><circle cx="${lx}" cy="${ly}" r="17" fill="${lit ? '#ff5a4a' : '#8a1d24'}" ${ink(1.6)}/>`;
    s += `<path d="M${lx - 22} ${ly - 12} Q${lx} ${ly - 36} ${lx + 22} ${ly - 12}" fill="none" ${ink(4, C.black)}/>`;
    if (lit) s += `<circle cx="${lx - 5}" cy="${ly - 6}" r="5" fill="#ffd2c8"/>`;
  }
  s += `<rect x="${x - 34}" y="${top + 124}" width="68" height="26" rx="4" fill="${C.black}" ${ink(1.6)}/>`;
  s += `<path d="M${x - 20} ${top + 133} L${x + 6} ${top + 133} L${x + 6} ${top + 128} L${x + 22} ${top + 137} L${x + 6} ${top + 146} L${x + 6} ${top + 141} L${x - 20} ${top + 141}Z" fill="${C.yellow}"/>`;
  s += `<rect x="${x - 70}" y="${top + 166}" width="140" height="52" rx="8" fill="${C.cream}" ${ink(2.2)}/>`;
  s += T(x, top + 188, 'DỪNG LẠI', { s: 16, ls: 2, anchor: 'middle', fill: C.red }) + T(x, top + 208, 'nhìn hai phía', { f: F.hand, w: 700, s: 18, anchor: 'middle', fill: C.ink });
  s += `<circle cx="${x}" cy="${top - 6}" r="11" fill="${C.black}" ${ink(1.6)}/>`;
  return s;
}

/* ── the middle, where the act stands: a little crossing seen from above, a heart where the lane meets the tracks ── */
function stage() {
  const x0 = 438, x1 = 842, y0 = 396, y1 = 690;
  keep(x0 - 10, y0 - 10, x1 + 10, y1 + 54);
  let s = `<path d="M${x0 + 20} ${y0} L${x1 - 16} ${y0 + 4} Q${x1 + 2} ${y0 + 6} ${x1} ${y0 + 26} L${x1 + 6} ${y1 - 20} Q${x1 + 6} ${y1} ${x1 - 14} ${y1 + 2} L${x0 + 8} ${y1 - 2} Q${x0 - 10} ${y1 - 4} ${x0 - 8} ${y1 - 24} L${x0} ${y0 + 20} Q${x0} ${y0 + 2} ${x0 + 20} ${y0}Z" fill="${C.blush}" ${ink(2.8)}/>`;
  s += `<rect x="584" y="${y0 + 4}" width="112" height="${y1 - y0 - 6}" fill="#cbbdcc" ${ink(1.6)}/>`;             // the lane
  for (const lx of [596, 684]) s += `<line x1="${lx}" y1="${y0 + 10}" x2="${lx}" y2="${y1 - 8}" stroke="${C.cream}" stroke-width="4"/>`;
  const ty = 520;                                                    // the tracks across, sleepers each their own
  for (let sx = x0 + 8; sx < x1 - 10;) { if (sx < 580 || sx > 700) s += `<rect x="${n1(sx)}" y="${n1(ty - 30 + (r() - .5) * 4)}" width="${n1(9 + r() * 4)}" height="${n1(58 + r() * 5)}" fill="${pick([C.bark, '#86624f', '#7d5c4a'])}" ${ink(1.2)}/>`; sx += 18 + r() * 8; }
  for (const ry of [ty - 18, ty + 18]) s += `<line x1="${x0 + 4}" y1="${ry}" x2="${x1 - 4}" y2="${ry}" ${ink(3.2)}/>`;
  for (let i = 0; i < 170; i++) {                                    // gravel either side of the rails
    const gx = x0 + 10 + r() * (x1 - x0 - 20), gy = ty + (r() - .5) * 92;
    if (gx > 580 && gx < 700) continue;
    s += `<circle cx="${n1(gx)}" cy="${n1(gy)}" r="${n1(1.4 + r() * 2.2)}" fill="${pick(['#e9dce3', '#d8c8d2', '#f4ecf0'])}" ${ink(.8)}/>`;
  }
  for (let yy = y0 + 18; yy < y1 - 12;) { s += `<line x1="640" y1="${n1(yy)}" x2="640" y2="${n1(yy + 10 + r() * 6)}" stroke="${C.cream}" stroke-width="3"/>`; yy += 22 + r() * 8; }
  for (const sy of [ty - 62, ty + 60]) s += `<line x1="600" y1="${sy}" x2="680" y2="${sy + (r() - .5) * 3}" stroke="${C.cream}" stroke-width="5"/>`;
  for (const [cx, cy] of [[470, 430], [548, 650], [742, 438], [806, 640], [470, 600], [806, 470]]) {   // tufts with a flower or two
    let t = '';
    for (let k = 0; k < 5; k++) t += `<path d="M${n1((k - 2) * 4)} 0 Q${n1((k - 2) * 6 + (r() - .5) * 6)} ${n1(-8 - r() * 6)} ${n1((k - 2) * 8 + (r() - .5) * 8)} ${n1(-14 - r() * 9)}" fill="none" ${ink(2, C.moss)}/>`;
    s += g(cx, cy, 0, 1, t + g(-6 + r() * 12, -16, 0, 1, blossom(6 + r() * 3, pick([C.cream, C.pink2]))));
  }
  s += g(640, ty, -4, 1, heart(78, C.cream, 3)) + g(640, ty, -4, 1, `<path d="M0 22 C-36 0 -24 -36 0 -16 C24 -36 36 0 0 22Z" fill="${C.rose}" ${ink(2)}/>`);
  s += T(640, y0 + 46, 'hẹn nhau ở đây', { f: F.hand, w: 700, s: 26, anchor: 'middle', fill: C.ink, stroke: C.blush, sw: 6 });
  s += T(640, y1 - 26, 'bên này · bên kia đường ray', { f: F.note, w: 400, s: 18, anchor: 'middle', fill: C.wine, stroke: C.blush, sw: 5 });
  for (let i = 0; i < 46; i++) { const px = x0 + 20 + r() * (x1 - x0 - 40), py = y0 + 16 + r() * (y1 - y0 - 32); if (Math.abs(py - ty) < 52 || Math.abs(px - 640) < 70 && Math.abs(py - ty) < 90 || Math.abs(py - y0 - 40) < 18 && Math.abs(px - 640) < 100 || Math.abs(py - y1 + 30) < 16 && Math.abs(px - 640) < 140) continue; s += g(px, py, r() * 360, 1, petal(7 + r() * 6, pick([C.pink, C.rose, C.cream, C.pink2]))); }
  const ry = y1 + 32;                                                // the instruction ribbon
  s += `<path d="M450 ${ry - 16} L830 ${ry - 16} L814 ${ry} L830 ${ry + 16} L450 ${ry + 16} L466 ${ry}Z" fill="${C.ink}" ${ink(2)}/>`;
  s += T(640, ry + 5, 'Đặt thiệp nằm phẳng, hướng điện thoại vào đây', { s: 14.5, w: 600, anchor: 'middle', fill: C.cream });
  return s;
}

/* ── a verse on a slip of ruled paper ── */
function verse() {
  const x = 566, y = 270;
  keep(x - 10, y - 26, x + 250, y + 74);
  let s = `<g transform="${tf(x, y, 2)}"><rect x="0" y="-18" width="236" height="84" rx="6" fill="${C.cream}" ${ink(1.8)}/>`;
  [10, 34, 58].forEach(ly => { s += `<line x1="10" y1="${ly}" x2="226" y2="${ly}" stroke="${C.sky2}" stroke-width="1.1"/>`; });
  s += `<line x1="30" y1="-12" x2="30" y2="62" stroke="${C.pink}" stroke-width="1.4"/>`;
  s += T(40, 6, 'Có những mùa hoa', { f: F.hand, w: 700, s: 21, fill: C.ink }) + T(40, 31, 'chỉ để đợi một người', { f: F.hand, w: 700, s: 21, fill: C.ink });
  s += T(40, 55, '· mùa xuân năm ấy ·', { f: F.note, w: 400, s: 15, fill: C.wine });
  return s + g(212, 46, 14, 1, heart(16, C.rose, 1.5)) + '</g>';
}

/* ── a stamp with a blossom and a little train, and a postmark with its words on arcs ── */
function stamps() {
  let s = '';
  const sx = 1162, sy = 470;
  keep(sx - 62, sy - 72, sx + 62, sy + 72);
  let edge = '';
  const W = 46, H = 58;
  const side = (x0, y0, x1, y1) => { const n = 9; for (let i = 0; i < n; i++) { const a = i / n, b = (i + 1) / n, m = (a + b) / 2; const mx = x0 + (x1 - x0) * m, my = y0 + (y1 - y0) * m, nx = -(y1 - y0), ny = x1 - x0, l = Math.hypot(nx, ny), k = 3.4 + r() * 1.2; edge += ` L${n1(x0 + (x1 - x0) * a)} ${n1(y0 + (y1 - y0) * a)} Q${n1(mx - nx / l * k)} ${n1(my - ny / l * k)} ${n1(x0 + (x1 - x0) * b)} ${n1(y0 + (y1 - y0) * b)}`; } };
  side(-W, -H, W, -H); side(W, -H, W, H); side(W, H, -W, H); side(-W, H, -W, -H);
  s += g(sx, sy, 5, 1, `<path d="M${-W} ${-H}${edge}Z" fill="${C.cream}" ${ink(2)}/>` + `<rect x="-36" y="-48" width="72" height="80" fill="${C.sky}" ${ink(1.6)}/>` +
    `<path d="M-36 14 Q-10 2 36 10 L36 32 L-36 32Z" fill="${C.leaf}" ${ink(1.2)}/>` + g(4, -16, 10, 1, blossom(24, C.pink2)) +
    g(-12, 26, 0, .22, littleTrain(1)) + T(0, 48, '4.04đ', { s: 11, anchor: 'middle' }) + g(26, -38, 0, 1, twinkle(6, C.butter, 1)));
  const mark = (cx, cy, rr, top, bottom, a, id) => {
    let m = `<g transform="${tf(cx, cy, a)}" opacity=".9"><circle r="${rr}" fill="none" ${ink(2.2, C.deep)}/><circle r="${rr - 14}" fill="none" ${ink(1.4, C.deep)}/>`;
    m += `<path id="arcT${id}" d="M${-rr + 7} 0 A${rr - 7} ${rr - 7} 0 0 1 ${rr - 7} 0" fill="none"/><path id="arcB${id}" d="M${-rr + 7} 0 A${rr - 7} ${rr - 7} 0 0 0 ${rr - 7} 0" fill="none"/>`;
    m += `<text font-family="${F.sans}" font-weight="800" font-size="10" letter-spacing="1.8" fill="${C.deep}"><textPath href="#arcT${id}" startOffset="50%" text-anchor="middle">${top}</textPath></text>`;
    m += `<text font-family="${F.sans}" font-weight="800" font-size="10" letter-spacing="1.8" fill="${C.deep}" dy="9"><textPath href="#arcB${id}" startOffset="50%" text-anchor="middle">${bottom}</textPath></text>`;
    return m + T(0, 5, '04·04', { s: 13, anchor: 'middle', fill: C.deep }) + `<path d="M${-rr - 84} -10 q20 -8 40 0 t40 0 M${-rr - 84} 4 q20 -8 40 0 t40 0" fill="none" ${ink(1.8, C.deep)}/></g>`;
  };
  keep(980, 368, 1120, 470);
  s += mark(1074, 420, 44, 'GA HOA ANH ĐÀO', 'MÙA XUÂN NĂM ẤY', -10, 'a');
  keep(56, 708, 356, 754);
  s += g(70, 736, 0, 1, T(0, 0, 'Gửi người bên kia đường ray', { f: F.hand, w: 700, s: 22, fill: C.wine }));
  return s;
}

/* ── the scatter: petals, blossoms, sparkles and hearts where nothing else is ── */
function scatter() {
  let s = '';
  for (let i = 0, placed = 0; i < 8000 && placed < 230; i++) {
    const x = 50 + r() * 1180, y = 50 + r() * 700;
    if (blocked(x, y, 8)) continue;
    keep(x - 9, y - 9, x + 9, y + 9); placed++;
    const k = r();
    s += g(x, y, r() * 360, 1, k < .42 ? petal(8 + r() * 8, pick([C.pink, C.pink2, C.rose, C.cream])) : k < .62 ? blossom(7 + r() * 6, pick([C.pink2, C.cream, C.pink]))
      : k < .76 ? twinkle(5 + r() * 5, pick([C.butter, C.cream, C.mint])) : k < .9 ? heart(9 + r() * 9, pick([C.pink, C.rose, C.blush])) : `<circle r="${n1(2 + r() * 3)}" fill="${pick([C.ink, C.rose, C.teal])}"/>`);
  }
  return s;
}

svg.innerHTML = sheet() + branch([[600, 32], [650, 70], [700, 96], [760, 112], [806, 150]], 9, 16) + branch([[1252, 318], [1206, 334], [1160, 356], [1110, 366], [1064, 392]], 10, 15)
  + title() + stationBoard() + ticket() + routeMap() + crossingSign() + verse() + stamps() + trainScene() + stage() + scatter();
window.__ready = true;
</script>
